const duurTekst = m => m < 60 ? `${m} min` : `${Math.floor(m/60)} u${m%60 ? " " + (m%60) + " min" : ""}`;
function momentTekst(iso, minuten){
  const b = new Date(iso), e = new Date(b.getTime() + (minuten||30)*60000);
  const tijd = d => d.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
  return `${b.toLocaleDateString("nl-NL",{weekday:"short",day:"numeric",month:"short"})} · ${tijd(b)}–${tijd(e)}`;
}
const vindItem = id => [...D.zelf, ...D.wacht, ...D.info, ...D.overgeslagen].find(i => i.id === id);
let taak = null;   // {id, item, voorstel, minuten, inplannen, start(ms), dag, archiveren}
const dagen = {};  // datum -> lijst afspraken | "laden" | {fout}
const legeDagen = () => Object.keys(dagen).forEach(k => delete dagen[k]);   // agenda opnieuw ophalen
const PX = 0.8;    // pixels per minuut in het dagoverzicht bij Taak maken
let PLPX = 0.8;    // in Planning: zo dat de werkdag het paneel vult (zie plTijdlijnHTML)
const kortTitel = t => String(t || "").split(" · begin met:")[0];
// rode lijn op het huidige moment, als de getoonde dag vandaag is
function nuLijn(dag, van, tot, schaal){
  if (dag !== isoDag(new Date())) return "";
  const nu = new Date(), m = nu.getHours() * 60 + nu.getMinutes();
  if (m < van || m > tot) return "";
  return `<div class="nu-lijn" style="top:${(m - van) * schaal}px" title="Nu, ${tijdVan(nu.getTime())}"></div>`;
}
// afspraken: vrije als achtergrond, bezette naast elkaar als ze overlappen
function afsprakenHTML(lijst, d0, van, tot, schaal, kalenderInTitel, klikbaar){
  const y = m => (m - van) * schaal;
  const alle = lijst.map((a, i) => ({...a, i})).filter(a => !a.heledag).map(a => ({...a, b: Math.max(van, (Date.parse(a.start)-d0)/60000), e: Math.min(tot, (Date.parse(a.eind)-d0)/60000)}))
                    .filter(a => a.e > a.b).sort((p, q) => p.b - q.b);
  let h = "";
  alle.filter(a => a.vrij && !isFocus(a)).forEach(a => {
    h += `<div class="afs-vrij" style="top:${y(a.b)}px;height:${Math.max(16, (a.e-a.b)*schaal - 2)}px" title="${esc(a.titel)} (telt als vrij)"><span>${esc(a.titel)}</span></div>`;
  });
  // alleen afspraken die elkaar echt overlappen delen de breedte; de rest krijgt de hele breedte
  const bezet = alle.filter(a => !a.vrij || isFocus(a)), groepen = [];
  let groep = null, groepEind = -1;
  bezet.forEach(a => { if (!groep || a.b >= groepEind){ groep = []; groepen.push(groep); groepEind = a.e; } else groepEind = Math.max(groepEind, a.e); groep.push(a); });
  groepen.forEach(g => {
    const kolEind = [];
    g.forEach(a => { let k = kolEind.findIndex(e => e <= a.b); if (k < 0){ k = kolEind.length; kolEind.push(0); } kolEind[k] = a.e; a.kol = k; });
    g.forEach(a => { a.n = Math.max(1, kolEind.length); });
  });
  bezet.forEach(a => {
    const hoog = Math.max(14, (a.e-a.b)*schaal - 2), n = a.n, sleep = klikbaar && sleepbaar(a);
    const taak = klikbaar ? appTaakBij(a) : null, soort = taak ? "taak" : isFocus(a) ? "" : (a.soort || "");
    const anderen = (a.deelnemers || []).filter(d => !d.ik).length;
    const voor = soort === "overleg" ? `<span class="afs-ik" title="Vergadering met ${anderen} ${anderen === 1 ? "ander" : "anderen"}">${ik("mensen")}${anderen}</span>`
      : soort === "les" ? `<span class="afs-ik" title="Les">${ik("les")}</span>`
      : soort === "taak" ? `<span class="afs-ik" title="Taak uit de app">${ik("check")}<span class="stip" style="background:${kleur(taak.project)}"></span></span>` : "";
    h += `<div class="afs${isFocus(a) ? " focus" : ""}${soort ? " soort-" + soort : ""}${hoog < 30 ? " smal" : ""}${klikbaar ? " klik" : ""}${sleep ? " sleepbaar" : ""}"${klikbaar ? ` data-afs="${a.i}" tabindex="0"` : ""} style="top:${y(a.b)}px;height:${hoog}px;left:${a.kol*100/n}%;width:calc(${100/n}% - 3px)${hoog < 30 ? `;line-height:${hoog - 2}px` : ""}"
      title="${esc(a.titel)}${kalenderInTitel && a.kalender ? " · " + esc(a.kalender) : ""}${sleep ? " · sleep om te verzetten" : ""}">${voor}${esc(kortTitel(a.titel))}${isFocus(a) ? " · beschermd" : ""}${sleep ? `<div class="rek" title="Sleep om langer of korter te maken"></div>` : ""}</div>`;
  });
  return h;
}
const tweeCijfers = n => String(n).padStart(2, "0");
const isoDag = d => `${d.getFullYear()}-${tweeCijfers(d.getMonth()+1)}-${tweeCijfers(d.getDate())}`;
const lokaalIso = ms => { const d = new Date(ms); return `${isoDag(d)}T${tweeCijfers(d.getHours())}:${tweeCijfers(d.getMinutes())}`; };
const dagBegin = dag => new Date(dag + "T00:00").getTime();
const uurMin = t => { const [h, m] = t.split(":").map(Number); return h*60 + m; };
const kortMoment = iso => { const d = new Date(iso);
  return `${d.toLocaleDateString("nl-NL",{weekday:"short",day:"numeric",month:"short"})} ${tweeCijfers(d.getHours())}:${tweeCijfers(d.getMinutes())}`; };

async function laadDag(dag){
  if (dagen[dag] !== undefined) return;
  dagen[dag] = "laden";
  try {
    const r = await fetch("/api/dag", {method:"POST", headers:{"Content-Type":"application/json","X-Token":TOKEN}, body:JSON.stringify({datum:dag})});
    const j = await r.json();
    dagen[dag] = j.ok ? j.afspraken : {fout: j.melding};
  } catch(e){ dagen[dag] = {fout: "Agenda niet bereikbaar"}; }
  if (taak && taak.dag === dag) tekenTaak();
  else if (staat.tab === "planning" && staat.planDag === dag) teken();
  else if (staat.tab === "te_doen" && dag === isoDag(new Date())) teken();   // afspraken in het overzicht van vandaag
}

function zetStart(ms){
  taak.start = ms; taak.dag = isoDag(new Date(ms)); taak.inplannen = true; taak.scrollen = true;
  laadDag(taak.dag);
}

function botsingen(){
  const lijst = Array.isArray(dagen[taak.dag]) ? dagen[taak.dag] : [];
  const b = taak.start, e = b + taak.minuten*60000;
  return lijst.filter(a => !a.heledag && !a.vrij && Date.parse(a.start) < e && Date.parse(a.eind) > b);
}

function tijdlijnBereik(){
  const w = taak.voorstel.werktijd || {begin:"09:00", eind:"17:00"};
  const sMin = Math.round((taak.start - dagBegin(taak.dag)) / 60000);
  const van = Math.max(0, Math.min(uurMin(w.begin) - 60, Math.floor(sMin/60)*60));
  const tot = Math.min(24*60, Math.max(uurMin(w.eind) + 60, Math.ceil((sMin + taak.minuten)/60)*60));
  return {van, tot, w};
}

function tijdlijnHTML(){
  const lijst = dagen[taak.dag];
  if (lijst === undefined || lijst === "laden") return `<div class="tijdlijn"><div class="tl-laden">Agenda laden…</div></div>`;
  if (lijst.fout) return `<div class="melding">${ik("alert")}<div>${esc(lijst.fout)}</div></div>`;
  const {van, tot, w} = tijdlijnBereik(), d0 = dagBegin(taak.dag);
  const y = min => (min - van) * PX;
  let h = "";
  // buiten werktijd
  if (uurMin(w.begin) > van) h += `<div class="buiten" style="top:0;height:${y(uurMin(w.begin))}px"></div>`;
  if (uurMin(w.eind) < tot) h += `<div class="buiten" style="top:${y(uurMin(w.eind))}px;height:${y(tot)-y(uurMin(w.eind))}px"></div>`;
  for (let m = van; m < tot; m += 30)
    h += `<div class="uur${m % 60 ? " half" : ""}" style="top:${y(m)}px">${m % 60 ? "" : `<span>${tweeCijfers(m/60)}:00</span>`}</div>`;
  h += afsprakenHTML(lijst, d0, van, tot, PX, true) + nuLijn(taak.dag, van, tot, PX);
  // de nieuwe taak
  const sMin = (taak.start - d0)/60000, bots = botsingen();
  h += `<div class="tb${bots.length ? " botst" : ""}" id="tb" style="top:${y(sMin)}px;height:${taak.minuten*PX - 2}px">
          <b>${esc(document.getElementById("t-titel")?.value || taak.voorstel.titel)}</b><span id="tb-tijd">${blokTijd()}</span><div class="rek"></div></div>`;
  const heledag = lijst.filter(a => a.heledag);
  return (heledag.length ? `<div class="heledag">${heledag.map(a => `<span>${esc(a.titel)}</span>`).join("")}</div>` : "") +
    `<div class="tijdlijn" id="tijdlijn"><div class="tl-binnen" id="tl-binnen" data-van="${van}" style="height:${(tot-van)*PX}px">${h}</div></div>` +
    (bots.length ? `<div class="melding fout">${ik("alert")}<div>Overlapt met ${esc(bots.map(a => a.titel).join(", "))}</div></div>` : "");
}

const tijdVan = ms => { const d = new Date(ms); return `${tweeCijfers(d.getHours())}:${tweeCijfers(d.getMinutes())}`; };

function blokTijd(){
  const b = new Date(taak.start), e = new Date(taak.start + taak.minuten*60000);
  return ` ${tweeCijfers(b.getHours())}:${tweeCijfers(b.getMinutes())}–${tweeCijfers(e.getHours())}:${tweeCijfers(e.getMinutes())} · ${duurTekst(taak.minuten)}`;
}

async function openTaak(id){
  const it = vindItem(id);
  if (!it) return;
  staat.open = null;
  taak = {id, item: it, voorstel: null, minuten: 30, inplannen: false, start: null, dag: null,
          archiveren: false};
  tekenTaak();
  try {
    const r = await fetch("/api/taak-voorstel", {method:"POST", headers:{"Content-Type":"application/json","X-Token":TOKEN}, body:JSON.stringify({id})});
    const j = await r.json();
    if (!taak || taak.id !== id) return;
    if (!j.ok){ toast(j.melding, true); return sluitPaneel(); }
    taak.voorstel = j.voorstel; taak.minuten = j.voorstel.minuten;
    if (j.voorstel.momenten.length) zetStart(Date.parse(j.voorstel.momenten[0]));
    else if (!j.voorstel.agenda_fout){ const m = new Date(); m.setDate(m.getDate()+1); m.setHours(9,0,0,0); taak.start = m.getTime(); taak.dag = isoDag(m); }
    tekenTaak();
  } catch(e){ toast("Geen verbinding met mailagent", true); sluitPaneel(); }
}

function tekenTaak(){
  const p = document.getElementById("paneel"), it = taak.item, a = afzender(it.van), v = taak.voorstel;
  p.dataset.id = "";
  const kop = `<div class="p-kop">${avatar(it)}<div style="min-width:0"><h2>Taak maken</h2>
      <div class="van">${esc(it.onderwerp)} · ${esc(a.naam)}</div></div>
      <button class="ikoon" id="sluit" title="Sluiten (Esc)">${ik("x")}</button></div>`;
  if (!v){
    p.innerHTML = kop + `<div class="p-inhoud"><div class="laden">${ik("refresh")}<div><b style="color:var(--tekst)">Claude schat de taak in</b><br>tijd, stappen en vrije momenten in je agenda</div></div></div>`;
  } else {
    const duren = [15,30,45,60,90,120,180,240];
    if (!duren.includes(taak.minuten)) duren.push(taak.minuten), duren.sort((x,y)=>x-y);
    const inhoudOud = p.querySelector(".p-inhoud"), tlOud = document.getElementById("tijdlijn");
    const scrollInhoud = inhoudOud ? inhoudOud.scrollTop : 0, scrollTl = tlOud ? tlOud.scrollTop : null;
    const chips = v.momenten.map(m => `<button class="keuze${taak.inplannen && taak.start===Date.parse(m)?" aan":""}" data-moment="${m}">${esc(kortMoment(m))}</button>`).join("")
      + `<button class="keuze${!taak.inplannen?" aan":""}" data-moment="">Niet inplannen</button>`;
    const dagLabel = taak.dag ? new Date(taak.dag + "T12:00").toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long"}) : "";
    p.innerHTML = kop + `<div class="p-inhoud">
      <div class="melding info">${ik("sparkle")}<div>${esc(v.toelichting)}</div></div>
      <div class="veld"><div class="label">Taak</div><textarea class="groei" rows="1" id="t-titel">${esc(document.getElementById("t-titel")?.value ?? v.titel)}</textarea></div>
      <div class="veld"><div class="label">${ik("clock")}Geschatte tijd</div>
        <div class="keuzes">${duren.map(d => `<button class="keuze${d===taak.minuten?" aan":""}" data-duur="${d}">${duurTekst(d)}</button>`).join("")}</div></div>
      <div class="veld"><div class="label">${ik("task")}Wat te doen (één stap per regel)</div>
        <textarea id="t-stappen">${esc(document.getElementById("t-stappen")?.value ?? v.stappen.join("\n"))}</textarea></div>
      <div class="veld"><div class="label">Deadline</div><input type="date" id="t-deadline" value="${esc(document.getElementById("t-deadline")?.value ?? (v.deadline || ""))}"></div>
      <div class="veld"><div class="label">${ik("calendar")}Inplannen in je agenda</div>
        ${v.agenda_fout ? `<div class="melding">${ik("alert")}<div>${esc(v.agenda_fout)}</div></div>` : ""}
        ${v.agenda_fout ? "" : `<div class="keuzes">${chips}</div>`}
        ${!v.agenda_fout && taak.inplannen ? `
          <div class="tijdvelden"><input type="date" id="t-datum" value="${taak.dag}" aria-label="Datum">
            <input type="time" id="t-tijd" step="900" value="${tijdVan(taak.start)}" aria-label="Begintijd">
            <span id="t-tot">tot ${tijdVan(taak.start + taak.minuten*60000)}</span></div>
          <div class="dagnav"><button class="ikoon" data-dagstap="-1" title="Vorige dag">${ik("chevron").replace("<path", '<path transform="rotate(180 12 12)"')}</button>
            <b>${esc(dagLabel)}</b><button class="ikoon" data-dagstap="1" title="Volgende dag">${ik("chevron")}</button>
            <span class="meta">Versleep het blok, rek de onderkant, of klik op een tijd</span></div>
          ${tijdlijnHTML()}` : ""}
      </div>
      ${it.status === "ter_info" || it.status === "genegeerd" ? `<label class="vinkregel"><input type="checkbox" class="vink" id="t-archief" ${taak.archiveren?"checked":""}> Mail archiveren (blijft aan de taak gekoppeld)</label>` : ""}
    </div>
    <div class="p-voet"><span class="uitleg">${taak.inplannen ? "Maakt een afspraak in je agenda, die naar Outlook synchroniseert." : "Komt in je takenlijst."}</span>
      <button class="knop" id="sluit2">Annuleren</button>
      <button class="knop goed" id="taakmaak">${ik("check")}${taak.inplannen ? "Maken en inplannen" : "Taak maken"}</button></div>`;
    const inhoudNieuw = p.querySelector(".p-inhoud"), tl = document.getElementById("tijdlijn");
    if (inhoudNieuw) inhoudNieuw.scrollTop = scrollInhoud;
    if (tl){
      if (taak.scrollen){ const tb = document.getElementById("tb"); tl.scrollTop = Math.max(0, tb.offsetTop - 70); taak.scrollen = false; }
      else if (scrollTl !== null) tl.scrollTop = scrollTl;
    }
  }
  p.classList.add("open"); p.setAttribute("aria-hidden","false");
  document.getElementById("dek").classList.add("open");
}

async function bevestigTaak(){
  const v = taak, start = v.inplannen && v.start ? lokaalIso(v.start) : null;
  const data = {id: v.id, titel: document.getElementById("t-titel").value, stappen: document.getElementById("t-stappen").value.split("\n"),
                minuten: v.minuten, deadline: document.getElementById("t-deadline").value || null, start: start || null,
                archiveren: !!document.getElementById("t-archief")?.checked};
  const volgende = drieKolommen() && staat.tab === "te_doen" ? volgendeNa(v.id) : null;
  sluitPaneel();
  if (volgende !== null) staat.open = volgende;
  const weg = [v.id];   // verdwijnt uit Beoordelen of Opruimen; de mail staat daarna bij de taak
  weg.forEach(i => verborgen.add(i)); teken();
  const ok = await actie("taak-maak", data);
  weg.forEach(i => verborgen.delete(i));
  if (!ok){ taak = v; tekenTaak(); }
  laad();
}

// taken uit een mail: bewerkbare kopie per mail, blijft bewaard als de lijst ververst
const bewerkt = {};
function bewerkTaken(it){
  if (!bewerkt[it.id]) bewerkt[it.id] = [
    {omschrijving: `${it.actie === "delegeren" ? "Doorsturen" : "Beantwoorden"}: ${it.onderwerp}`,
     deadline: it.deadline || "", minuten: 15, antwoord: true},
    ...it.taken.map(t => ({omschrijving: t.omschrijving, deadline: t.deadline || "", minuten: t.minuten || ""}))];
  return bewerkt[it.id];
}
// tekstvakken die meegroeien met hun inhoud (taken, taaktitel)
function rekVelden(root = document){
  root.querySelectorAll("textarea.groei").forEach(t => { t.style.height = "auto"; t.style.height = t.scrollHeight + 2 + "px"; });
}
new MutationObserver(() => rekVelden(document.getElementById("paneel"))).observe(document.getElementById("paneel"), {childList: true});
window.addEventListener("resize", () => { rekVelden(); if (staat.tab === "planning" && !plaatsing) teken(); });
setInterval(() => {   // nu-lijn bijwerken, alleen als je niet aan het slepen of plaatsen bent
  if (D && staat.tab === "planning" && !plaatsing && !gekozenKaart && !afsSleep && document.querySelector(".nu-lijn, #pl-binnen")) teken();
}, 60000);
document.addEventListener("keydown", ev => {
  // Enter in een taakveld maakt geen nieuwe regel; Shift+Enter wel
  if (ev.key === "Enter" && !ev.shiftKey && !ev.metaKey && !ev.ctrlKey && ev.target.matches && ev.target.matches("textarea.groei")){ ev.preventDefault(); ev.target.blur(); }
}, true);
document.addEventListener("change", ev => {
  if (ev.target.id === "w-concept"){
    const id = Number(ev.target.dataset.wachtid), w = (D.wacht_op || []).find(x => x.id === id);
    if (w) w.concept = ev.target.value;
    stil("wacht-concept", {id, concept: ev.target.value});
  }
});
document.addEventListener("input", ev => {
  if (ev.target.matches && ev.target.matches("textarea.groei")) rekVelden(ev.target.parentElement);
  if (ev.target.id === "concept"){ const k = document.querySelector(".c-schrijf"); if (k && !document.getElementById("c-claude")?.disabled) k.hidden = !!ev.target.value.trim(); }
  const d = ev.target.dataset;
  if (d.tk === undefined || staat.open === null) return;
  bewerkt[staat.open][Number(d.tk)][d.veld] = ev.target.value;
});

function openPaneel(id){ staat.open = id; staat.wacht = null; staat.geenAuto = false; taak = null; antwoord = null; teken();
  document.querySelector(`.rij[data-open="${id}"]`)?.scrollIntoView({block:"nearest"}); }
function sluitPaneel(){
  staat.open = null; staat.wacht = null; taak = null; antwoord = null;
  if (staat.tab === "opruimen") staat.lees = null;
  document.querySelectorAll(".rij.gekozen[data-open]").forEach(r => r.classList.remove("gekozen"));
  document.getElementById("dek").classList.remove("open");
  if (drieKolommen() && D){ return tekenLeegPaneel(); }
  document.getElementById("paneel").classList.remove("open");
  document.getElementById("paneel").setAttribute("aria-hidden","true");
}

function verplaats(ids, doel){
  if (!ids.length) return;
  ids.forEach(i => staat.gekozen.delete(i));
  if (staat.tab === "te_doen" && ids.includes(staat.open)){ const v = volgendeNa(staat.open); staat.open = v; staat.geenAuto = v === null; }
  if (staat.tab === "opruimen" && ids.includes(staat.lees)){
    const l = opruimLijst().map(i => i.id), k = l.indexOf(staat.lees);
    const v = l.slice(k + 1).find(i => !ids.includes(i)) ?? l.slice(0, k).reverse().find(i => !ids.includes(i)) ?? null;
    staat.lees = v; staat.geenAuto = v === null;
  }
  if (doel === "overslaan") return actie("verplaats", {ids, doel}).then(laad);
  return verplaatsMetUndo(ids, doel);
}

async function verplaatsMetUndo(ids, doel){
  await animeerWeg(ids);
  ids.forEach(i => verborgen.add(i)); teken();
  const j = await stil("verplaats", {ids, doel});
  ids.forEach(i => verborgen.delete(i));
  if (!j.ok) toast(j.melding, true);
  else toast(j.melding, false, {label: "Ongedaan maken", doe: async () => {
    const r = await stil("terugzetten", {ids}); toast(r.melding, !r.ok); laad(); }});
  laad();
}

document.addEventListener("click", async ev => {
  const t = ev.target.closest("button, .rij, input");
  if (!t) return;
  const d = t.dataset;
  if (d.tkweg !== undefined && staat.open !== null){ bewerkt[staat.open].splice(Number(d.tkweg), 1); return teken(); }
  if (d.tkerbij && staat.open !== null){
    bewerkt[staat.open].push({omschrijving: "", deadline: "", minuten: ""}); teken();
    const velden = document.querySelectorAll('#paneel [data-veld="omschrijving"]');
    return velden[velden.length - 1]?.focus();
  }
  if (t.id === "c-claude") return schrijfConcept(Number(document.getElementById("paneel").dataset.id));
  if (t.dataset.afplan){
    t.disabled = true;
    if (await planTaakIn(Number(t.dataset.afplan), t.dataset.start)) toast("Ingepland");
    if (deadlineVoorstel && deadlineVoorstel.voorstellen) delete deadlineVoorstel.voorstellen[t.dataset.afplan];
    return laad();
  }
  if ((t.id === "afsluit-alles" && afsluit && afsluit.voorstellen) || (t.dataset.deadlinealles && deadlineVoorstel && deadlineVoorstel.voorstellen)){
    const vs = t.id === "afsluit-alles" ? afsluit.voorstellen : deadlineVoorstel.voorstellen;
    if (t.id === "afsluit-alles") afsluit = null; else deadlineVoorstel = null;
    let n = 0;
    for (const [id, start] of Object.entries(vs)) if (await planTaakIn(Number(id), start)) n++;
    toast(n === 1 ? "1 taak ingepland" : `${n} taken ingepland`); return laad();
  }
  if (d.wacht && t.classList.contains("rij")){ staat.wacht = Number(d.wacht); staat.open = null; taak = null; antwoord = null; return teken(); }
  if (t.id === "w-claude") return schrijfHerinnering(Number(d.wachtid));
  if (t.id === "w-kopieer") return kopieerHerinnering(Number(d.wachtid));
  if (t.id === "controleer") return controleerTaken();
  if (d.vandaagdicht){ try { localStorage.setItem("mailagent-vandaag-dicht", isoDag(new Date())); } catch(e){} return teken(); }
  if (d.vandaagopen){ try { localStorage.removeItem("mailagent-vandaag-dicht"); } catch(e){} return teken(); }
  if (d.openmail){ staat.tab = "te_doen"; return openPaneel(Number(d.openmail)); }
  if (d.deadlinevoorstel){
    deadlineVoorstel = "laden"; teken();
    const j = await stil("deadline-voorstellen", {});
    deadlineVoorstel = j.ok ? j : null;
    if (!j.ok) toast(j.melding, true);
    else if (!Object.keys(j.voorstellen).length) { toast("Geen vrij moment vóór de deadline gevonden", true); deadlineVoorstel = null; }
    return teken();
  }
  if (d.deadlineagenda){
    t.disabled = true;
    const j = await stil("deadline-agenda", {id: Number(d.deadlineagenda), soort: d.soort});
    toast(j.melding, !j.ok); return laad();
  }
  if (d.gedaanmelding) return document.getElementById("gedaan")?.click();
  if (d.nietbeantwoord){ const j = await stil("niet-beantwoord", {id: Number(d.nietbeantwoord)}); toast(j.melding, !j.ok); return laad(); }
  if (d.ster !== undefined){
    const j = await stil("belangrijk", {adres: d.ster, naam: d.naam, aan: d.aan === "1"});
    toast(j.melding, !j.ok); return laad();
  }
  if (d.belangrijkweg){ const j = await stil("belangrijk", {adres: d.belangrijkweg, aan: false}); toast(j.melding, !j.ok); return laad(); }
  if (d.wachtopen){ const j = await stil("wacht-openen", {id: Number(d.wachtopen)}); if (!j.ok) toast(j.melding, true); return; }
  if (d.wachtlater){ const j = await stil("wacht-later", {id: Number(d.wachtlater), werkdagen: 3}); toast(j.melding, !j.ok); return laad(); }
  if (d.wachtklaar){
    const id = Number(d.wachtklaar), j = await stil("wacht-klaar", {id});
    toast(j.melding, !j.ok, j.ok ? {label: "Ongedaan maken", doe: async () => { await stil("wacht-terug", {id}); laad(); }} : null);
    return laad();
  }
  if (d.nietklaar){ const j = await stil("taak-niet-klaar", {id: Number(d.nietklaar)}); toast(j.melding, !j.ok); return laad(); }
  if (d.allesklaar){
    const ids = filter(D.taken, true).filter(x => x.lijkt_klaar).map(x => x.id);
    await animeerWeg(ids); ids.forEach(i => takenVerborgen.add(i)); teken();
    for (const i of ids) await stil("taak-klaar", {id: i});
    ids.forEach(i => takenVerborgen.delete(i));
    toast(`${ids.length} taken afgevinkt`, false, {label: "Ongedaan maken", doe: async () => {
      for (const i of ids) await stil("taak-heropen", {id: i});
      toast("Taken teruggezet"); laad();
    }});
    return laad();
  }
  if (d.klaarzetten) return zetTakenKlaar(Number(d.klaarzetten));
  if (d.opbergen){ ev.stopPropagation(); return openKiezer(Number(d.opbergen), t); }
  if (d.bulkmap){ const ids = [...staat.gekozen]; if (ids.length) return openKiezer(ids[0], t, ids); return; }
  if (d.maaktaak){ ev.stopPropagation(); return openTaak(Number(d.maaktaak)); }
  if (taak && d.duur){ taak.minuten = Number(d.duur); return tekenTaak(); }
  if (taak && d.moment !== undefined){
    if (d.moment) zetStart(Date.parse(d.moment));
    else if (taak.inplannen) taak.inplannen = false;
    else { taak.inplannen = true; taak.scrollen = true; laadDag(taak.dag); }
    return tekenTaak();
  }
  if (taak && d.dagstap){
    const dt = new Date(taak.start); dt.setDate(dt.getDate() + Number(d.dagstap));   // kalenderdag, zelfde kloktijd
    const ms = dt.getTime();
    taak.start = ms; taak.dag = isoDag(new Date(ms)); taak.scrollen = true; laadDag(taak.dag);
    return tekenTaak();
  }
  if (t.id === "taakmaak") return bevestigTaak();
  if (taak && t.id === "t-archief"){ taak.archiveren = t.checked; return; }
  if (t.id === "sluit2") return sluitPaneel();
  if (d.project){ staat.project = d.project; staat.gekozen.clear(); staat.geenAuto = false; bewaar(); sluitPaneel(); return teken(); }
  if (d.tab){ staat.tab = d.tab; staat.geenAuto = false; bewaar(); sluitPop(); sluitPaneel(); return teken(); }
  if (d.open){ return openPaneel(Number(d.open)); }
  if (d.klaar){ return vinkAf(Number(d.klaar)); }
  if (d.terug){ return zetTerug(Number(d.terug)); }
  if (d.mailopen){ const j = await stil("mail-openen", {id:Number(d.mailopen)}); if (!j.ok) toast(j.melding, true); return; }
  if (d.beantwoord){ const t = D.taken.find(x => x.id === Number(d.beantwoord)); if (t){ staat.open = null; taak = null; antwoord = {taak: t}; tekenAntwoord(); } return; }
  if (antwoord && t.id === "a-claude") return claudeAntwoord();
  if (antwoord && t.id === "a-open") return openAntwoord();
  if (d.een){ ev.stopPropagation(); return verplaats([Number(d.id)], d.een); }
  if (d.groep){ return verplaats(d.ids.split(",").map(Number), d.groep); }
  if (d.bulk){ if (d.bulk === "leeg"){ staat.gekozen.clear(); return teken(); } return verplaats([...staat.gekozen], d.bulk); }
  if (d.overslaanalle){ const j = await stil("regels-toevoegen", {adressen: d.overslaanalle.split(",")}); toast(j.melding, !j.ok); return laad(); }
  if (d.regelweg){ return actie("regel-weg", {adres:d.regelweg}).then(laad); }
  if (d.vink || d.kies){
    const id = Number(d.vink || d.kies);
    if (ev.shiftKey && staat.anker !== null && staat.anker !== undefined){
      // reeks: alles tussen het anker en deze mail krijgt dezelfde stand (bij een vinkje: de nieuwe stand ervan)
      selecteerReeks(staat.anker, id, d.vink ? !staat.gekozen.has(id) : true);
      return teken();
    }
    if (d.vink || ev.metaKey || ev.ctrlKey){
      staat.gekozen.has(id) ? staat.gekozen.delete(id) : staat.gekozen.add(id);
      staat.anker = id;
      return teken();
    }
    staat.anker = id;
    return openLees(id);
  }
  if (d.groepvink){
    const ids = d.groepvink.split(",").map(Number), alle = ids.every(i => staat.gekozen.has(i));
    ids.forEach(i => alle ? staat.gekozen.delete(i) : staat.gekozen.add(i));
    return teken();
  }
  if (t.id === "sluit") return sluitPaneel();
  if (t.id === "ophalen"){ D.ophalen.bezig = true; teken(); return actie("ophalen").then(laad); }
  if (t.id === "gedaan"){
    const id = Number(document.getElementById("paneel").dataset.id);
    const volgende = drieKolommen() ? volgendeNa(id) : null;
    sluitPaneel(); if (volgende !== null) staat.open = volgende;
    await animeerWeg([id]); verborgen.add(id); teken();
    const j = await stil("gedaan", {id}); verborgen.delete(id);
    if (!j.ok){ toast(j.melding, true); return laad(); }
    laad();
    if (t.dataset.metmap){ return openKiezer(id, null, [id]); }
    gedaanMelding(id);
    return;
  }
  if (t.id === "verzenden"){
    const id = Number(document.getElementById("paneel").dataset.id), concept = document.getElementById("concept").value;
    if (!concept.trim()) return toast("Er staat geen tekst om te versturen", true);
    if (/\[\s*AANVULLEN/i.test(concept)) return toast("Vul eerst de plek met [AANVULLEN: …] in, dan kun je versturen", true);
    if (!t.classList.contains("bevestig")){
      // eerste klik: bevestigen met de ontvanger in beeld; na 5 seconden weer terug
      const it = [...D.zelf, ...D.wacht].find(x => x.id === id), naam = it ? afzender(it.van).naam : "de afzender";
      t.classList.add("bevestig"); t.innerHTML = `${ik("forward")}Klik nogmaals: verzenden aan ${esc(naam)}`;
      clearTimeout(t._terug); t._terug = setTimeout(() => { if (t.isConnected){ t.classList.remove("bevestig"); t.innerHTML = `${ik("forward")}<span class="lbl">Verzenden</span><kbd>⇧⌘↵</kbd>`; } }, 5000);
      return;
    }
    const data = {id, concept, taken: (bewerkt[id] || null), verzenden: true};
    const volgende = drieKolommen() ? volgendeNa(id) : null;
    sluitPaneel(); if (volgende !== null) staat.open = volgende;
    toast("Versturen via Apple Mail…");
    const ok = await meteen([id], "goedkeuren", data);
    if (!ok){ bewaarTekst(id, concept); staat.open = id; teken(); }   // niet verstuurd: jouw tekst blijft staan
    return;
  }
  if (t.id === "goedkeuren" || t.id === "afwijzen"){
    const id = Number(document.getElementById("paneel").dataset.id);
    const goed = t.id === "goedkeuren";
    const data = goed ? {id, concept: document.getElementById("concept").value,
                         taken: (bewerkt[id] || null)} : {id};
    const volgende = drieKolommen() ? volgendeNa(id) : null;
    sluitPaneel();
    if (volgende !== null){ staat.open = volgende; }
    if (goed && data.concept.trim()) toast("Concept gaat naar Apple Mail…");
    const ok = await meteen([id], goed ? "goedkeuren" : "afwijzen", data);
    if (!ok){ if (goed) bewaarTekst(id, data.concept); staat.open = id; teken(); }   // mislukt: paneel met je tekst weer openen
  }
});
// Slepen en rekken in het dagoverzicht, in stappen van een kwartier
let sleep = null;
document.addEventListener("pointerdown", ev => {
  const tl = ev.target.closest("#tijdlijn");
  if (!tl || !taak) return;
  const tb = ev.target.closest("#tb");
  sleep = {modus: ev.target.closest(".rek") ? "rek" : tb ? "schuif" : "klik", y0: ev.clientY, start0: taak.start, duur0: taak.minuten, bewogen: false, tl};
  if (tb){ tb.setPointerCapture(ev.pointerId); ev.preventDefault(); }
});
document.addEventListener("pointermove", ev => {
  if (!sleep || sleep.modus === "klik") return;
  const dy = ev.clientY - sleep.y0;
  if (Math.abs(dy) > 3) sleep.bewogen = true;
  const stap = Math.round(dy / PX / 15) * 15;
  const d0 = dagBegin(taak.dag);
  if (sleep.modus === "schuif"){
    const min = Math.min(24*60 - taak.minuten, Math.max(0, (sleep.start0 - d0)/60000 + stap));
    taak.start = d0 + min*60000;
  } else {
    taak.minuten = Math.max(15, Math.min(24*60 - (taak.start - d0)/60000, sleep.duur0 + stap));
  }
  const tb = document.getElementById("tb"), van = Number(document.getElementById("tl-binnen").dataset.van);
  tb.style.top = ((taak.start - d0)/60000 - van) * PX + "px";
  tb.style.height = taak.minuten * PX - 2 + "px";
  tb.classList.toggle("botst", botsingen().length > 0);
  document.getElementById("tb-tijd").textContent = blokTijd();
  const tv = document.getElementById("t-tijd"), tt = document.getElementById("t-tot");
  if (tv) tv.value = tijdVan(taak.start);
  if (tt) tt.textContent = "tot " + tijdVan(taak.start + taak.minuten*60000);
});

document.addEventListener("change", ev => {

});
document.addEventListener("pointerup", ev => {
  if (!sleep) return;
  const s = sleep; sleep = null;
  if (s.modus === "klik"){

    const binnen = document.getElementById("tl-binnen"), van = Number(binnen.dataset.van);

});

document.addEventListener("keydown", ev => {
  const inVeld = ev.target.closest && ev.target.closest("input, textarea, select");
  if (ev.key === "?" && !inVeld){ ev.preventDefault(); return toonSneltoetsen(); }
  if (ev.key === "Escape" && document.querySelector(".overlay")) return document.querySelector(".overlay").remove();
  if (ev.key === "Escape"){ if (inVeld) return ev.target.blur(); if (plaatsing){ plaatsing = null; return teken(); }
    if (staat.gekozen.size){ staat.gekozen.clear(); return teken(); } return (staat.geenAuto = true, sluitPaneel()); }
  if (ev.key === "Enter" && ev.target.dataset && ev.target.dataset.open) return openPaneel(Number(ev.target.dataset.open));
  if (ev.key === "Enter" && ev.target.dataset && ev.target.dataset.kies) return openLees(Number(ev.target.dataset.kies));
  if (staat.tab === "opruimen" && !taak && !antwoord && !inVeld && (ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "a"){
    ev.preventDefault(); opruimLijst().forEach(i => staat.gekozen.add(i.id)); return teken();
  }
  if (staat.tab === "opruimen" && !taak && !antwoord && !inVeld && !ev.metaKey && !ev.ctrlKey && !ev.altKey){
    const lijst = opruimLijst().map(i => i.id), i = lijst.indexOf(staat.lees), id = staat.lees;
    const omlaag = ev.key === "j" || ev.key === "J" || ev.key === "ArrowDown", omhoog = ev.key === "k" || ev.key === "K" || ev.key === "ArrowUp";
    if (omlaag || omhoog){
      ev.preventDefault();
      if (!lijst.length) return;
      const naar = lijst[omlaag ? Math.min(lijst.length-1, i+1) : Math.max(0, i-1)];
      if (ev.shiftKey){ if (id !== null) staat.gekozen.add(id); staat.gekozen.add(naar); staat.anker = staat.anker ?? id; }
      else staat.anker = naar;
      return openLees(naar);
    }
    // acties gelden voor de selectie als die er is, anders voor de geopende mail
    const doel = staat.gekozen.size ? [...staat.gekozen] : (id === null ? [] : [id]);
    if (!doel.length) return;
    if (ev.key === "e") return verplaats(doel, "archief");
    if (ev.key === "#" || ev.key === "Delete" || ev.key === "Backspace"){ ev.preventDefault(); return verplaats(doel, "prullenbak"); }
    if (ev.key === "v"){ ev.preventDefault(); return openKiezer(doel[0], document.querySelector('#paneel [data-opbergen]'), doel); }
    if (ev.key === "t" && id !== null) return openTaak(id);
    if (ev.key === " " && id !== null){ ev.preventDefault(); staat.gekozen.has(id) ? staat.gekozen.delete(id) : staat.gekozen.add(id); staat.anker = id; return teken(); }
    return;
  }
  if (staat.tab !== "te_doen" || taak || antwoord) return;
  const id = staat.open;
  if ((ev.metaKey || ev.ctrlKey) && ev.shiftKey && ev.key === "Enter" && id !== null){ ev.preventDefault(); return document.getElementById("verzenden")?.click(); }
  if ((ev.metaKey || ev.ctrlKey) && ev.key === "Enter" && id !== null){ ev.preventDefault(); return document.getElementById("goedkeuren")?.click(); }
  if (inVeld || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const lijst = teDoen().map(i => i.id), i = lijst.indexOf(id);
  if (ev.key === "j" || ev.key === "ArrowDown"){ ev.preventDefault(); if (lijst.length) openPaneel(lijst[Math.min(lijst.length-1, i+1)]); return; }
  if (ev.key === "k" || ev.key === "ArrowUp"){ ev.preventDefault(); if (lijst.length) openPaneel(lijst[Math.max(0, i-1)]); return; }
  if (id === null) return;
  if (ev.key === "e") return verplaats([id], "archief");
  if (ev.key === "v"){ ev.preventDefault(); return openKiezer(id, document.querySelector('#paneel [data-opbergen]')); }
  if (ev.key === "#" || ev.key === "Delete" || ev.key === "Backspace"){ ev.preventDefault(); return verplaats([id], "prullenbak"); }
  if (ev.key === "x") return document.getElementById("afwijzen")?.click();
  if (ev.key === "d") return document.getElementById("gedaan")?.click();
  if (ev.key === "D"){ const g = document.getElementById("gedaan"); if (g){ g.dataset.metmap = "1"; g.click(); } return; }
  if (ev.key === "t") return openTaak(id);
  const n = Number(ev.key);
  if (n >= 1 && n <= D.projecten.length) return zetProject(id, D.projecten[n-1].naam);
});

  if (!plaatsing) return [];
  const lijst = Array.isArray(dagen[staat.planDag]) ? dagen[staat.planDag] : [];
  const b = plaatsing.start, e = b + plaatsing.minuten*60000;
  return lijst.filter(a => !a.heledag && !a.vrij && Date.parse(a.start) < e && Date.parse(a.eind) > b);
}

function plTijdlijnHTML(){
  const lijst = dagen[staat.planDag];
  if (lijst === undefined || lijst === "laden") return `<div class="tijdlijn"><div class="tl-laden">Agenda laden…</div></div>`;
  if (lijst.fout) return `<div class="melding">${ik("alert")}<div>${esc(lijst.fout)}</div></div>`;
  const w = D.werktijd || {begin:"09:00", eind:"17:00"}, d0 = dagBegin(staat.planDag);
  let van = Math.max(0, uurMin(w.begin) - 60), tot = Math.min(24*60, uurMin(w.eind) + 60);
  if (plaatsing && isoDag(new Date(plaatsing.start)) === staat.planDag){
    const sm = (plaatsing.start - d0)/60000;
    van = Math.min(van, Math.floor(sm/60)*60); tot = Math.max(tot, Math.ceil((sm + plaatsing.minuten)/60)*60);
  }
  // de werkdag vult de hoogte van het venster; nooit kleiner dan vroeger, nooit absurd groot
  const heledagN = lijst.filter(a => a.heledag).length;
  PLPX = Math.max(0.8, Math.min(2.6, (window.innerHeight - 250 - (heledagN ? 34 : 0)) / (tot - van)));
  const y = m => (m - van) * PLPX;
  let h = "";
  if (uurMin(w.begin) > van) h += `<div class="buiten" style="top:0;height:${y(uurMin(w.begin))}px"></div>`;
  if (uurMin(w.eind) < tot) h += `<div class="buiten" style="top:${y(uurMin(w.eind))}px;height:${y(tot)-y(uurMin(w.eind))}px"></div>`;
  for (let m = van; m < tot; m += 30) h += `<div class="uur${m % 60 ? " half" : ""}" style="top:${y(m)}px">${m % 60 ? "" : `<span>${tweeCijfers(m/60)}:00</span>`}</div>`;
  h += afsprakenHTML(lijst, d0, van, tot, PLPX, false, true) + nuLijn(staat.planDag, van, tot, PLPX);
  if (plaatsing && isoDag(new Date(plaatsing.start)) === staat.planDag){
    const t = D.taken.find(x => x.id === plaatsing.id);
    h += `<div class="tb concept${plBotsingen().length ? " botst" : ""}" id="pl-blok" style="top:${y((plaatsing.start-d0)/60000)}px;height:${plaatsing.minuten*PLPX - 2}px">
            <b>${esc(t ? t.omschrijving : "Taak")}</b><span id="pl-tijd">${blokTijdVan(plaatsing.start, plaatsing.minuten)}</span><div class="rek"></div></div>`;
  }
  const heledag = lijst.map((a, i) => ({...a, i})).filter(a => a.heledag);
  const soorten = new Set(lijst.filter(a => !a.heledag).map(a => appTaakBij(a) ? "taak" : isFocus(a) ? "focus" : a.vrij ? "" : (a.soort || "eigen")));
  const legenda = [["overleg", "mensen", "Met anderen"], ["les", "les", "Les"], ["taak", "check", "Taak uit de app"], ["focus", "clock", "Beschermd"], ["eigen", "calendar", "Eigen afspraak"]]
    .filter(([k]) => soorten.has(k)).map(([k, i, l]) => `<span class="lg lg-${k}">${ik(i)}${l}</span>`).join("");
  return (legenda && soorten.size > 1 ? `<div class="legenda">${legenda}</div>` : "") + (heledag.length ? `<div class="heledag">${heledag.map(a => `<span class="klik" data-afs="${a.i}" tabindex="0">${esc(a.titel)}</span>`).join("")}</div>` : "") +
    `<div class="tijdlijn" id="pl-tijdlijn"><div class="tl-binnen" id="pl-binnen" data-van="${van}" style="height:${(tot-van)*PLPX}px">${h}</div></div>`;
}

function minuutOp(clientY){
  const binnen = document.getElementById("pl-binnen");
  if (!binnen) return null;
  const r = binnen.getBoundingClientRect();
  if (clientY < r.top || clientY > r.bottom) return null;
  return Math.round(((clientY - r.top) / PLPX + Number(binnen.dataset.van)) / 15) * 15;
}
function plaats(id, clientY){
  const t = D.taken.find(x => x.id === id), m = minuutOp(clientY);
  if (!t || m === null) return false;
  const duur = t.minuten || 30;
  plaatsing = {id, minuten: duur, start: dagBegin(staat.planDag) + Math.max(0, Math.min(24*60 - duur, m)) * 60000};
  gekozenKaart = null;
  teken();
  return true;
}

document.addEventListener("pointerdown", ev => {
  if (staat.tab !== "planning") return;
  const kaartEl = ev.target.closest("[data-kaart]");
  if (kaartEl && !ev.target.closest("button") && ev.pointerType !== "touch"){
    kaartSleep = {id: Number(kaartEl.dataset.kaart), x0: ev.clientX, y0: ev.clientY, spook: null};
    return;
  }
  const blok = ev.target.closest("#pl-blok");
  if (blok && plaatsing){
    plSleep = {modus: ev.target.closest(".rek") ? "rek" : "schuif", y0: ev.clientY, start0: plaatsing.start, duur0: plaatsing.minuten};
    blok.setPointerCapture(ev.pointerId); ev.preventDefault();
  }
});
document.addEventListener("pointermove", ev => {
  if (kaartSleep){
    if (!kaartSleep.spook && Math.hypot(ev.clientX - kaartSleep.x0, ev.clientY - kaartSleep.y0) > 6){
      const t = D.taken.find(x => x.id === kaartSleep.id);
      kaartSleep.spook = Object.assign(document.createElement("div"), {className: "spook", textContent: `${t.omschrijving} · ${duurTekst(t.minuten || 30)}`});
      document.body.append(kaartSleep.spook);
    }
    if (kaartSleep.spook){ kaartSleep.spook.style.left = ev.clientX + "px"; kaartSleep.spook.style.top = ev.clientY + "px"; }
    return;
  }
  if (!plSleep || !plaatsing) return;
  const stap = Math.round((ev.clientY - plSleep.y0) / PLPX / 15) * 15, d0 = dagBegin(staat.planDag);
  if (plSleep.modus === "schuif") plaatsing.start = d0 + Math.min(24*60 - plaatsing.minuten, Math.max(0, (plSleep.start0 - d0)/60000 + stap)) * 60000;
  else plaatsing.minuten = Math.max(15, Math.min(24*60 - (plaatsing.start - d0)/60000, plSleep.duur0 + stap));
  const blok = document.getElementById("pl-blok"), van = Number(document.getElementById("pl-binnen").dataset.van);
  blok.style.top = ((plaatsing.start - d0)/60000 - van) * PLPX + "px";
  blok.style.height = plaatsing.minuten * PLPX - 2 + "px";
  blok.classList.toggle("botst", plBotsingen().length > 0);
  document.getElementById("pl-tijd").textContent = blokTijdVan(plaatsing.start, plaatsing.minuten);
});
document.addEventListener("pointerup", ev => {
  if (kaartSleep){
    const k = kaartSleep; kaartSleep = null;
    if (k.spook){ k.spook.remove(); if (!plaats(k.id, ev.clientY)) toast("Laat de taak los boven een tijd in de dag", true); }
    else { gekozenKaart = gekozenKaart === k.id ? null : k.id; teken(); }   // klik zonder slepen: kiezen
    return;
  }
  if (plSleep){ plSleep = null; return teken(); }
  if (staat.tab === "planning" && gekozenKaart && ev.target.closest("#pl-tijdlijn") && !ev.target.closest("#pl-blok")) plaats(gekozenKaart, ev.clientY);
  else if (staat.tab === "planning" && ev.pointerType === "touch" && ev.target.closest("[data-kaart]") && !ev.target.closest("button")){
    const id = Number(ev.target.closest("[data-kaart]").dataset.kaart); gekozenKaart = gekozenKaart === id ? null : id; teken();
  }
});
document.addEventListener("click", async ev => {
  const t = ev.target.closest("button");
  if (!t || staat.tab !== "planning") return;
  if (t.dataset.pldag !== undefined){
    sluitPop();
    const stap = Number(t.dataset.pldag);
    staat.planDag = stap === 0 ? vandaagWerkdag() : isoDag(new Date(dagBegin(staat.planDag) + stap * 86400000 + 3600000));
    if (plaatsing){ const sm = plaatsing.start - dagBegin(isoDag(new Date(plaatsing.start))); plaatsing.start = dagBegin(staat.planDag) + sm; }
    return teken();
  }
  if (t.id === "pl-annuleer"){ plaatsing = null; return teken(); }
  if (t.id === "afsluit-start"){ afsluit = "laden"; teken(); const j = await stil("afsluiten", {}); afsluit = j.ok ? j : null; if (!j.ok) toast(j.melding, true); return teken(); }
  if (t.id === "afsluit-dicht"){ afsluit = null; return teken(); }
  if (t.dataset.later !== undefined){
    const id = Number(t.dataset.later), naarLater = t.dataset.waarde === "1";
    const taakRij = D.taken.find(x => x.id === id); if (taakRij) taakRij.later = naarLater ? 1 : 0; teken();
    const j = await stil("taak-later", {id, later: naarLater}); if (!j.ok) toast(j.melding, true); return laad();
  }
  if (t.id === "pl-bevestig" && plaatsing){
    const p = plaatsing, dag = isoDag(new Date(p.start));
    plaatsing = null;
    const taakRij = D.taken.find(x => x.id === p.id); if (taakRij){ taakRij.gepland = lokaalIso(p.start); taakRij.minuten = p.minuten; }
    teken();
    const j = await stil("taak-plannen", {id: p.id, start: lokaalIso(p.start), minuten: p.minuten});
    toast(j.melding, !j.ok);
    delete dagen[dag];
    laad();
  }
});

// ---------------- Opbergen in een map ----------------
let kiezer = null;   // {id, mappen, voorstellen, zoek, index, el}
async function openKiezer(id, anker, ids){
  sluitKiezer();
  const el = document.createElement("div");
  el.className = "kiezer";
  el.innerHTML = `<input type="text" id="kiezer-zoek" placeholder="Zoek een map…" autocomplete="off"><div class="opties"><div class="leeg2">Mappen laden…</div></div>`;
  document.body.append(el);
  const r = anker ? anker.getBoundingClientRect() : {left: innerWidth/2 - 190, top: innerHeight/3, bottom: innerHeight/3};
  const boven = r.top > innerHeight * 0.55;
  el.style.left = Math.max(16, Math.min(innerWidth - el.offsetWidth - 16, r.left - 40)) + "px";
  if (boven) el.style.bottom = (innerHeight - r.top + 8) + "px"; else el.style.top = (r.bottom + 8) + "px";
  kiezer = {id, ids: ids && ids.length ? ids : [id], mappen: [], voorstellen: [], zoek: "", index: 0, el, inbox: "", archief: "", nieuwKan: false};
  el.querySelector("input").focus();
  const j = await stil("mappen", {id});
  if (!kiezer || kiezer.id !== id) return;
  if (!j.ok){ sluitKiezer(); return toast(j.melding, true); }
  kiezer.mappen = j.mappen; kiezer.voorstellen = j.voorstellen;
  kiezer.inbox = j.inbox || ""; kiezer.archief = j.archief || ""; kiezer.nieuwKan = !!j.nieuw_kan;
  tekenKiezer();
}
function kiezerGroep(m){
  const l = m.toLowerCase(), inbox = (kiezer.inbox || "").toLowerCase(), arch = (kiezer.archief || "").split("/").pop().toLowerCase();
  if (inbox && l.startsWith(inbox + "/")) return "In je inbox";
  if (arch && l.startsWith(arch + "/")) return "In het archief";
  return "Andere mappen";
}
function kiezerOpties(){
  const ruw = kiezer.zoek.trim(), z = ruw.toLowerCase();
  const voorstel = z ? [] : kiezer.voorstellen;
  const rest = kiezer.mappen.filter(m => !z || m.toLowerCase().includes(z)).filter(m => !voorstel.some(v => v.map === m));
  const opties = [...voorstel.map(v => ({map: v.map, waarom: v.reden, voorstel: true})), ...rest.map(m => ({map: m, groep: kiezerGroep(m)}))];
  // geen map met precies deze naam? Dan kun je hem maken
  const bestaat = kiezer.mappen.some(m => m.toLowerCase() === z || m.split("/").pop().toLowerCase() === z);
  if (z && kiezer.nieuwKan && !bestaat) opties.push({nieuw: ruw.replace(/^\/+|\/+$/g, "")});
  return opties;
}
function tekenKiezer(){
  const opties = kiezerOpties();
  kiezer.index = Math.min(kiezer.index, Math.max(0, opties.length - 1));
  const inbox = (kiezer.inbox || "").toLowerCase();
  const regel = (o, i) => {
    if (o.nieuw) return `<button class="optie nieuw${i === kiezer.index ? " actief" : ""}" data-nieuwemap="${esc(o.nieuw)}">${ik("folder")}<span>Nieuwe map <b>${esc(o.nieuw)}</b>${kiezer.inbox && !kiezer.archief.startsWith("[Gmail]") ? ` <span class="pad">in je inbox</span>` : ""}</span></button>`;
    let delen = o.map.split("/");
    if (inbox && delen.length > 1 && delen[0].toLowerCase() === inbox) delen = delen.slice(1);   // 'Inbox/' hoef je niet te zien
    const naam = delen.pop();
    return `<button class="optie${i === kiezer.index ? " actief" : ""}" data-map="${esc(o.map)}">${ik("folder")}<span>${esc(naam)}${delen.length ? ` <span class="pad">${esc(delen.join(" / "))}</span>` : ""}</span>${o.waarom ? `<span class="waarom">${esc(o.waarom)}</span>` : ""}</button>`; };
  const groepen = new Set(opties.filter(o => o.groep).map(o => o.groep));
  let html = "", vorige = null;
  opties.forEach((o, i) => {
    if (o.voorstel && i === 0) html += `<div class="kop2">Voorstel</div>`;
    if (!o.voorstel && !o.nieuw){
      const kop = groepen.size > 1 ? o.groep : (opties.some(x => x.voorstel) ? "Alle mappen" : null);
      if (kop && kop !== vorige){ html += `<div class="kop2">${esc(kop)}</div>`; vorige = kop; }
    }
    if (o.nieuw) html += `<div class="kop2">Maken</div>`;
    html += regel(o, i);
  });
  kiezer.el.querySelector(".opties").innerHTML = opties.length ? html : `<div class="leeg2">Geen map gevonden</div>`;
  if (!kiezer.el.querySelector(".voet")) kiezer.el.insertAdjacentHTML("beforeend", `<div class="voet"><span><kbd>↑</kbd><kbd>↓</kbd> <kbd>↵</kbd> <kbd>Esc</kbd> · typ een naam voor een nieuwe map</span><button class="knop klein" id="kiezer-vernieuw" title="Mappen opnieuw ophalen uit Mail">Vernieuwen</button></div>`);
  kiezer.el.querySelector(".optie.actief")?.scrollIntoView({block:"nearest"});
}
async function maakMap(naam){
  const id = kiezer.id, ids = kiezer.ids;
  kiezer.el.querySelector(".opties").innerHTML = `<div class="leeg2">Map maken in Mail…</div>`;
  const j = await stil("map-maken", {id, naam});
  if (!j.ok){ toast(j.melding, true); if (kiezer) tekenKiezer(); return; }
  sluitKiezer();
  verplaats(ids, "map:" + j.pad);
}
function sluitKiezer(){ if (kiezer){ kiezer.el.remove(); kiezer = null; } }
function kiesMap(map){
  const ids = kiezer.ids; sluitKiezer();
  verplaats(ids, "map:" + map);
}
document.addEventListener("input", ev => { if (kiezer && ev.target.id === "kiezer-zoek"){ kiezer.zoek = ev.target.value; kiezer.index = 0; tekenKiezer(); } });
document.addEventListener("keydown", ev => {
  if (!kiezer) return;
  const opties = kiezerOpties();
  if (ev.key === "ArrowDown"){ ev.preventDefault(); ev.stopImmediatePropagation(); kiezer.index = Math.min(opties.length - 1, kiezer.index + 1); return tekenKiezer(); }
  if (ev.key === "ArrowUp"){ ev.preventDefault(); ev.stopImmediatePropagation(); kiezer.index = Math.max(0, kiezer.index - 1); return tekenKiezer(); }
  if (ev.key === "Enter"){ ev.preventDefault(); ev.stopImmediatePropagation(); const o = opties[kiezer.index];
    if (o) o.nieuw ? maakMap(o.nieuw) : kiesMap(o.map); return; }
  if (ev.key === "Escape"){ ev.preventDefault(); ev.stopImmediatePropagation(); return sluitKiezer(); }
  if (ev.target.id === "kiezer-zoek") ev.stopImmediatePropagation();   // typen in het zoekveld triggert geen sneltoetsen
}, true);
document.addEventListener("mousedown", ev => {
  if (!kiezer) return;
  const o = ev.target.closest(".kiezer .optie");
  if (o){ ev.preventDefault(); return o.dataset.nieuwemap !== undefined ? maakMap(o.dataset.nieuwemap) : kiesMap(o.dataset.map); }
  if (ev.target.closest("#kiezer-vernieuw")){ ev.preventDefault(); const id = kiezer.id; kiezer.el.querySelector(".opties").innerHTML = `<div class="leeg2">Mappen laden…</div>`;
    stil("mappen", {id, vernieuw: true}).then(j => { if (kiezer && j.ok){ kiezer.mappen = j.mappen; kiezer.voorstellen = j.voorstellen; tekenKiezer(); } }); return; }
  if (!ev.target.closest(".kiezer")) sluitKiezer();
}, true);
document.addEventListener("click", async ev => {
  const l = ev.target.closest("[data-afbladen]");
  if (l){ laadHtml(Number(l.dataset.afbladen), true); return ververs(Number(l.dataset.afbladen)); }
  const a = ev.target.closest("[data-afbaltijd]");
  if (a){
    const id = Number(a.dataset.afbaltijd), aan = a.dataset.aan === "1";
    const j = await stil("afbeeldingen-altijd", {adres: a.dataset.adres, aan});
    toast(j.melding, !j.ok);
    // andere mails van dezelfde afzender opnieuw laten opmaken
    Object.keys(htmlCache).forEach(k => { const h = htmlCache[k]; if (h && h.adres === a.dataset.adres) delete htmlCache[k]; });
    laadHtml(id, aan); return ververs(id);
  }
});
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-weergave]");
  if (!b) return;
  weergave = b.dataset.weergave;
  try { localStorage.setItem("mailagent-weergave", weergave); } catch(e){}
  const blok = b.closest(".mailweergave");
  if (blok) ververs(Number(blok.id.slice(3)));
});
document.addEventListener("toggle", ev => {
  const d = ev.target;
  if (!(d instanceof HTMLDetailsElement) || !d.dataset.orig || !d.open || d.querySelector(".mailweergave")) return;
  const id = Number(d.dataset.orig), it = [...D.zelf, ...D.wacht].find(i => i.id === id);
  d.insertAdjacentHTML("beforeend", mailWeergave(id, it ? it.tekst : ""));
}, true);
// ---------------- kolombreedtes en inklappen (onthouden per browser) ----------------
const STANDAARD = {zij: 220, lijst: 400};
let breedte = {...STANDAARD}, ingeklapt = false;
try { Object.assign(breedte, JSON.parse(localStorage.getItem("mailagent-breedte") || "{}")); ingeklapt = localStorage.getItem("mailagent-ingeklapt") === "1"; } catch(e){}
function zetBreedtes(){
  const app = document.getElementById("app");
  app.style.setProperty("--zij-b", ingeklapt ? "60px" : breedte.zij + "px");
  app.style.setProperty("--lijst-b", breedte.lijst + "px");
  app.classList.toggle("ingeklapt", ingeklapt);
  const k = document.getElementById("inklappen");
  if (k) k.title = ingeklapt ? "Zijbalk uitklappen ( [ )" : "Zijbalk inklappen ( [ )";
}
function bewaarBreedtes(){
  try { localStorage.setItem("mailagent-breedte", JSON.stringify(breedte)); localStorage.setItem("mailagent-ingeklapt", ingeklapt ? "1" : "0"); } catch(e){}
}
function wisselInklappen(){ ingeklapt = !ingeklapt; zetBreedtes(); bewaarBreedtes(); }
document.getElementById("inklappen").addEventListener("click", ev => { ev.stopPropagation(); wisselInklappen(); });
document.addEventListener("keydown", ev => {
  if (ev.key === "[" && !(ev.target.closest && ev.target.closest("input, textarea, select")) && !ev.metaKey && !ev.ctrlKey){ ev.preventDefault(); wisselInklappen(); }
});
let kolomSleep = null;
for (const [id, soort] of [["greep-zij", "zij"], ["greep-lijst", "lijst"]]){
  const g = document.getElementById(id);
  g.addEventListener("pointerdown", ev => {
    ev.preventDefault(); g.setPointerCapture(ev.pointerId); g.classList.add("actief"); document.body.classList.add("slepen");
    kolomSleep = {soort, x0: ev.clientX, b0: soort === "zij" ? breedte.zij : breedte.lijst, g};
  });
  g.addEventListener("dblclick", () => { breedte[soort] = STANDAARD[soort]; zetBreedtes(); bewaarBreedtes(); });
}
document.addEventListener("pointermove", ev => {
  if (!kolomSleep) return;
  const b = kolomSleep.b0 + ev.clientX - kolomSleep.x0;
  if (kolomSleep.soort === "zij") breedte.zij = Math.round(Math.max(170, Math.min(340, b)));
  else breedte.lijst = Math.round(Math.max(280, Math.min(Math.max(320, innerWidth - breedte.zij - 420), b)));
  zetBreedtes();
});
document.addEventListener("pointerup", () => {
  if (!kolomSleep) return;
  kolomSleep.g.classList.remove("actief"); document.body.classList.remove("slepen"); kolomSleep = null; bewaarBreedtes();
});
zetBreedtes();
document.querySelectorAll("[data-ikoon]").forEach(el => el.innerHTML = ik(el.dataset.ikoon));
laad();
setInterval(() => { if (!document.hidden && staat.open === null) laad(); }, 60000);
