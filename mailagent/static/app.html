  pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  les:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/><path d="M22 9v6"/>',
  afdeling:'<path d="M3 21h18M5 21V7l7-4 7 4v14"/><path d="M9 21v-5h6v5M9 10h.01M15 10h.01M9 13h.01M15 13h.01"/>',
  mensen:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4.5a3 3 0 0 1 0 6M18 14.3c1.8.8 3 2.7 3 5.7"/>',
  wacht:'<path d="M6 3h12M6 21h12M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9s10 4 10 9"/>',
  alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
  reply:'<path d="M9 17l-5-5 5-5"/><path d="M4 12h11a5 5 0 0 1 5 5v2"/>',
  task:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  forward:'<path d="M15 17l5-5-5-5"/><path d="M20 12H9a5 5 0 0 0-5 5v2"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  chevron:'<path d="M9 18l6-6-6-6"/>',
  zoek:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  terug:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
  paneel:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>', mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
};
const ik = n => `<svg viewBox="0 0 24 24" aria-hidden="true">${IKONEN[n]||""}</svg>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ACTIES = {antwoorden:["reply","Reply"], taak:["task","Task"], agenda:["calendar","Calendar"],
                delegeren:["forward","Delegate"], ter_info:["eye","FYI"], negeren:["ban","Skipped"]};
const KLEUREN = {onderwijs:"var(--onderwijs)", onderzoek:"var(--onderzoek)", istte:"var(--istte)", overig:"var(--overig)"};
const kleur = p => KLEUREN[p] || `hsl(${[...p].reduce((a,c)=>a+c.charCodeAt(0),0)%360} 45% 50%)`;
const PROJECTNAMEN = {onderwijs:"Teaching", onderzoek:"Research", istte:"ISTTE", overig:"Other", alles:"All"};
const naamProject = p => PROJECTNAMEN[p] || p[0].toUpperCase() + p.slice(1);

function afzender(van){
  const m = String(van||"").match(/^\s*"?([^"<]*?)"?\s*<([^>]+)>/);
  const naam = (m ? m[1] : "").trim() || (m ? m[2] : van) || "?";
  // 'Achternaam, Voornaam' (Outlook) wordt 'Voornaam Achternaam'; titels achter een komma blijven staan
  const delen = naam.split(",").map(x => x.trim()).filter(Boolean);
  const omgedraaid = delen.length === 2 && !/^(ph\.?d|msc|ma|ba|mba|md|dr|prof|jr|sr)\.?$/i.test(delen[1]) && !naam.includes("@")
    ? `${delen[1]} ${delen[0]}` : naam.replace(/,\s*/g, " ");
  return {naam: omgedraaid, adres: m ? m[2] : van};
}
function initialen(naam){
  const w = naam.replace(/[^\p{L}\s]/gu," ").trim().split(/\s+/).filter(Boolean);
  return ((w[0]||"?")[0] + (w.length > 1 ? w[w.length-1][0] : "")).toUpperCase();
}
const wanneerTerug = iso => { const d = new Date(iso);
  return isoDag(d) === isoDag(new Date()) ? `today at ${tijdVan(d.getTime())}` : `on ${d.toLocaleDateString("en-GB", {day: "numeric", month: "short"})}`; };
function datum(iso){
  if(!iso) return "";
  const d = new Date(iso), nu = new Date();
  if (d.toDateString() === nu.toDateString()) return d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
}
const PLETTER = {onderwijs:"O", onderzoek:"R", istte:"I", overig:""};
const pletter = p => (p in PLETTER) ? PLETTER[p] : (p || "?")[0].toUpperCase();
const avatar = (it, klein) => { const a = afzender(it.van);
  return `<div class="avatar${klein?" klein":""}" style="background:${kleur(it.project)}" title="${esc(naamProject(it.project || "overig"))}">${esc(initialen(a.naam))}${pletter(it.project) ? `<span class="pl">${esc(pletter(it.project))}</span>` : ""}</div>`; };

let D = null, staat = {project:"alles", tab:"te_doen", open:null, lees:null, anker:null, gekozen:new Set(), geenAuto:false, planDag:null,
                       td:"open", detail:null};
const leesCache = {};   // id -> volledige mail (met tekst) voor Opruimen
try { const o = JSON.parse(localStorage.getItem("mailagent-ui")||"{}"); Object.assign(staat, {project:o.project||"alles", tab:o.tab||"te_doen"}); } catch(e){}
if (!["te_doen","planning","opruimen"].includes(staat.tab)) staat.tab = "te_doen";
const breed = () => window.matchMedia("(min-width:1100px)").matches;
const drieKolommen = () => breed() && staat.tab !== "planning";
const teDoen = () => filter([...D.zelf, ...D.wacht]);
// dringend: hoge prioriteit, belangrijke afzender, deadline voorbij, of een fout. 'Your decision' alleen telt niet.
const isUrgent = it => it.prioriteit === "hoog" || !!it.belangrijk || it.status === "fout" || (!!it.deadline && it.deadline < isoDag(new Date()));
const heeftUrgent = () => teDoen().some(isUrgent) || (D.wacht_op || []).some(w => w.herinner_op <= isoDag(new Date()));
const opruimLijst = () => [...filter(D.info), ...filter(D.overgeslagen), ...filter(D.oud || [])];
const bewaar = () => { try { localStorage.setItem("mailagent-ui", JSON.stringify({project:staat.project, tab:staat.tab})); } catch(e){} };
// Items waarvoor een actie onderweg is: meteen van het scherm, terug als de actie mislukt.
const verborgen = new Set(), takenVerborgen = new Set();
const filter = (lijst, taken) => lijst.filter(i => !(taken ? takenVerborgen : verborgen).has(i.id)
  && (staat.project === "alles" || i.project === staat.project));

let peilTimer = null;   // één timer, hoe vaak laad() ook wordt aangeroepen
let afsSleep = null, negeerKlik = false;   // een blok in Planning wordt versleept
async function laad(){
  clearTimeout(peilTimer);
  try {
    const r = await api("/api/data");
    if (!r.ok) throw new Error("status " + r.status);
    const nieuw = await r.json();
    if (afsSleep){ D = nieuw; peilTimer = setTimeout(laad, 1500); return; }   // niet hertekenen midden in het slepen
    D = nieuw;
  } catch(e){
    document.getElementById("status").textContent = "No connection to the app; retrying in 10 seconds";
    peilTimer = setTimeout(laad, 10000);
    opstartWeg();
    return;
  }
  teken();
  opstartWeg();
  if (D.ophalen.bezig || (D.oud_ophalen && D.oud_ophalen.bezig)) peilTimer = setTimeout(laad, 3000);
}

async function actie(naam, data){
  try {
    const r = await post(naam, data);
    const j = await r.json();
    toast(j.melding, !j.ok);
    return j.ok;
  } catch(e){ toast("No connection to mailagent. Is 'scripts/mailagent.sh inbox' still running?", true); return false; }
}

// Eerst het scherm bijwerken, daarna de actie op de achtergrond uitvoeren.
async function meteen(ids, naam, data, set = verborgen){
  await animeerWeg(ids);
  ids.forEach(i => set.add(i));
  staat.focusNa = true;
  teken();
  const ok = await actie(naam, data);
  ids.forEach(i => set.delete(i));
  if (!ok) teken();
  laad();
  return ok;
}

// Kijken of taken al gedaan zijn: de app zoekt in je verzonden mail
let controleert = false;
async function controleerTaken(){
  if (controleert) return;
  controleert = true; teken();
  const j = await stil("taken-controleren", {});
  controleert = false;
  toast(j.melding, !j.ok);
  laad();
}

// Afspraak plannen: wat de afzender voorstelt, of jij dan kunt, vrije momenten binnen jouw voorwaarden,
// en de gekozen momenten in het concept (met Claude), voorlopig in je agenda of in Outlook
const afspr = {};   // item-id -> {laden, fout, data, gekozen:Set(iso), vast, bezig}
const langDag = iso => new Date(iso).toLocaleDateString("en-GB", {weekday: "long", day: "numeric", month: "long"});
const momentKort = (iso, duur) => `${new Date(iso).toLocaleDateString("en-GB", {weekday: "short", day: "numeric", month: "short"})} ${tijdVan(Date.parse(iso))}–${tijdVan(Date.parse(iso) + duur * 60000)}`;
async function laadAfspraak(id, vw, opnieuw){
  const oud = afspr[id];
  afspr[id] = {laden: true, gekozen: oud ? oud.gekozen : new Set(), vast: oud ? oud.vast : false};
  teken();
  const j = await stil("afspraak-voorstel", {id, ...(vw || {}), opnieuw: !!opnieuw});
  afspr[id] = {laden: false, fout: j.ok ? null : j.melding, data: j.ok ? j : null, gekozen: new Set(), vast: afspr[id].vast};
  if (j.ok){   // wat jij kunt, standaard aangevinkt: eerst uit de mail, anders de eerste twee vrije momenten
    const uitMail = j.voorgesteld.filter(x => x.vrij).map(x => x.vrij);
    (uitMail.length ? uitMail : j.vrij.slice(0, 2)).forEach(m => afspr[id].gekozen.add(m));
  }
  teken();
}
function afspraakHTML(it){
  const a = afspr[it.id];
  const kop = `<div class="label">${ik("mensen")}Schedule a meeting</div>`;
  if (!a) return `<div class="afspr">${kop}<button class="knop" data-afsprladen="${it.id}">${ik("sparkle")}Find times</button>
      <span class="meta">Claude reads what the sender proposes; the app checks your calendar.</span></div>`;
  if (a.laden) return `<div class="afspr">${kop}<span class="meta">Claude is reading the email and the app is checking your calendar…</span></div>`;
  if (a.fout) return `<div class="afspr">${kop}<div class="melding fout">${ik("alert")}<div>${esc(a.fout)}</div></div></div>`;
  const d = a.data, v = d.verzoek, vw = d.vw;
  const rij = (iso, tekst, extra) => `<label class="af-r"><input type="checkbox" data-afkies="${it.id}" value="${esc(iso)}"${a.gekozen.has(iso) ? " checked" : ""}>
      <span>${tekst}</span>${extra || ""}</label>`;
  const metDatum = x => `${esc(x.omschrijving)} <span class="meta">(${esc(kortDatum(x.dag))})</span>`;
  const uitMail = d.voorgesteld.map(x => x.vrij
      ? rij(x.vrij, metDatum(x), `<span class="af-ok">free ${tijdVan(Date.parse(x.vrij))}–${tijdVan(Date.parse(x.vrij) + vw.duur * 60000)}</span>`)
      : `<div class="af-r af-niet"><span class="af-leeg"></span><span>${metDatum(x)}</span><span class="af-bezet">${x.verleden ? "past"
          : x.te_vroeg ? "before your start date" : "busy" + (x.botsingen.length ? ": " + esc(x.botsingen.join(", ")) : "")}</span></div>`).join("");
  const vrij = d.vrij.filter(m => !d.voorgesteld.some(x => x.vrij === m)).map(m => rij(m, esc(momentKort(m, vw.duur)))).join("");
  const n = a.gekozen.size;
  return `<div class="afspr">${kop}
    <div class="af-wie">${esc(v.met || "the sender")} · ${vw.duur} min${v.onderwerp ? " · " + esc(v.onderwerp) : ""}${v.locatie ? " · " + esc(v.locatie) : ""}</div>
    <div class="af-vw">
      <label>Not before <input type="date" data-afvw="vanaf" data-id="${it.id}" value="${esc(vw.vanaf)}"></label>
      <label>No later than <input type="date" data-afvw="uiterlijk" data-id="${it.id}" value="${esc(vw.uiterlijk)}"></label>
      <select data-afvw="dagdeel" data-id="${it.id}" aria-label="Part of the day"><option value="">All day</option><option value="ochtend"${vw.dagdeel === "ochtend" ? " selected" : ""}>Morning</option><option value="middag"${vw.dagdeel === "middag" ? " selected" : ""}>Afternoon</option></select>
      <select data-afvw="duur" data-id="${it.id}" aria-label="Duration">${[15, 30, 45, 60, 90, 120].map(m => `<option value="${m}"${m === vw.duur ? " selected" : ""}>${duurTekst(m)}</option>`).join("")}</select>
    </div>

// ---------------- open punten: beslissen en aanvullen met een klik, zonder in de tekst te zoeken ----------------
const keuzes = {};      // item-id -> {punt: {optie: nummer | "eigen", tekst: wat in het concept staat, pos}}
const concepten = {};   // item-id -> je bewerkte concept
let opTimer = null;
// open: de [FILL IN] staat er nog; gekozen: jouw keuze staat erin; zelf: je paste de tekst zelf aan
function puntStand(p, k, tekst){
  if (p.soort === "hele_mail") return k ? "gekozen" : "open";
  if (p.plek && tekst.includes(p.plek)) return "open";
  if (k && k.tekst != null && (k.tekst === "" || tekst.includes(k.tekst))) return "gekozen";
  return "zelf";
}
function openPuntenHTML(it, tekst){
  const punten = it.open_punten || [];
  if (!punten.length) return "";
  const kz = keuzes[it.id] || {};
  const nOpen = punten.filter((p, i) => p.soort !== "hele_mail" && puntStand(p, kz[i], tekst) === "open").length;
  const rijen = punten.map((p, i) => {
    const k = kz[i], stand = puntStand(p, k, tekst);
    const chips = (p.opties || []).map((o, j) => `<button class="op-chip${k && k.optie === j && stand === "gekozen" ? " aan" : ""}${p.suggestie === j ? " sug" : ""}"
      data-opkies="${i}" data-optie="${j}"${p.suggestie === j ? ` title="Claude's suggestion"` : ""}>${esc(o.label)}</button>`).join("");
    const eigen = k && k.optie === "eigen";
    const eigenKnop = p.soort === "keuze" ? `<button class="op-chip op-zelf${eigen && stand === "gekozen" ? " aan" : ""}" data-opkies="${i}" data-optie="eigen">Type my own…</button>` : "";
    const veld = p.soort === "invullen" || eigen
      ? `<input class="op-eigen" data-opeigen="${i}" value="${esc(eigen ? (k.tekst || "") : "")}" aria-label="${esc(p.vraag)}"
          placeholder="${p.soort === "invullen" ? "Type it here; it goes straight into the draft" : "Your own words; they go straight into the draft"}">` : "";
    const sug = p.suggestie != null && p.opties[p.suggestie] ? p.opties[p.suggestie].label : null;
    const noot = stand === "zelf" ? "you changed this in the draft yourself"
      : p.soort === "hele_mail" && (!k || k.optie === p.suggestie) && sug ? `the draft says ${sug.toLowerCase()}`
      : p.soort === "hele_mail" && k ? "rewrite to change the draft" : "";
    return `<div class="op-punt ${stand}"><div class="op-vraag">${stand !== "open" ? ik("check") : ""}<span>${esc(p.vraag)}</span>${noot ? `<span class="op-noot">${noot}</span>` : ""}</div>
      ${chips || eigenKnop ? `<div class="op-opties">${chips}${eigenKnop}</div>` : ""}${veld}</div>`;
  }).join("");
  // herschrijven is alleen nodig als je bij een beslissing over de hele mail iets anders koos dan het concept zegt
  const nodig = punten.some((p, i) => p.soort === "hele_mail" && kz[i] && kz[i].optie !== p.suggestie), bezig = schrijft.has(it.id);
  return `<div class="op" id="op" data-id="${it.id}"><div class="label">${ik("alert")}Open points<span class="op-tel">${nOpen ? `${nOpen} to fill in` : "nothing left to fill in"}</span></div>${rijen}
    ${(nodig || bezig) && it.status !== "handmatig" ? `<div class="op-voet"><button class="knop klein" id="op-herschrijf"${bezig ? " disabled" : ""}>${ik("sparkle")}${bezig ? "Claude is rewriting…" : "Rewrite with these choices"}</button>
      <span class="meta">The draft still follows the other answer; Claude writes it again with all your choices.</span></div>` : ""}</div>`;
}
function tekenOpenPunten(){
  const blok = document.getElementById("op"), veld = document.getElementById("concept");
  if (!blok || !veld) return;
  const it = vindItem(Number(blok.dataset.id));
  if (!it) return;
  const actief = document.activeElement, eigen = actief && actief.dataset ? actief.dataset.opeigen : undefined;
  const sel = eigen !== undefined ? [actief.selectionStart, actief.selectionEnd] : null;
  const tmp = document.createElement("div");
  tmp.innerHTML = openPuntenHTML(it, veld.value);
  blok.replaceWith(tmp.firstElementChild);
  if (eigen !== undefined){ const n = document.querySelector(`[data-opeigen="${eigen}"]`); if (n){ n.focus(); n.setSelectionRange(...sel); } }
}
const dichtstbij = (tekst, stuk, pos) => {
  let beste = -1;
  for (let i = tekst.indexOf(stuk); i >= 0; i = tekst.indexOf(stuk, i + 1)) if (beste < 0 || Math.abs(i - pos) < Math.abs(beste - pos)) beste = i;
  return beste;
};
// zet tekst op de plek van een open punt: eerst de [FILL IN], anders wat je daar eerder koos
function zetInConcept(id, i, nieuw){
  const p = vindItem(id).open_punten[i], veld = document.getElementById("concept"), oud = (keuzes[id] || {})[i], tekst = veld.value;
  let van = -1, lengte = 0;
  if (p.plek && tekst.includes(p.plek)){ van = tekst.indexOf(p.plek); lengte = p.plek.length; }
  else if (oud && oud.tekst){ van = dichtstbij(tekst, oud.tekst, oud.pos ?? 0); lengte = oud.tekst.length; }
  else if (oud && oud.tekst === "" && oud.pos >= 0 && oud.pos <= tekst.length) van = oud.pos;
  if (van < 0) return null;
  veld.value = tekst.slice(0, van) + nieuw + tekst.slice(van + lengte);
  concepten[id] = veld.value;
  const k = document.querySelector(".c-schrijf"); if (k && !document.getElementById("c-claude")?.disabled) k.hidden = !!veld.value.trim();
  return van;
}
document.addEventListener("click", ev => {
  const c = ev.target.closest && ev.target.closest("[data-opkies]");
  if (!c) return;
  const id = Number(c.closest("#op").dataset.id), i = Number(c.dataset.opkies), it = vindItem(id);
  if (!it) return;
  const p = it.open_punten[i], kz = keuzes[id] ||= {}, oud = kz[i];
  const optie = c.dataset.optie === "eigen" ? "eigen" : Number(c.dataset.optie);
  const veld = document.getElementById("concept"), stand = puntStand(p, oud, veld ? veld.value : "");
  if (p.soort === "hele_mail"){           // verandert het hele antwoord: onthouden, Claude herschrijft op verzoek
    if (oud && oud.optie === optie) delete kz[i]; else kz[i] = {optie};
    return tekenOpenPunten();
  }
  if (optie === "eigen"){
    if (!(oud && oud.optie === "eigen")) kz[i] = {optie: "eigen", tekst: stand === "gekozen" && oud ? oud.tekst : null, pos: oud ? oud.pos : -1};
    tekenOpenPunten();
    const n = document.querySelector(`[data-opeigen="${i}"]`); if (n){ n.focus(); n.select(); }
    return;
  }
  if (oud && oud.optie === optie && stand === "gekozen"){   // nog eens klikken: de lege plek komt terug
    if (zetInConcept(id, i, p.plek) !== null) delete kz[i];
    return tekenOpenPunten();
  }
  const nieuw = p.opties[optie].tekst ?? p.opties[optie].label, pos = zetInConcept(id, i, nieuw);
  if (pos === null){
    try { navigator.clipboard.writeText(nieuw); } catch(e){}
    toast("That spot is no longer in the draft, so the text is on the clipboard: paste it with ⌘V", true);
  } else kz[i] = {optie, tekst: nieuw, pos};
  tekenOpenPunten();
});
document.addEventListener("input", ev => {
  const d = ev.target.dataset;
  if (!d || d.opeigen === undefined) return;
  const id = Number(ev.target.closest("#op").dataset.id), i = Number(d.opeigen), it = vindItem(id);

async function herschrijfMetKeuzes(id){
  const it = vindItem(id), kz = keuzes[id] || {}, veld = document.getElementById("concept");

  schrijft.delete(id);
  if (!j.ok){ toast(j.melding, true); return teken(); }

function toast(tekst, fout, knop){

  t.className = "toast" + (fout ? " fout" : "") + (knoppen.length > 1 ? " veel" : "");

  const titels = {te_doen:"To do", planning:"Planning", opruimen:"Tidy up"};
  document.getElementById("titel").textContent = titels[staat.tab];
  document.getElementById("pf-naam").textContent = "· " + (staat.project === "alles" ? "All projects" : naamProject(staat.project));
  document.getElementById("koptel").textContent = "";

  const inhoud = document.getElementById("inhoud");

      <button class="${staat.td === "afgehandeld" ? "aan" : ""}" data-td="afgehandeld" role="tab" aria-selected="${staat.td === "afgehandeld"}" title="What you cleared from To do in the past three weeks">Handled${nAfg ? ` · ${nAfg}` : ""}</button></span>`;
  // de rij met de focus onthouden: hertekenen vervangt de rijen, en anders raak je met het toetsenbord je plek kwijt
  const fr = document.activeElement && document.activeElement.closest && document.activeElement.closest("main .rij");
  const focusSel = fr ? (fr.dataset.open ? `[data-open="${fr.dataset.open}"]` : fr.dataset.kies ? `[data-kies="${fr.dataset.kies}"]` : null) : null;
  if (staat.tab === "te_doen" && staat.td === "afgehandeld") inhoud.innerHTML = tekenAfgehandeld();
  else if (staat.tab === "te_doen") inhoud.innerHTML = (wordtDrie ? "" : tekenVandaag()) + tekenVoortgang() + tekenWachtOp() + tekenBeoordelen(teDoen()) + tekenBelangrijk();

  else inhoud.innerHTML = tekenOpruimen();

  if (staat.focusNa){ staat.focusNa = false; requestAnimationFrame(zetLijstFocus); }
  tekenBalk();

  if (taak || antwoord) return;

  if (staat.tab === "te_doen" && staat.td === "afgehandeld"){
    const lijst = filter(D.afgehandeld || []);
    if (drieKolommen() && lijst.length && !staat.geenAuto){ staat.detail = lijst[0].id; return tekenDetail(staat.detail); }
    return drieKolommen() ? tekenLeegPaneel() : sluitPaneel();
  }
  if (staat.tab === "opruimen"){
    const lijst = opruimLijst();
    if (staat.lees !== null && !lijst.some(i => i.id === staat.lees)) staat.lees = null;
    if (staat.lees === null && drieKolommen() && lijst.length && !staat.geenAuto) staat.lees = lijst[0].id;
    if (staat.lees !== null) return tekenLees(staat.lees);
    return drieKolommen() ? tekenLeegPaneel() : sluitPaneel();
  }
  if (staat.tab === "te_doen" && staat.wacht != null){
    const w = (D.wacht_op || []).find(x => x.id === staat.wacht);
    if (w) return tekenWachtPaneel(w);
    staat.wacht = null;
  }
  if (staat.open !== null){
    const it = [...D.zelf, ...D.wacht].find(i => i.id === staat.open);
    if (it) return tekenPaneel(it);
    staat.open = null;
  }
  if (drieKolommen()){
    const lijst = teDoen();
    if (staat.tab === "te_doen" && lijst.length && !staat.geenAuto){ staat.open = lijst[0].id; return teken(); }
    tekenLeegPaneel();
  } else sluitPaneel();
}

// voortgang: aan het begin wat al gedaan is, voorbij de helft wat nog rest (kleinste getal motiveert het meest)
function tekenVoortgang(){
  const rest = teDoen().length, gedaan = (D.vandaag_afgehandeld || 0) + verborgen.size, totaal = gedaan + rest;
  if (!totaal) return "";
  const pct = Math.round(gedaan / totaal * 100);
  const tekst = !rest ? `<b>All done</b><span>${gedaan} today</span>`
    : pct < 50 ? `<span><b>${gedaan} done</b> today</span><span>${rest} to go</span>`
    : `<span><b>${rest} more</b> and you’re done</span><span>${gedaan} done</span>`;
  return `<div class="voortgang${rest ? "" : " klaar"}"><div class="voortgang-tekst">${tekst}</div><div class="voortgang-balk"><i style="width:${rest ? pct : 100}%"></i></div></div>`;
}

// ---------------- mail tonen: opgemaakt (HTML, veilig) of als tekst ----------------
const htmlCache = {};          // id -> {html, geblokkeerd, extern, altijd, adres} | "laden" | {fout}
let weergave = "opgemaakt";
try { weergave = localStorage.getItem("mailagent-weergave") || "opgemaakt"; } catch(e){}
let donkerOpgemaakt = false;   // in Dark toont de app mail als tekst, tot je zelf voor Formatted kiest
const toonWeergave = () => document.documentElement.dataset.theme === "dark" && !donkerOpgemaakt ? "tekst" : weergave;
const attr = s => String(s ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;");

function laadHtml(id, afbeeldingen){
  htmlCache[id] = "laden";
  stil("mail-html", {id, afbeeldingen: !!afbeeldingen}).then(j => { htmlCache[id] = j.ok ? j : {fout: j.melding}; ververs(id); });
}
function mailWeergave(id, tekst){
  const h = htmlCache[id];
  const wg = toonWeergave();
  if (wg === "opgemaakt" && h === undefined) laadHtml(id, false);
  const opgemaakt = wg === "opgemaakt" && h && typeof h === "object" && h.html !== undefined;
  const status = wg !== "opgemaakt" ? "" : h === "laden" || h === undefined ? "loading formatting…" : h && h.fout ? esc(h.fout) : "";
  const balk = !opgemaakt ? "" : h.geblokkeerd ? `<div class="afbeeldingbalk">${ik("eye")}<span>${h.geblokkeerd === 1 ? "1 image" : h.geblokkeerd + " images"} blocked. Loading them tells the sender you opened the email.</span>
      <button class="knop klein" data-afbladen="${id}">Load</button>
      ${h.adres ? `<button class="knop klein" data-afbaltijd="${id}" data-adres="${esc(h.adres)}" data-aan="1">Always for ${esc(h.adres)}</button>` : ""}</div>`
    : h.altijd ? `<div class="afbeeldingbalk stil"><span>Images from ${esc(h.adres)} always load.</span>
      <button class="knop klein" data-afbaltijd="${id}" data-adres="${esc(h.adres)}" data-aan="0">Stop</button></div>` : "";
  return `<div class="mailweergave" id="mw-${id}">
    <div class="weergavekeuze"><div class="segment">
      <button class="${wg === "opgemaakt" ? "aan" : ""}" data-weergave="opgemaakt">Formatted</button>
      <button class="${wg === "tekst" ? "aan" : ""}" data-weergave="tekst">Plain text</button></div>
      <span class="meta">${status}</span>
      <button class="knop klein" data-mailopen="${id}" style="margin-left:auto" title="Open this email in Apple Mail">${ik("mail")}Open in Mail</button></div>
    ${balk}
    ${opgemaakt ? `<iframe class="mailframe" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" srcdoc="${attr(h.html)}" title="Email"></iframe>`
                : `<div class="leesvlak">${tekst === null ? `<span class="meta">Loading email…</span>` : esc(tekst || "(no text)")}</div>`}
  </div>`;
}
function ververs(id){
  // alleen het weergaveblok vervangen, zodat de rest van het paneel (en wat je typt) blijft staan
  const el = document.getElementById("mw-" + id);
  if (!el) return;
  const tekst = (leesCache[id] && leesCache[id].tekst) ?? detailCache[id]?.tekst ?? ([...D.zelf, ...D.wacht].find(i => i.id === id)?.tekst ?? null);
  el.outerHTML = mailWeergave(id, tekst);
}

// ---------------- Afgehandeld: terugvinden wat je uit Te doen haalde ----------------
const detailCache = {};     // id -> volledige mail met je antwoord en taken
const AFG = {gedaan:["check","Done"], goedgekeurd:["mail","Reply in Mail"], verzonden:["forward","Sent"],
             afgewezen:["x","Dismissed"], taak:["task","Task created"], gearchiveerd:["archive","Archived"],
             opgeborgen:["folder","Filed"], verwijderd:["trash","In Bin"], verplaatst:["folder","Moved in Mail"], ter_info:["eye","FYI"],
             genegeerd:["ban","Skipped"], wacht:["inbox","In To do"], fout:["alert","In To do"], handmatig:["inbox","In To do"]};
const afgLabel = it => { const [i, l] = AFG[it.status] || ["mail", it.status];
  return [i, it.status === "opgeborgen" && it.opmerking ? `In ${String(it.opmerking).split("/").pop()}`
            : it.opgeruimd ? `${l} · ${it.opgeborgen_in && it.opgeborgen_in !== "your archive" ? "in " + it.opgeborgen_in : "archived"}` : l]; };
const IN_TE_DOEN = ["wacht", "fout", "handmatig"];

function dagKop(iso){
  const d = new Date(iso), nu = new Date(), gister = new Date(nu); gister.setDate(nu.getDate() - 1);
  if (d.toDateString() === nu.toDateString()) return "Today";
  if (d.toDateString() === gister.toDateString()) return "Yesterday";
  const tekst = d.toLocaleDateString("en-GB", {weekday:"long", day:"numeric", month:"long"});
  return tekst[0].toUpperCase() + tekst.slice(1);
}

function tekenAfgehandeld(){
  const lijst = filter(D.afgehandeld || []);
  if (!lijst.length) return leeg("Nothing handled yet", "What you clear from To do stays here for three weeks.");
  const achter = D.achterstand ? `<div class="achterstand"><span>${D.achterstand === 1 ? "1 handled email is" : `${D.achterstand} handled emails are`} still in your inbox.</span>
      <button class="knop klein" id="achterstand"${achterstandBezig ? " disabled" : ""}>${achterstandBezig ? "Tidying up…" : D.achterstand === 1 ? "Put it in its folder" : "Put them in their folders"}</button></div>` : "";
  const groepen = new Map();
  lijst.forEach(it => { const k = dagKop(it.afgehandeld); if (!groepen.has(k)) groepen.set(k, []); groepen.get(k).push(it); });
  return achter + [...groepen].map(([kop, items]) => `<div class="groep"><div class="groep-kop"><h2>${esc(kop)} · ${items.length}</h2></div>
    <div class="lijst">${items.map(it => { const a = afzender(it.van), [i, l] = afgLabel(it);
      return `<div class="rij afg${staat.detail === it.id ? " leest" : ""}" data-detail="${it.id}" tabindex="0">
        ${avatar(it, true)}
        <div class="midden">
          <div class="regel1"><span class="van">${esc(a.naam)}</span><span class="datum">${datum(it.datum)}</span></div>
          <div class="samenvatting">${esc(it.samenvatting || it.onderwerp)}</div>
        </div>
        <span class="chip afg-chip">${ik(i)}${esc(l)}</span>
        <div class="snel"><button class="ikoon" data-terugtd="${it.id}" title="Back to To do">${ik("terug")}</button></div>
      </div>`; }).join("")}</div></div>`).join("");
}

function laadDetail(id){
  if (detailCache[id] === "laden") return;
  detailCache[id] = "laden";
  stil("item-detail", {id}).then(j => {
    if (!j.ok){ delete detailCache[id]; toast(j.melding, true); return; }
    detailCache[id] = j.mail; if (staat.detail === id) tekenDetail(id);
  });
}

function tekenDetail(id){
  const p = document.getElementById("paneel");
  const m = typeof detailCache[id] === "object" ? detailCache[id] : null;
  const basis = m || (D.afgehandeld || []).find(i => i.id === id) || zoekTreffers.find(i => i.id === id);
  if (!m) laadDetail(id);
  const sleutel = `${id}|${m ? 1 : 0}|${toonWeergave()}|${m ? m.status : ""}`;
  if (p.dataset.detail === String(id) && p.dataset.sleutel === sleutel && p.classList.contains("open")) return;
  p.dataset.id = ""; p.dataset.lees = ""; p.dataset.sig = ""; p.dataset.detail = id; p.dataset.sleutel = sleutel;
  if (!basis){
    p.innerHTML = `<div class="leegpaneel"><span class="meta">Loading email…</span></div>`;
  } else {
    const a = afzender(basis.van), [i, l] = afgLabel(m || basis), status = (m || basis).status;
    const wanneer = (m || basis).afgehandeld && !IN_TE_DOEN.includes(status) ? ` · ${datum((m || basis).afgehandeld)}` : "";
    const antwoord = m && m.eigen_antwoord && m.eigen_antwoord.trim();
    const taken = m ? m.taken_db || [] : [];
    const knop = IN_TE_DOEN.includes(status)
      ? `<button class="knop goed" data-openmail="${id}">${ik("inbox")}<span class="lbl">Open in To do</span></button>`
      : `<button class="knop goed" data-terugtd="${id}" title="${["ter_info", "genegeerd"].includes(status) ? "Act on it after all: move to To do" : "Move back to To do to change it"}">${ik("terug")}<span class="lbl">${["ter_info", "genegeerd"].includes(status) ? "Move to To do" : "Back to To do"}</span></button>`;
    p.innerHTML = `
      <div class="p-kop">${avatar(basis)}
        <div style="min-width:0"><h2>${esc(basis.onderwerp)}</h2><div class="van">${esc(a.naam)} · ${esc(a.adres)} · ${datum(basis.datum)}</div>
          <div class="chips"><span class="chip">${ik(i)}${esc(l)}${wanneer}</span><span class="chip">${esc(naamProject(basis.project || "overig"))}</span></div></div>
        <button class="ikoon sluit-mail" id="sluit" title="Close (Esc)">${ik("x")}</button></div>
      <div class="p-inhoud">
        ${basis.samenvatting && basis.samenvatting !== basis.onderwerp ? `<div class="melding info">${ik("sparkle")}<div>${esc(basis.samenvatting)}</div></div>` : ""}
        ${status === "verzonden" ? `<div class="melding">${ik("forward")}<div>Your reply has been sent. Moving the email back does not change that; you can then send a follow-up.</div></div>` : ""}
        ${antwoord ? `<div><div class="label">${ik("reply")}${status === "verzonden" ? "What you sent" : "Your reply"}</div><div class="leesvlak">${esc(antwoord)}</div></div>` : ""}
        ${taken.length ? `<div><div class="label">${ik("task")}Tasks</div><div class="afg-taken">${taken.map(t => `<div class="${t.klaar ? "klaar" : ""}">${ik(t.klaar ? "check" : "calendar")}<span>${esc(t.omschrijving)}</span>
          <span class="meta">${t.klaar ? "ticked off" : t.gepland ? kortDatum(t.gepland.slice(0, 10)) : "to schedule"}</span></div>`).join("")}</div></div>` : ""}
        <div><div class="label">${ik("mail")}The email</div>${mailWeergave(id, m ? m.tekst : null)}</div>
      </div>
      <div class="p-voet"><span style="flex:1"></span>${knop}</div>`;
  }
  p.classList.add("open"); p.setAttribute("aria-hidden", "false");
  if (!drieKolommen()) document.getElementById("dek").classList.add("open");
}

async function terugNaarTeDoen(id){
  const j = await stil("terug-naar-te-doen", {id});
  toast(j.melding, !j.ok);
  if (!j.ok) return;
  delete detailCache[id];
  await laad();
  // meteen openen in Te doen, zodat je verder kunt
  staat.tab = "te_doen"; staat.td = "open"; staat.detail = null; bewaar();
  if ([...D.zelf, ...D.wacht].some(i => i.id === id)) openPaneel(id); else teken();
}

// ---------------- Zoeken (⌘K of /) ----------------
let zoekTreffers = [], zoekRes = null, zoekKeuze = 0, zoekTimer = null, zoekVraag = "";
const zoekVeld = () => document.getElementById("zoekveld");

function zoekResultaten(){
  if (!zoekRes) return [];
  return [...zoekRes.mail.map(x => ({soort:"mail", x})), ...zoekRes.wacht.map(x => ({soort:"wacht", x})), ...zoekRes.taken.map(x => ({soort:"taak", x}))];
}
function tekenZoek(){
  const box = document.getElementById("zoekres"), alle = zoekResultaten();
  if (!zoekVraag){ box.hidden = true; box.innerHTML = ""; return; }
  box.hidden = false;
  if (!zoekRes){ box.innerHTML = `<div class="zr-leeg meta">Searching…</div>`; return; }
  if (!alle.length){ box.innerHTML = `<div class="zr-leeg">Nothing found for <b>${esc(zoekVraag)}</b>. Search covers email the app has processed, not your whole mailbox.</div>`; return; }
  zoekKeuze = Math.min(zoekKeuze, alle.length - 1);
  const kop = {mail:"Email", wacht:"Awaiting reply", taak:"Tasks"};
  let vorige = "", html = "";
  alle.forEach((r, n) => {
    if (r.soort !== vorige){ html += `<div class="zr-kop">${kop[r.soort]}</div>`; vorige = r.soort; }
    const x = r.x, aan = n === zoekKeuze ? " aan" : "";
    if (r.soort === "mail"){
      const a = afzender(x.van), [i, l] = afgLabel(x);
      html += `<button class="zr-rij${aan}" data-zr="${n}" role="option">${avatar(x, true)}<span class="zr-midden"><span class="zr-r1"><b>${esc(a.naam)}</b><span class="meta">${datum(x.datum)}</span></span>
        <span class="zr-r2">${esc(x.onderwerp || "(no subject)")}</span></span><span class="chip">${ik(i)}${esc(l)}</span></button>`;

let laatsteGedaan = null, achterstandBezig = false;   // {id, tijd}: E en V werken acht seconden lang op deze mail
async function gedaanMelding(id, onderwerp = "", plek = null, plekNaam = null){
  laatsteGedaan = {id, tijd: Date.now()};
  const kort = onderwerp.length > 48 ? onderwerp.slice(0, 46) + "…" : onderwerp;
  if (plek){   // al opgeborgen: zeggen waar, met Undo en een andere plek
    const inMap = plek.startsWith("map:");
    toast(`Done${kort ? `: \u201c${kort}\u201d` : ""}, ${inMap ? `filed in ${plekNaam}` : "archived"}. ${inMap ? "E archives it instead, V" : "V"} picks a folder.`, false, [
      {label: "Undo", doe: async () => { const r = await stil("niet-gedaan", {id}); toast(r.melding, !r.ok); staat.open = id; laad(); }},
      ...(inMap ? [{label: "Archive instead", doe: () => verplaatsMetUndo([id], "archief")}] : []),
      {label: "Folder…", doe: () => openKiezer(id, null, [id])}]);
    const m = document.getElementById("toasts").lastElementChild;
    if (m) m.dataset.gedaan = id;
    return;
  }
  const tekst = kort ? `Done: \u201c${kort}\u201d. Press E to archive it or V to file it.` : "Done. Move it as well?";
  const knoppen = (voorstel) => [
    {label: "Archive", doe: () => verplaatsMetUndo([id], "archief")},
    ...(voorstel ? [{label: `Move to ${voorstel.split("/").pop()}`, doe: () => verplaatsMetUndo([id], "map:" + voorstel)}] : []),
    {label: "Folder…", doe: () => openKiezer(id, null, [id])},
    {label: "Undo", doe: async () => { const r = await stil("niet-gedaan", {id}); toast(r.melding, !r.ok); staat.open = id; laad(); }}];
  // eerst meteen de melding; het mapvoorstel volgt als het er snel is
  toast(tekst, false, knoppen(null));
  const melding = document.getElementById("toasts").lastElementChild;
  if (melding) melding.dataset.gedaan = id;
  const j = await Promise.race([stil("mappen", {id}), new Promise(r => setTimeout(() => r(null), 2500))]);
  if (j && j.ok && j.voorstellen.length && melding && melding.isConnected){
    melding.remove();
    toast(tekst, false, knoppen(j.voorstellen[0].map));
    const nieuw = document.getElementById("toasts").lastElementChild;
    if (nieuw) nieuw.dataset.gedaan = id;
  }
}

const bezigMetPlannen = new Set();
async function planTaakIn(id, start){
  const taakRij = D.taken.find(x => x.id === id);

  bezigMetPlannen.add(id);

  const j = await stil("taak-plannen", {id, start, minuten: taakRij.minuten || 30});

function sleepbaar(a){
  if (a.heledag || (a.vrij && !isFocus(a))) return false;
  if (appTaakBij(a)) return true;
  return !!a.id && a.wijzigbaar !== false && !(a.deelnemers && a.deelnemers.length);

async function verzetAfspraak(a, start, minuten, stil_){
  const t = appTaakBij(a), oudStart = a.start, oudMin = Math.round((Date.parse(a.eind) - Date.parse(a.start)) / 60000);
  const data = t ? {taak: t.id, start: lokaalIso(start), minuten} : {id: a.id, oud_start: a.start, start: lokaalIso(start), minuten};
  a.start = lokaalIso(start); a.eind = lokaalIso(start + minuten * 60000);       // meteen tonen
  if (t){ t.gepland = a.start; t.minuten = minuten; }
  teken();
  const j = await stil("afspraak-verplaats", data);
  if (!j.ok){ a.start = oudStart; a.eind = lokaalIso(Date.parse(oudStart) + oudMin * 60000); if (t) t.gepland = oudStart; toast(j.melding, true); return teken(); }
  if (!stil_) toast(j.melding, false, {label: "Undo", doe: () => verzetAfspraak(a, Date.parse(oudStart), oudMin, true)});
  await laad();
  verversDag(staat.planDag);
}

document.addEventListener("pointerup", () => {
  if (!afsSleep) return;
  const s_ = afsSleep; afsSleep = null;
  document.body.classList.remove("blok-slepen");
  if (!s_.bewogen) return;                       // gewone klik: het venstertje opent
  negeerKlik = true; setTimeout(() => { negeerKlik = false; }, 400);
  if (s_.start === s_.start0 && s_.duur === s_.duur0) return teken();
  verzetAfspraak(s_.a, s_.start, s_.duur);
}, true);

// Venstertje met details van een afspraak in Planning; bij een taak van de app ook de taak en wat je ermee kunt
function appTaakBij(a){
  return (D.taken || []).find(t => t.gepland && ((t.afspraak_id && t.afspraak_id === a.id) ||
    (Math.abs(Date.parse(t.gepland) - Date.parse(a.start)) < 60000 && String(a.titel).startsWith(String(t.omschrijving).slice(0, 25)))));
}
const linkjes = tekst => esc(tekst).replace(/https?:\/\/[^\s<>"']+/g, u => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u.length > 56 ? u.slice(0, 53) + "…" : u}</a>`);
function deelnameLink(a){
  const m = `${a.locatie || ""} ${a.url || ""} ${a.notities || ""}`.match(/https:\/\/teams\.microsoft\.com\/l\/meetup-join\/[^\s<>"']+|https:\/\/[\w.-]*zoom\.us\/j\/[^\s<>"']+|https:\/\/meet\.google\.com\/[a-z0-9-]+/i);
  return m ? m[0] : null;
}
function sluitPop(){ document.getElementById("afs-pop")?.remove(); }
// soort van de afspraak: wat de app denkt en waarom, en zelf kiezen (geldt ook voor de volgende keren)
const SOORT_NAAM = {les: "Class", afdeling: "Department or team", overleg: "Meeting with others", eigen: "Personal event"};
const SOORT_IK = {les: "les", afdeling: "afdeling", overleg: "mensen", eigen: "calendar"};
function soortHTML(a){
  const huidig = a.soort || "eigen";
  const waarom = a.soort_waarom ? ` <span class="meta">· ${esc(a.soort_waarom)}${a.soort_door === "claude" ? " (Claude)" : ""}</span>` : "";
  return `<div class="pop-r">${ik(SOORT_IK[huidig] || "calendar")}<span><b>${SOORT_NAAM[huidig] || "Event"}</b>${waarom}</span></div>
    ${huidig === "overleg" || huidig === "afdeling" ? `<div class="pop-r meta-r">With others: reschedule it in Outlook</div>` : ""}
    <div class="pop-soort">${Object.keys(SOORT_NAAM).map(k => `<button class="knop klein${k === huidig ? " aan" : ""}" data-zetsoort="${k}" data-sleutel="${esc(a.sleutel || "")}"
        data-titel="${esc(a.titel)}" data-herhaalt="${a.herhaalt ? 1 : 0}" title="${k === huidig ? "Current type" : "Mark as " + SOORT_NAAM[k].toLowerCase()}">${ik(SOORT_IK[k])}${SOORT_NAAM[k]}</button>`).join("")}
      ${a.soort_door === "jij" ? `<button class="knop klein" data-zetsoort="auto" data-sleutel="${esc(a.sleutel || "")}">Automatic</button>` : ""}</div>`;
}

// zelf leren wat een les is: titel, organisator of agenda; ook terugdraaien
function lesKeuze(a){
  const org = a.organisator && (a.organisator.adres || a.organisator.naam);
  const r = a.les_regel;
  if (r) return `<div class="pop-les"><span class="meta">${r.les ? "Class" : "Not a class"} because of your rule (${esc({titel: "title", organisator: "organiser", kalender: "calendar"}[r.soort] || r.soort)}: ${esc(r.waarde)})</span>
      <button class="knop klein" data-lesweg="${r.id}">Remove rule</button></div>`;
  if (a.soort === "les") return `<details class="pop-les"><summary>Not a class?</summary>
      <button class="knop klein" data-lesregel="titel" data-waarde="${esc(a.titel)}" data-les="0">Events with this title are not classes</button></details>`;
  return `<details class="pop-les"><summary>${ik("les")}Recognise all these classes at once</summary>
      <div class="pop-les-k">
        <button class="knop klein" data-lesregel="titel" data-waarde="${esc(a.titel)}" data-les="1">Everything with this title</button>
        ${org ? `<button class="knop klein" data-lesregel="organisator" data-waarde="${esc(org)}" data-label="${esc(a.organisator.naam || org)}" data-les="1">Everything from ${esc(a.organisator.naam || org)}</button>` : ""}
        ${a.kalender && a.kalender !== D.agenda_naam ? `<button class="knop klein" data-lesregel="kalender" data-waarde="${esc(a.kalender)}" data-les="1">Everything in the calendar ‘${esc(a.kalender)}’</button>` : ""}
      </div></details>`;
}
// deelnamestatus: de server stuurde eerst Nederlandse waarden; beide worden getoond als Engels
const DEELNAME = {ja: "accepted", nee: "declined", misschien: "maybe", "nog geen antwoord": "no response yet", gedelegeerd: "delegated", klaar: "completed", bezig: "in process"};
function openAfspraak(i, anker){
  const lijst = dagen[staat.planDag], a = Array.isArray(lijst) ? lijst[i] : null;
  if (!a) return;
  sluitPop();
  const t = appTaakBij(a), link = deelnameLink(a), dl = a.deelnemers || [];
  const tel = st => dl.filter(d => (DEELNAME[d.status] || d.status) === st).length;
  const dagTekst = new Date(a.start).toLocaleDateString("en-GB", {weekday: "long", day: "numeric", month: "long"});
  const tijd = a.heledag ? "all day" : `${tijdVan(Date.parse(a.start))}–${tijdVan(Date.parse(a.eind))}`;
  const el = document.createElement("div");
  el.id = "afs-pop"; el.className = "afs-pop"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "Event details");
  el.innerHTML = `
    <div class="pop-kop"><b>${esc(t ? t.omschrijving : a.titel)}</b><button class="ikoon" data-popdicht="1" title="Close (Esc)">${ik("x")}</button></div>
    <div class="pop-r">${ik("clock")}<span>${esc(dagTekst)} · ${tijd}${a.vrij ? " · counts as free" : ""}${isFocus(a) ? " · protected" : ""}</span></div>
    ${a.voorlopig ? `<div class="pop-r">${ik("clock")}<span><b>Held as tentative</b> for a meeting you proposed</span></div>
      <div class="pop-acties"><button class="knop klein goed" data-bevestig="${esc(a.id)}">${ik("check")}Confirm</button>
        <button class="knop klein" data-vrijgeven="${esc(a.id)}">Release</button></div>
      <div class="meta-r">Confirming makes this the actual meeting and releases the other proposed times.</div>`
      : !t && !a.vrij && !a.heledag ? soortHTML(a) : ""}
    ${a.locatie ? `<div class="pop-r">${ik("pin")}<span>${linkjes(a.locatie)}</span></div>` : ""}
    ${a.kalender ? `<div class="pop-r">${ik("calendar")}<span>${esc(a.kalender)}</span></div>` : ""}
    ${a.organisator && (a.organisator.naam || a.organisator.adres) ? `<div class="pop-r">${ik("mail")}<span>Organised by ${esc(a.organisator.naam || a.organisator.adres)}</span></div>` : ""}
    ${dl.length ? `<details class="pop-deel"><summary>${ik("mensen")}${dl.length} ${dl.length === 1 ? "attendee" : "attendees"}${tel("accepted") ? ` · ${tel("accepted")} accepted` : ""}${tel("maybe") ? ` · ${tel("maybe")} maybe` : ""}${tel("declined") ? ` · ${tel("declined")} declined` : ""}</summary>
        ${dl.map(d => `<div class="pop-d"><span>${esc(d.naam || d.adres)}${d.ik ? " (you)" : ""}</span><span class="meta">${esc(DEELNAME[d.status] || d.status)}</span></div>`).join("")}</details>` : ""}
    ${link ? `<a class="knop goed pop-deelnemen" href="${esc(link)}" target="_blank" rel="noopener noreferrer">${ik("forward")}Join the meeting</a>` : ""}
    ${t ? `<div class="pop-taak">
        ${t.stappen && t.stappen.length ? `<ul class="stappen-klein">${t.stappen.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
        ${lijktGedaan(t)}${taakMail(t)}
        <div class="pop-acties"><button class="knop klein goed" data-klaar="${t.id}">${ik("check")}Tick off</button>
          <button class="knop klein" data-verzet="${t.id}" data-start="${esc(a.start)}" title="Remove from your calendar and move it straight to another time">${ik("clock")}Reschedule</button>
          <button class="knop klein" data-uitagenda="${t.id}" title="Remove from your calendar; the task stays under To schedule">${ik("x")}Remove from calendar</button></div></div>`
      : a.notities ? `<details class="pop-notities"${link ? "" : " open"}><summary>Notes</summary><div>${linkjes(a.notities)}</div></details>` : ""}
    ${!t && !a.vrij ? lesKeuze(a) : ""}
    <div class="pop-voet"><button class="knop klein" data-agendaopen="${esc(a.start)}">${ik("calendar")}Open in Calendar</button></div>`;
  document.body.append(el);
  // naast de afspraak, binnen het venster; op een smal scherm onderin (CSS)
  if (innerWidth > 700){
    const r = anker.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
    let x = r.left - w - 10;
    if (x < 8) x = Math.min(innerWidth - w - 8, r.right + 10);
    if (x < 8) x = 8;
    el.style.left = x + "px";
    el.style.top = Math.max(8, Math.min(innerHeight - h - 8, r.top - 8)) + "px";
  }
  el.querySelector("[data-popdicht]").focus();
}
document.addEventListener("click", async ev => {
  const afs = ev.target.closest("#pl-tijdlijn .afs[data-afs], .heledag [data-afs]");
  if (afs && negeerKlik){ ev.stopPropagation(); return; }
  if (afs && staat.tab === "planning" && !plaatsing && !gekozenKaart){ ev.stopPropagation(); return openAfspraak(Number(afs.dataset.afs), afs); }
  const pop = document.getElementById("afs-pop");
  if (!pop) return;
  if (!ev.target.closest("#afs-pop")) return sluitPop();
  const b = ev.target.closest("button");
  if (!b) return;
  const d = b.dataset;
  if (d.popdicht) return sluitPop();
  if (d.agendaopen){ stil("agenda-openen", {start: d.agendaopen}); return; }
  if (d.bevestig || d.vrijgeven){
    sluitPop();
    const j = await stil(d.bevestig ? "voorlopig-bevestig" : "voorlopig-vrij", {afspraak: d.bevestig || d.vrijgeven});
    toast(j.melding, !j.ok); legeDagen(); return teken();
  }
  if (d.zetsoort){
    sluitPop();
    const j = await stil("afspraak-soort", {sleutel: d.sleutel, soort: d.zetsoort === "auto" ? null : d.zetsoort,
                                            titel: d.titel, herhaalt: d.herhaalt === "1"});
    toast(j.melding, !j.ok); legeDagen(); return teken();
  }
  if (d.lesregel || d.lesweg){
    sluitPop();
    const j = d.lesweg ? await stil("les-regel-weg", {id: Number(d.lesweg)})
                       : await stil("les-regel", {soort: d.lesregel, waarde: d.waarde, label: d.label, les: d.les === "1"});
    toast(j.melding, !j.ok); legeDagen(); return teken();
  }
  if (d.uitagenda){
    sluitPop();
    const j = await stil("afspraak-weg", {id: Number(d.uitagenda)});
    toast(j.melding, !j.ok); legeDagen(); return laad();
  }
  if (d.verzet){
    sluitPop();
    const id = Number(d.verzet), t = D.taken.find(x => x.id === id);
    const j = await stil("afspraak-weg", {id});
    if (!j.ok) return toast(j.melding, true);
    if (t){ t.gepland = null; plaatsing = {id, minuten: t.minuten || 30, start: Date.parse(d.start)}; }
    legeDagen();
    toast("Drag the block to a new time and click Schedule");
    teken(); return laad();
  }
  if (d.klaar || d.mailopen || d.beantwoord) setTimeout(sluitPop, 0);   // die knoppen werken zoals op de kaart
}, true);
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && document.getElementById("afs-pop")){ ev.stopImmediatePropagation(); sluitPop(); }
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches && ev.target.matches("[data-afs]")){ ev.preventDefault(); openAfspraak(Number(ev.target.dataset.afs), ev.target); }
}, true);

// Wacht op antwoord: verstuurde mail met een vraag, zonder antwoord na een paar werkdagen
const kortDatum = iso => new Date(iso.length > 10 ? iso : iso + "T12:00").toLocaleDateString("en-GB", {day:"numeric", month:"short"});
function tekenWachtOp(){
  const vandaag = isoDag(new Date()), lijst = D.wacht_op || [];
  const nu = lijst.filter(w => w.herinner_op <= vandaag), loopt = lijst.filter(w => w.herinner_op > vandaag);
  if (!lijst.length) return "";
  const naam = w => esc((w.aan || "").split(",")[0].trim() || "the recipient");
  const rij = (w, open) => `<div class="rij wachtrij${staat.wacht === w.id ? " gekozen" : ""}${open ? " urg" : ""}" data-wacht="${w.id}" tabindex="0">
      <span class="ikoon" style="color:var(--let)">${ik("wacht")}</span>
      <div class="midden"><div class="regel1"><span class="van">${esc(w.onderwerp || "(no subject)")}</span><span class="datum">${kortDatum(w.verstuurd)}</span></div>
        <div class="samenvatting">To ${naam(w)}${w.wat ? ` · waiting for: ${esc(w.wat)}` : ""}${open ? "" : ` · back on ${kortDatum(w.herinner_op)}`}</div>
        ${w.sindsdien && w.sindsdien.length ? `<div class="chips"><span class="chip">${ik("mail")}email from ${naam(w)} since then</span></div>` : ""}
      </div></div>`;
  return (nu.length ? `<div class="groep-kop"><h2>${ik("wacht")}Awaiting reply · ${nu.length}</h2></div><div class="lijst" style="margin-bottom:14px">${nu.map(w => rij(w, true)).join("")}</div>` : "")
    + (loopt.length ? `<details class="regels wachtloopt"><summary>You are waiting for ${loopt.length} ${loopt.length === 1 ? "reply" : "replies"}</summary><div class="lijst">${loopt.map(w => rij(w, false)).join("")}</div></details>` : "");
}

// Paneel bij 'wacht op antwoord': wat je vroeg, wat er sindsdien kwam, en een herinnering
const wachtSchrijft = new Set();
function werkdagenSinds(iso){
  const dagen = new Set((D.werktijd && D.werktijd.dagen) || [1, 2, 3, 4, 5]);
  const d = new Date(iso.slice(0, 10) + "T12:00"), vandaag = new Date(isoDag(new Date()) + "T12:00");
  let n = 0;
  while (d < vandaag){ d.setDate(d.getDate() + 1); if (dagen.has(d.getDay() || 7)) n++; }
  return n;
}
function tekenWachtPaneel(w){
  const p = document.getElementById("paneel");
  const sig = JSON.stringify(["wacht", w, wachtSchrijft.has(w.id), drieKolommen()]);
  if (p.dataset.sig === sig && p.classList.contains("open")) return;
  const oud = document.getElementById("w-concept");
  const concept = oud && Number(oud.dataset.wachtid) === w.id && !wachtSchrijft.has(-w.id) ? oud.value : (w.concept || "");
  wachtSchrijft.delete(-w.id);
  p.dataset.sig = sig; p.dataset.id = ""; p.dataset.lees = ""; p.dataset.sleutel = "";
  const naam = esc((w.aan || "").split(",")[0].trim() || "the recipient");
  const nu = w.herinner_op <= isoDag(new Date()), n = werkdagenSinds(w.verstuurd);
  const bezig = wachtSchrijft.has(w.id);
  p.innerHTML = `
    <div class="p-kop"><span class="avatar wacht-av">${ik("wacht")}</span>
      <div style="min-width:0"><h2>${esc(w.onderwerp || "(no subject)")}</h2>
        <div class="van">To ${esc((w.aan || "").replace(/[,\s]+$/, "").replace(/,\s*,/g, ","))} · sent ${datum(w.verstuurd)}</div>
        <div class="chips">${nu ? `<span class="chip let">${ik("wacht")}No reply for ${n === 1 ? "1 working day" : n + " working days"}</span>`
          : `<span class="chip">${ik("clock")}back on ${kortDatum(w.herinner_op)}</span>`}</div></div>
      <button class="ikoon sluit-mail" id="sluit" title="Close (Esc)">${ik("x")}</button></div>
    <div class="p-inhoud">
      ${w.wat ? `<div class="melding info">${ik("sparkle")}<div><b>You are waiting for:</b> ${esc(w.wat)}</div></div>` : ""}
      ${w.sindsdien && w.sindsdien.length ? `<div class="melding">${ik("mail")}<div><b>Since then, ${naam} has sent email</b>. The answer may be in another conversation.
        ${w.sindsdien.map(m => `<div class="sinds"><span>${esc(m.onderwerp || "(no subject)")} · ${datum(m.datum)}</span>
          ${m.item && ["wacht", "fout", "handmatig"].includes(m.status) ? `<button class="knop klein" data-openmail="${m.item}">View</button>` : ""}</div>`).join("")}
        <div style="margin-top:8px"><button class="knop klein" data-wachtklaar="${w.id}">${ik("check")}That had the answer</button></div></div></div>` : ""}
      <div><div class="label">${ik("forward")}What you wrote</div>
        <div class="leesvlak">${w.tekst ? esc(w.tekst) : `<span class="meta">The text of this email has not been saved yet. That happens in the next round; until then, open it in Mail.</span>`}</div></div>
      <div><div class="label">${ik("reply")}Reminder</div>
        <textarea id="w-concept" data-wachtid="${w.id}" placeholder="Have Claude write a short reminder, or type your own.">${esc(concept)}</textarea>
        <div class="c-schrijf"><button class="knop" id="w-claude" data-wachtid="${w.id}"${bezig || !w.tekst ? " disabled" : ""}>${ik("sparkle")}${bezig ? "Claude is writing…" : concept.trim() ? "Redraft with Claude" : "Have Claude write a reminder"}</button></div></div>
    </div>
    <div class="p-voet">
      <button class="knop" data-wachtopen="${w.id}" title="Open the email you sent in Apple Mail">${ik("mail")}<span class="lbl">Open in Mail</span></button>
      <button class="knop" data-wachtlater="${w.id}" title="Wait three more working days">${ik("clock")}<span class="lbl">3 more working days</span></button>
      <button class="knop" data-wachtklaar="${w.id}" title="Resolved: remove from the list">${ik("check")}<span class="lbl">Resolved</span></button>
      <span style="flex:1"></span>
      <button class="knop goed" id="w-kopieer" data-wachtid="${w.id}" title="Copy the reminder to your clipboard and open your email in Mail. There, choose Reply All and paste with ⌘V.">${ik("forward")}<span class="lbl">Copy and open in Mail</span></button>
    </div>`;
  p.classList.add("open"); p.setAttribute("aria-hidden", "false");
  if (!drieKolommen()) document.getElementById("dek").classList.add("open");
}

async function schrijfHerinnering(id){
  wachtSchrijft.add(id); teken();
  const j = await stil("wacht-herinnering", {id});
  wachtSchrijft.delete(id);
  if (!j.ok){ toast(j.melding, true); return teken(); }
  const w = (D.wacht_op || []).find(x => x.id === id); if (w) w.concept = j.concept;
  wachtSchrijft.add(-id);          // het nieuwe concept gebruiken in plaats van wat er stond
  teken();
}

async function kopieerHerinnering(id){
  const veld = document.getElementById("w-concept"), tekst = veld ? veld.value.trim() : "";
  if (!tekst) return toast("Write a reminder first, or have Claude write one", true);
  if (/\[\s*(FILL IN|AANVULLEN)/i.test(tekst)) return toast("Fill in the [FILL IN: …] placeholder first", true);
  let gekopieerd = false;
  try { await navigator.clipboard.writeText(tekst); gekopieerd = true; }
  catch(e){ veld.select(); try { gekopieerd = document.execCommand("copy"); } catch(e2){} }
  if (!gekopieerd) return toast("Copying did not work; select the text and copy with ⌘C", true);
  await stil("wacht-concept", {id, concept: tekst});
  const o = await stil("wacht-openen", {id});
  const l = await stil("wacht-later", {id, werkdagen: 3});
  toast(`The reminder is on your clipboard. ${o.ok ? "In Mail, choose Reply All and paste with ⌘V." : o.melding} ${l.ok ? l.melding + "." : ""}`, !o.ok);
  laad();
}

function tekenBelangrijk(){
  const lijst = D.belangrijk || [];
  return `<details class="regels"><summary>${ik("ster")}Important senders (${lijst.length})</summary><div class="lijst">
    ${lijst.length ? lijst.map(b => `<div class="rij" style="cursor:default"><span class="ikoon" style="color:var(--let)">${ik("ster")}</span>
      <div class="midden">${esc(b.naam ? `${b.naam} · ${b.adres}` : b.adres)}</div>
      ${b.vast ? `<span class="meta">in config.yaml</span>` : `<button class="knop klein" data-belangrijkweg="${esc(b.adres)}">Remove</button>`}</div>`).join("")
      : `<div class="leeg" style="padding:18px">Click the star next to the sender of an email. Their email always goes to To do and you get a notification on your Mac.</div>`}
  </div></details>`;
}

function tekenBeoordelen(items){
  if (!items.length) return leeg("All caught up", "Nothing is waiting for your review.", true);
  return `<div class="lijst">${items.map(it => { const a = afzender(it.van), [ai, al] = ACTIES[it.actie] || ["mail", it.actie];
    // één label: wat er van jou nodig is; deadline erbij als die er is
    const dl = it.deadline ? ` · ${new Date(it.deadline + "T12:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"})}` : "";
    const chips = [];
    if (it.lijkt_beantwoord) chips.push(`<span class="chip ok">${ik("check")}Looks answered</span>`);
    if (it.status === "fout" || it.status === "handmatig") chips.push(`<span class="chip let">${ik("alert")}Check it yourself</span>`);
    else if (it.vragen) chips.push(`<span class="chip let">Decision${dl}</span>`);
    else chips.push(`<span class="chip">${ik(ai)}${al}${dl}</span>`);
    return `<div class="rij${staat.open===it.id?" gekozen":""}${isUrgent(it) ? " urg" : ""}" data-open="${it.id}" tabindex="0">
      ${avatar(it)}
      <div class="midden">
        <div class="regel1"><span class="van">${it.belangrijk ? `<span class="vip" title="Important sender">${ik("ster")}</span>` : ""}${esc(a.naam)}${it.prioriteit === "hoog" ? `<span class="prio" title="High priority"></span>` : ""}</span><span class="datum">${datum(it.datum)}</span></div>
        <div class="onderwerp">${esc(it.onderwerp)}</div>
        <div class="samenvatting">${esc(it.samenvatting && it.samenvatting !== it.onderwerp ? it.samenvatting : (it.opmerking || ""))}</div>
        <div class="chips">${chips.join("")}</div>
      </div>
    </div>`; }).join("")}</div>`;
}

function taakMail(t){
  if (!t.mail) return "";
  const a = afzender(t.mail.van);

async function claudeAntwoord(){

// wat je eerder met mail van deze afzender deed
function gewoonte(it){
  const g = (D.gedrag || {})[afzender(it.van).adres.toLowerCase()];
  if (!g) return null;
  const opties = [["prullenbak", g.prullenbak||0, "binned"], ["archief", g.archief||0, "archived"], ["taak", g.taak||0, "made into a task"]]
    .filter(o => o[1] >= 2).sort((a, b) => b[1] - a[1]);
  return opties.length ? {actie: opties[0][0], tekst: `usually ${opties[0][2]} (${opties[0][1]}×)`} : null;
}

function opruimGroep(titel, items, hoofd){
  if (!items.length) return "";
  const ids = items.map(i => i.id).join(",");
  const groot = hoofd === "slim"
    ? `<button class="knop klein" data-groep="slim" data-ids="${ids}" title="Each email goes where you filed earlier email from that sender, otherwise to your usual folder for the project, otherwise to your archive">${ik("folder")}File all</button>`
    : hoofd === "archief"
    ? `<button class="knop klein" data-groep="archief" data-ids="${ids}">${ik("archive")}Archive all</button>`
    : `<button class="knop klein" data-groep="prullenbak" data-ids="${ids}">${ik("trash")}Move all to Bin</button>`;
  const nGekozen = items.filter(i => staat.gekozen.has(i.id)).length;
  return `<div class="groep"><div class="groep-kop"><input type="checkbox" class="vink groepvink" data-groepvink="${ids}" ${nGekozen === items.length ? "checked" : ""} data-deels="${nGekozen > 0 && nGekozen < items.length ? 1 : 0}" title="Select the whole group" aria-label="Select the whole ${titel} group"><h2>${titel} · ${items.length}</h2><div class="acties">${groot}</div></div>
    <div class="lijst">${items.map(it => { const a = afzender(it.van), gw = gewoonte(it);
      return `<div class="rij${staat.gekozen.has(it.id)?" gekozen":""}${staat.lees===it.id?" leest":""}" data-kies="${it.id}" tabindex="0">
        <input type="checkbox" class="vink" data-vink="${it.id}" ${staat.gekozen.has(it.id)?"checked":""} aria-label="Select">
        ${avatar(it, true)}

          <div class="regel1"><span class="van">${esc(a.naam)}</span><span class="datum">${datum(it.datum)}</span></div>
          <div class="samenvatting">${esc(it.samenvatting || it.onderwerp)}</div>

      <button class="knop klein" data-overslaanalle="${esc(vs.map(v => v.adres).join(","))}">${ik("ban")}Skip all</button></div>` : "";

  html += opruimGroep("FYI", info, "archief") + opruimGroep("Skipped", over, "prullenbak")
        + opruimGroep(D.oud_aantal > oud.length ? `Older email (first ${oud.length} of ${D.oud_aantal})` : "Older email", oud, "slim");

const duurTekst = m => m < 60 ? `${m} min` : `${Math.floor(m/60)} hr${m%60 ? " " + (m%60) + " min" : ""}`;
function momentTekst(iso, minuten){
  const b = new Date(iso), e = new Date(b.getTime() + (minuten||30)*60000);
  const tijd = d => d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  return `${b.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})} · ${tijd(b)}–${tijd(e)}`;
}
const vindItem = id => [...D.zelf, ...D.wacht, ...D.info, ...D.overgeslagen].find(i => i.id === id);
let taak = null;   // {id, item, voorstel, minuten, inplannen, start(ms), dag, archiveren}
const dagen = {};  // datum -> lijst afspraken | "laden" | {fout}
const legeDagen = () => Object.keys(dagen).forEach(k => delete dagen[k]);   // agenda opnieuw ophalen
// De agenda op de achtergrond opnieuw ophalen voor de dagen die je al bekeek, zonder 'Loading calendar…':
// na iets wat de app in je agenda zette, elke vijf minuten, en als je terugkomt in het venster (een afspraak die
// je intussen in Outlook maakte). Dagen ver weg worden vergeten en bij het bekijken opnieuw opgehaald.
let verversBezig = false;
async function verversDagen(){
  if (verversBezig || !D || !D.agenda_aan) return;
  verversBezig = true;
  const vandaag = isoDag(new Date()), grens = isoDag(new Date(Date.now() + 21 * 864e5));
  for (const dag of Object.keys(dagen)){

  }
  verversBezig = false;
  if (afsSleep || sleep || plaatsing) return;   // niet hertekenen midden in het slepen
  if (taak) tekenTaak(); else teken();
}

const indeelPogingen = {};
const PX = 0.8;    // pixels per minuut in het dagoverzicht bij Taak maken
let PLPX = 0.8;    // in Planning: zo dat de werkdag het paneel vult (zie plTijdlijnHTML)
const kortTitel = t => String(t || "").split(/ · (?:begin met|start with):/)[0];
// rode lijn op het huidige moment, als de getoonde dag vandaag is
function nuLijn(dag, van, tot, schaal){
  if (dag !== isoDag(new Date())) return "";
  const nu = new Date(), m = nu.getHours() * 60 + nu.getMinutes();
  if (m < van || m > tot) return "";
  return `<div class="nu-lijn" style="top:${(m - van) * schaal}px" title="Now, ${tijdVan(nu.getTime())}"><span class="nu-tijd">${tijdVan(nu.getTime())}</span></div>`;
}
// afspraken: vrije als achtergrond, bezette naast elkaar als ze overlappen
function afsprakenHTML(lijst, d0, van, tot, schaal, kalenderInTitel, klikbaar){
  const y = m => (m - van) * schaal;
  const alle = lijst.map((a, i) => ({...a, i})).filter(a => !a.heledag).map(a => ({...a, b: Math.max(van, (Date.parse(a.start)-d0)/60000), e: Math.min(tot, (Date.parse(a.eind)-d0)/60000)}))
                    .filter(a => a.e > a.b).sort((p, q) => p.b - q.b);
  let h = "";
  alle.filter(a => a.vrij && !isFocus(a)).forEach(a => {
    h += `<div class="afs-vrij" style="top:${y(a.b)}px;height:${Math.max(16, (a.e-a.b)*schaal - 2)}px" title="${esc(a.titel)} (counts as free)"><span>${esc(a.titel)}</span></div>`;
  });
  // alleen afspraken die elkaar echt overlappen delen de breedte; de rest krijgt de hele breedte
  const bezet = alle.filter(a => !a.vrij || isFocus(a)), groepen = [];
  let groep = null, groepEind = -1;
  bezet.forEach(a => { if (!groep || a.b >= groepEind){ groep = []; groepen.push(groep); groepEind = a.e; } else groepEind = Math.max(groepEind, a.e); groep.push(a); });
  groepen.forEach(g => {
    const kolEind = [];
    g.forEach(a => { let k = kolEind.findIndex(e => e <= a.b); if (k < 0){ k = kolEind.length; kolEind.push(0); } kolEind[k] = a.e; a.kol = k; });
    g.forEach(a => { a.n = Math.max(1, kolEind.length); });
  });
  const nuM = (Date.now() - d0) / 60000;
  bezet.forEach(a => {
    const hoog = Math.max(14, (a.e-a.b)*schaal - 2), n = a.n, sleep = klikbaar && sleepbaar(a);
    const regels = hoog < 30 ? 0 : Math.max(1, Math.floor((hoog - 4) / 15.6));   // hoeveel regels titel er passen
    const taak = klikbaar ? appTaakBij(a) : null, soort = a.voorlopig ? "voorlopig" : taak ? "taak" : isFocus(a) ? "" : (a.soort || "");
    const anderen = (a.deelnemers || []).filter(d => !d.ik).length;
    const voor = soort === "overleg" ? `<span class="afs-ik" title="Meeting with ${anderen} ${anderen === 1 ? "other person" : "other people"}">${ik("mensen")}${anderen}</span>`
      : soort === "voorlopig" ? `<span class="afs-ik" title="Held as tentative">${ik("clock")}</span>`
      : soort === "les" ? `<span class="afs-ik" title="Class">${ik("les")}</span>`
      : soort === "afdeling" ? `<span class="afs-ik" title="Department or team meeting">${ik("afdeling")}${anderen || ""}</span>`
      : soort === "taak" ? `<span class="afs-ik" title="Task from the app">${ik("check")}<span class="stip" style="background:${kleur(taak.project)}"></span></span>` : "";
    h += `<div class="afs${isFocus(a) ? " focus" : ""}${soort ? " soort-" + soort : ""}${a.b <= nuM && nuM < a.e ? " nu" : ""}${hoog < 30 ? " smal" : " klem"}${klikbaar ? " klik" : ""}${sleep ? " sleepbaar" : ""}"${klikbaar ? ` data-afs="${a.i}" tabindex="0"` : ""} style="top:${y(a.b)}px;height:${hoog}px;left:${a.kol*100/n}%;width:calc(${100/n}% - 3px)${hoog < 30 ? `;line-height:${hoog - 2}px` : `;-webkit-line-clamp:${regels}`}"
      title="${esc(a.titel)}${kalenderInTitel && a.kalender ? " · " + esc(a.kalender) : ""}${sleep ? " · drag to reschedule" : ""}">${voor}${esc(kortTitel(a.titel))}${isFocus(a) ? " · protected" : ""}${sleep ? `<div class="rek" title="Drag to make longer or shorter"></div>` : ""}</div>`;
  });
  return h;
}
const tweeCijfers = n => String(n).padStart(2, "0");
const isoDag = d => `${d.getFullYear()}-${tweeCijfers(d.getMonth()+1)}-${tweeCijfers(d.getDate())}`;
const lokaalIso = ms => { const d = new Date(ms); return `${isoDag(d)}T${tweeCijfers(d.getHours())}:${tweeCijfers(d.getMinutes())}`; };
const dagBegin = dag => new Date(dag + "T00:00").getTime();
const uurMin = t => { const [h, m] = t.split(":").map(Number); return h*60 + m; };
const kortMoment = iso => { const d = new Date(iso);
  return `${d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})} ${tweeCijfers(d.getHours())}:${tweeCijfers(d.getMinutes())}`; };

async function laadDag(dag){
  if (dagen[dag] !== undefined) return;
  dagen[dag] = "laden";
  try {
    const r = await post("dag", {datum:dag});
    const j = await r.json();
    dagen[dag] = j.ok ? j.afspraken : {fout: j.melding};
    if (j.ok && j.bezig){   // Claude deelt nieuwe afspraken in: zo meteen nog eens ophalen
      indeelPogingen[dag] = (indeelPogingen[dag] || 0) + 1;
      if (indeelPogingen[dag] <= 5) setTimeout(() => { if (Array.isArray(dagen[dag])) { delete dagen[dag]; laadDag(dag); } }, 5000);
    }
  } catch(e){ dagen[dag] = {fout: "Calendar not reachable"}; }
  if (taak && taak.dag === dag) tekenTaak();
  else if (staat.tab === "planning" && staat.planDag === dag) teken();
  else if (staat.tab === "te_doen" && dag === isoDag(new Date())) teken();   // afspraken in het overzicht van vandaag
}

function zetStart(ms){
  taak.start = ms; taak.dag = isoDag(new Date(ms)); taak.inplannen = true; taak.scrollen = true;
  laadDag(taak.dag);
}

function botsingen(){
  const lijst = Array.isArray(dagen[taak.dag]) ? dagen[taak.dag] : [];
  const b = taak.start, e = b + taak.minuten*60000;
  return lijst.filter(a => !a.heledag && !a.vrij && Date.parse(a.start) < e && Date.parse(a.eind) > b);
}

function tijdlijnBereik(){
  const w = taak.voorstel.werktijd || {begin:"09:00", eind:"17:00"};
  const sMin = Math.round((taak.start - dagBegin(taak.dag)) / 60000);
  const van = Math.max(0, Math.min(uurMin(w.begin) - 60, Math.floor(sMin/60)*60));
  const tot = Math.min(24*60, Math.max(uurMin(w.eind) + 60, Math.ceil((sMin + taak.minuten)/60)*60));
  return {van, tot, w};
}

function tijdlijnHTML(){
  const lijst = dagen[taak.dag];
  if (lijst === undefined || lijst === "laden") return `<div class="tijdlijn"><div class="tl-laden">Loading calendar…</div></div>`;
  if (lijst.fout) return `<div class="melding">${ik("alert")}<div>${esc(lijst.fout)}</div></div>`;
  const {van, tot, w} = tijdlijnBereik(), d0 = dagBegin(taak.dag);
  const y = min => (min - van) * PX;
  let h = "";
  // buiten werktijd
  if (uurMin(w.begin) > van) h += `<div class="buiten" style="top:0;height:${y(uurMin(w.begin))}px"></div>`;
  if (uurMin(w.eind) < tot) h += `<div class="buiten" style="top:${y(uurMin(w.eind))}px;height:${y(tot)-y(uurMin(w.eind))}px"></div>`;
  for (let m = van; m < tot; m += 30)
    h += `<div class="uur${m % 60 ? " half" : ""}" style="top:${y(m)}px">${m % 60 ? "" : `<span>${tweeCijfers(m/60)}:00</span>`}</div>`;
  h += afsprakenHTML(lijst, d0, van, tot, PX, true) + nuLijn(taak.dag, van, tot, PX);
  // de nieuwe taak
  const sMin = (taak.start - d0)/60000, bots = botsingen();
  h += `<div class="tb${bots.length ? " botst" : ""}" id="tb" style="top:${y(sMin)}px;height:${taak.minuten*PX - 2}px">
          <b>${esc(document.getElementById("t-titel")?.value || taak.voorstel.titel)}</b><span id="tb-tijd">${blokTijd()}</span><div class="rek"></div></div>`;
  const heledag = lijst.filter(a => a.heledag);
  return (heledag.length ? `<div class="heledag">${heledag.map(a => `<span>${esc(a.titel)}</span>`).join("")}</div>` : "") +
    `<div class="tijdlijn" id="tijdlijn"><div class="tl-binnen" id="tl-binnen" data-van="${van}" style="height:${(tot-van)*PX}px">${h}</div></div>` +
    (bots.length ? `<div class="melding fout">${ik("alert")}<div>Overlaps with ${esc(bots.map(a => a.titel).join(", "))}</div></div>` : "");
}

const tijdVan = ms => { const d = new Date(ms); return `${tweeCijfers(d.getHours())}:${tweeCijfers(d.getMinutes())}`; };

function blokTijd(){
  const b = new Date(taak.start), e = new Date(taak.start + taak.minuten*60000);
  return ` ${tweeCijfers(b.getHours())}:${tweeCijfers(b.getMinutes())}–${tweeCijfers(e.getHours())}:${tweeCijfers(e.getMinutes())} · ${duurTekst(taak.minuten)}`;
}

function verplaats(ids, doel){
  if (!ids.length) return;
  ids.forEach(i => staat.gekozen.delete(i));
  if (staat.tab === "te_doen" && ids.includes(staat.open)){ const v = volgendeNa(staat.open); staat.open = v; staat.geenAuto = v === null; }
  if (staat.tab === "opruimen" && ids.includes(staat.lees)){
    const l = opruimLijst().map(i => i.id), k = l.indexOf(staat.lees);
    const v = l.slice(k + 1).find(i => !ids.includes(i)) ?? l.slice(0, k).reverse().find(i => !ids.includes(i)) ?? null;
    staat.lees = v; staat.geenAuto = v === null;
  }
  if (doel === "overslaan") return (async () => {
    const j = await stil("verplaats", {ids, doel});
    if (!j.ok){ toast(j.melding, true); return laad(); }
    toast(j.melding, false, {label: "Undo", doe: async () => {
      const r = await stil("overslaan-terug", {adressen: j.adressen, items: j.items}); toast(r.melding, !r.ok); laad(); }});
    laad();
  })();
  return verplaatsMetUndo(ids, doel);
}

async function verplaatsMetUndo(ids, doel){
  await animeerWeg(ids);
  ids.forEach(i => verborgen.add(i)); teken();
  const j = await stil("verplaats", {ids, doel});
  ids.forEach(i => verborgen.delete(i));
  if (!j.ok) toast(j.melding, true);
  else toast(j.melding, false, {label: "Undo", doe: async () => {
    const r = await stil("terugzetten", {ids}); toast(r.melding, !r.ok); laad(); }});

let sleep = null;
document.addEventListener("pointerdown", ev => {
  const tl = ev.target.closest("#tijdlijn");
  if (!tl || !taak) return;
  const tb = ev.target.closest("#tb");
  sleep = {modus: ev.target.closest(".rek") ? "rek" : tb ? "schuif" : "klik", y0: ev.clientY, start0: taak.start, duur0: taak.minuten, bewogen: false, tl};
  if (tb){ tb.setPointerCapture(ev.pointerId); ev.preventDefault(); }
});
document.addEventListener("pointermove", ev => {
  if (!sleep || sleep.modus === "klik") return;
  const dy = ev.clientY - sleep.y0;
  if (Math.abs(dy) > 3) sleep.bewogen = true;
  const stap = Math.round(dy / PX / 15) * 15;
  const d0 = dagBegin(taak.dag);
  if (sleep.modus === "schuif"){
    const min = Math.min(24*60 - taak.minuten, Math.max(0, (sleep.start0 - d0)/60000 + stap));
    taak.start = d0 + min*60000;
  } else {
    taak.minuten = Math.max(15, Math.min(24*60 - (taak.start - d0)/60000, sleep.duur0 + stap));
  }
  const tb = document.getElementById("tb"), van = Number(document.getElementById("tl-binnen").dataset.van);
  tb.style.top = ((taak.start - d0)/60000 - van) * PX + "px";
  tb.style.height = taak.minuten * PX - 2 + "px";
  tb.classList.toggle("botst", botsingen().length > 0);
  document.getElementById("tb-tijd").textContent = blokTijd();
  const tv = document.getElementById("t-tijd"), tt = document.getElementById("t-tot");
  if (tv) tv.value = tijdVan(taak.start);
  if (tt) tt.textContent = "until " + tijdVan(taak.start + taak.minuten*60000);
});

document.addEventListener("pointerup", ev => {
  if (!sleep) return;
  const s = sleep; sleep = null;
  if (s.modus === "klik"){
    if (Math.abs(ev.clientY - s.y0) > 4) return;          // dat was scrollen, geen klik

      if (ev.shiftKey){ if (id !== null) staat.gekozen.add(id); staat.gekozen.add(naar); staat.anker = staat.anker ?? id; }
      else staat.anker = naar;
      return openLees(naar);
    }
    // acties gelden voor de selectie als die er is, anders voor de geopende mail
    const doel = staat.gekozen.size ? [...staat.gekozen] : (id === null ? [] : [id]);
    if (!doel.length) return;
    if (ev.key === "e") return verplaats(doel, "archief");
    if (ev.key === "#"){ ev.preventDefault(); return verplaats(doel, "prullenbak"); }
    if (ev.key === "v"){ ev.preventDefault(); return openKiezer(doel[0], document.querySelector('#paneel [data-opbergen]'), doel); }
    if (ev.key === "t" && id !== null) return openTaak(id);
    if (ev.key === " " && id !== null){ ev.preventDefault(); staat.gekozen.has(id) ? staat.gekozen.delete(id) : staat.gekozen.add(id); staat.anker = id; return teken(); }
    return;
  }
  if (staat.tab !== "te_doen" || taak || antwoord) return;
  const id = staat.open;
  if ((ev.metaKey || ev.ctrlKey) && ev.shiftKey && ev.key === "Enter" && id !== null){ ev.preventDefault(); return document.getElementById("verzenden")?.click(); }
  if ((ev.metaKey || ev.ctrlKey) && ev.key === "Enter" && id !== null){ ev.preventDefault(); return document.getElementById("goedkeuren")?.click(); }
  if (inVeld || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const lijst = teDoen().map(i => i.id), i = lijst.indexOf(id);
  if (ev.key === "j" || ev.key === "ArrowDown"){ ev.preventDefault(); if (lijst.length) openPaneel(lijst[Math.min(lijst.length-1, i+1)]); return; }
  if (ev.key === "k" || ev.key === "ArrowUp"){ ev.preventDefault(); if (lijst.length) openPaneel(lijst[Math.max(0, i-1)]); return; }
  if ((ev.key === "e" || ev.key === "v") && laatsteGedaan && Date.now() - laatsteGedaan.tijd < 8000){
    ev.preventDefault();
    const g = laatsteGedaan.id; laatsteGedaan = null;
    document.querySelectorAll(".toast[data-gedaan]").forEach(t => t.remove());
    return ev.key === "e" ? verplaatsMetUndo([g], "archief") : openKiezer(g, null, [g]);
  }
  if (id === null) return;
  if (ev.key === "e") return verplaats([id], "archief");
  if (ev.key === "v"){ ev.preventDefault(); return openKiezer(id, document.querySelector('#paneel [data-opbergen]')); }
  if (ev.key === "#"){ ev.preventDefault(); return verplaats([id], "prullenbak"); }
  if (ev.key === "x") return document.getElementById("afwijzen")?.click();
  if (ev.key === "d") return document.getElementById("gedaan")?.click();
  if (ev.key === "D"){ const g = document.getElementById("gedaan"); if (g){ g.dataset.metmap = "1"; g.click(); } return; }
  if (ev.key === "t") return openTaak(id);
  const n = Number(ev.key);
  if (n >= 1 && n <= D.projecten.length) return zetProject(id, D.projecten[n-1].naam);
});

async function zetProject(id, project){
  const it = [...D.zelf, ...D.wacht].find(x => x.id === id);
  if (!it || it.project === project) return;
  it.project = project; teken();
  const j = await stil("project", {id, project});
  toast(j.melding, !j.ok);
  laad();
}

const isFocus = a => /\b(focus|schrijven|deep work|writing)\b/i.test(a.titel || "");
// dag afsluiten: elke open taak krijgt een moment of gaat bewust naar Later

const blokTijdVan = (start, minuten) => `${tijdVan(start)}–${tijdVan(start + minuten*60000)} · ${duurTekst(minuten)}`;
function plBotsingen(){
