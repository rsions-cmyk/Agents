function plBotsingen(){
  if (!plaatsing) return [];
  const lijst = Array.isArray(dagen[staat.planDag]) ? dagen[staat.planDag] : [];
  const b = plaatsing.start, e = b + plaatsing.minuten*60000;
  return lijst.filter(a => !a.heledag && !a.vrij && Date.parse(a.start) < e && Date.parse(a.eind) > b);
}

function plTijdlijnHTML(){
  const lijst = dagen[staat.planDag];
  if (lijst === undefined || lijst === "laden") return `<div class="tijdlijn"><div class="tl-laden">Agenda laden…</div></div>`;
  if (lijst.fout) return `<div class="melding">${ik("alert")}<div>${esc(lijst.fout)}</div></div>`;
  const w = D.werktijd || {begin:"09:00", eind:"17:00"}, d0 = dagBegin(staat.planDag);
  let van = Math.max(0, uurMin(w.begin) - 60), tot = Math.min(24*60, uurMin(w.eind) + 60);
  if (plaatsing && isoDag(new Date(plaatsing.start)) === staat.planDag){
    const sm = (plaatsing.start - d0)/60000;
    van = Math.min(van, Math.floor(sm/60)*60); tot = Math.max(tot, Math.ceil((sm + plaatsing.minuten)/60)*60);
  }
  const y = m => (m - van) * PX;
  let h = "";
  if (uurMin(w.begin) > van) h += `<div class="buiten" style="top:0;height:${y(uurMin(w.begin))}px"></div>`;
  if (uurMin(w.eind) < tot) h += `<div class="buiten" style="top:${y(uurMin(w.eind))}px;height:${y(tot)-y(uurMin(w.eind))}px"></div>`;
  for (let m = van; m < tot; m += 30) h += `<div class="uur${m % 60 ? " half" : ""}" style="top:${y(m)}px">${m % 60 ? "" : `<span>${tweeCijfers(m/60)}:00</span>`}</div>`;
  const blokken = lijst.filter(a => !a.heledag).map(a => ({...a, b: Math.max(van, (Date.parse(a.start)-d0)/60000), e: Math.min(tot, (Date.parse(a.eind)-d0)/60000)}))
                       .filter(a => a.e > a.b).sort((p, q) => p.b - q.b);
  const kolEind = [];
  blokken.forEach(a => { let k = kolEind.findIndex(e => e <= a.b); if (k < 0){ k = kolEind.length; kolEind.push(0); } kolEind[k] = a.e; a.kol = k; });
  const n = Math.max(1, kolEind.length);
  blokken.forEach(a => { h += `<div class="afs${a.vrij ? " vrij" : ""}${isFocus(a) ? " focus" : ""}" style="top:${y(a.b)}px;height:${Math.max(16, (a.e-a.b)*PX - 2)}px;left:${a.kol*100/n}%;width:calc(${100/n}% - 3px)" title="${esc(a.titel)}">${esc(a.titel)}${isFocus(a) ? " · beschermd" : ""}</div>`; });
  if (plaatsing && isoDag(new Date(plaatsing.start)) === staat.planDag){
    const t = D.taken.find(x => x.id === plaatsing.id);
    h += `<div class="tb concept${plBotsingen().length ? " botst" : ""}" id="pl-blok" style="top:${y((plaatsing.start-d0)/60000)}px;height:${plaatsing.minuten*PX - 2}px">
            <b>${esc(t ? t.omschrijving : "Taak")}</b><span id="pl-tijd">${blokTijdVan(plaatsing.start, plaatsing.minuten)}</span><div class="rek"></div></div>`;
  }
  const heledag = lijst.filter(a => a.heledag);
  return (heledag.length ? `<div class="heledag">${heledag.map(a => `<span>${esc(a.titel)}</span>`).join("")}</div>` : "") +
    `<div class="tijdlijn" id="pl-tijdlijn"><div class="tl-binnen" id="pl-binnen" data-van="${van}" style="height:${(tot-van)*PX}px">${h}</div></div>`;
}

function minuutOp(clientY){
  const binnen = document.getElementById("pl-binnen");
  if (!binnen) return null;
  const r = binnen.getBoundingClientRect();
  if (clientY < r.top || clientY > r.bottom) return null;
  return Math.round(((clientY - r.top) / PX + Number(binnen.dataset.van)) / 15) * 15;
}
function plaats(id, clientY){
  const t = D.taken.find(x => x.id === id), m = minuutOp(clientY);
  if (!t || m === null) return false;
  const duur = t.minuten || 30;
  plaatsing = {id, minuten: duur, start: dagBegin(staat.planDag) + Math.max(0, Math.min(24*60 - duur, m)) * 60000};
  gekozenKaart = null;
  teken();
  return true;
}

document.addEventListener("pointerdown", ev => {
  if (staat.tab !== "planning") return;
  const kaartEl = ev.target.closest("[data-kaart]");
  if (kaartEl && !ev.target.closest("button") && ev.pointerType !== "touch"){
    kaartSleep = {id: Number(kaartEl.dataset.kaart), x0: ev.clientX, y0: ev.clientY, spook: null};
    return;
  }
  const blok = ev.target.closest("#pl-blok");
  if (blok && plaatsing){
    plSleep = {modus: ev.target.closest(".rek") ? "rek" : "schuif", y0: ev.clientY, start0: plaatsing.start, duur0: plaatsing.minuten};
    blok.setPointerCapture(ev.pointerId); ev.preventDefault();
  }
});
document.addEventListener("pointermove", ev => {
  if (kaartSleep){
    if (!kaartSleep.spook && Math.hypot(ev.clientX - kaartSleep.x0, ev.clientY - kaartSleep.y0) > 6){
      const t = D.taken.find(x => x.id === kaartSleep.id);
      kaartSleep.spook = Object.assign(document.createElement("div"), {className: "spook", textContent: `${t.omschrijving} · ${duurTekst(t.minuten || 30)}`});
      document.body.append(kaartSleep.spook);
    }
    if (kaartSleep.spook){ kaartSleep.spook.style.left = ev.clientX + "px"; kaartSleep.spook.style.top = ev.clientY + "px"; }
    return;
  }
  if (!plSleep || !plaatsing) return;
  const stap = Math.round((ev.clientY - plSleep.y0) / PX / 15) * 15, d0 = dagBegin(staat.planDag);
  if (plSleep.modus === "schuif") plaatsing.start = d0 + Math.min(24*60 - plaatsing.minuten, Math.max(0, (plSleep.start0 - d0)/60000 + stap)) * 60000;
  else plaatsing.minuten = Math.max(15, Math.min(24*60 - (plaatsing.start - d0)/60000, plSleep.duur0 + stap));
  const blok = document.getElementById("pl-blok"), van = Number(document.getElementById("pl-binnen").dataset.van);
  blok.style.top = ((plaatsing.start - d0)/60000 - van) * PX + "px";
  blok.style.height = plaatsing.minuten * PX - 2 + "px";
  blok.classList.toggle("botst", plBotsingen().length > 0);
  document.getElementById("pl-tijd").textContent = blokTijdVan(plaatsing.start, plaatsing.minuten);
});
document.addEventListener("pointerup", ev => {
  if (kaartSleep){
    const k = kaartSleep; kaartSleep = null;
    if (k.spook){ k.spook.remove(); if (!plaats(k.id, ev.clientY)) toast("Laat de taak los boven een tijd in de dag", true); }
    else { gekozenKaart = gekozenKaart === k.id ? null : k.id; teken(); }   // klik zonder slepen: kiezen
    return;
  }
  if (plSleep){ plSleep = null; return teken(); }
  if (staat.tab === "planning" && gekozenKaart && ev.target.closest("#pl-tijdlijn") && !ev.target.closest("#pl-blok")) plaats(gekozenKaart, ev.clientY);
  else if (staat.tab === "planning" && ev.pointerType === "touch" && ev.target.closest("[data-kaart]") && !ev.target.closest("button")){
    const id = Number(ev.target.closest("[data-kaart]").dataset.kaart); gekozenKaart = gekozenKaart === id ? null : id; teken();
  }
});
document.addEventListener("click", async ev => {
  const t = ev.target.closest("button");
  if (!t || staat.tab !== "planning") return;
  if (t.dataset.pldag !== undefined){
    const stap = Number(t.dataset.pldag);
    staat.planDag = stap === 0 ? vandaagWerkdag() : isoDag(new Date(dagBegin(staat.planDag) + stap * 86400000 + 3600000));
    if (plaatsing){ const sm = plaatsing.start - dagBegin(isoDag(new Date(plaatsing.start))); plaatsing.start = dagBegin(staat.planDag) + sm; }
    return teken();
  }
  if (t.id === "pl-annuleer"){ plaatsing = null; return teken(); }
  if (t.id === "afsluit-start"){ afsluit = "laden"; teken(); const j = await stil("afsluiten", {}); afsluit = j.ok ? j : null; if (!j.ok) toast(j.melding, true); return teken(); }
  if (t.id === "afsluit-dicht"){ afsluit = null; return teken(); }
  if (t.dataset.later !== undefined){
    const id = Number(t.dataset.later), naarLater = t.dataset.waarde === "1";
    const taakRij = D.taken.find(x => x.id === id); if (taakRij) taakRij.later = naarLater ? 1 : 0; teken();
    const j = await stil("taak-later", {id, later: naarLater}); if (!j.ok) toast(j.melding, true); return laad();
  }
  const planIn = async (id, start) => {
    const taakRij = D.taken.find(x => x.id === id); if (!taakRij) return;
    taakRij.gepland = start; teken();
    const j = await stil("taak-plannen", {id, start, minuten: taakRij.minuten || 30});
    if (!j.ok) toast(j.melding, true);
    delete dagen[start.slice(0, 10)];
  };
  if (t.dataset.afplan){ await planIn(Number(t.dataset.afplan), t.dataset.start); toast("Ingepland"); return laad(); }
  if (t.id === "afsluit-alles" && afsluit && afsluit.voorstellen){
    const vs = afsluit.voorstellen; afsluit = null;
    for (const [id, start] of Object.entries(vs)) await planIn(Number(id), start);
    toast(`${Object.keys(vs).length} taak/taken ingepland`); return laad();
  }
  if (t.id === "pl-bevestig" && plaatsing){
    const p = plaatsing, dag = isoDag(new Date(p.start));
    plaatsing = null;
    const taakRij = D.taken.find(x => x.id === p.id); if (taakRij){ taakRij.gepland = lokaalIso(p.start); taakRij.minuten = p.minuten; }
    teken();
    const j = await stil("taak-plannen", {id: p.id, start: lokaalIso(p.start), minuten: p.minuten});
    toast(j.melding, !j.ok);
    delete dagen[dag];
    laad();
  }
});

// ---------------- Opbergen in een map ----------------
let kiezer = null;   // {id, mappen, voorstellen, zoek, index, el}
async function openKiezer(id, anker){
  sluitKiezer();
  const el = document.createElement("div");
  el.className = "kiezer";
  el.innerHTML = `<input type="text" id="kiezer-zoek" placeholder="Zoek een map…" autocomplete="off"><div class="opties"><div class="leeg2">Mappen laden…</div></div>`;
  document.body.append(el);
  const r = anker ? anker.getBoundingClientRect() : {left: innerWidth/2 - 190, top: innerHeight/3, bottom: innerHeight/3};
  const boven = r.top > innerHeight * 0.55;
  el.style.left = Math.max(16, Math.min(innerWidth - el.offsetWidth - 16, r.left - 40)) + "px";
  if (boven) el.style.bottom = (innerHeight - r.top + 8) + "px"; else el.style.top = (r.bottom + 8) + "px";
  kiezer = {id, mappen: [], voorstellen: [], zoek: "", index: 0, el};
  el.querySelector("input").focus();
  const j = await stil("mappen", {id});
  if (!kiezer || kiezer.id !== id) return;
  if (!j.ok){ sluitKiezer(); return toast(j.melding, true); }
  kiezer.mappen = j.mappen; kiezer.voorstellen = j.voorstellen;
  tekenKiezer();
}
function kiezerOpties(){
  const z = kiezer.zoek.trim().toLowerCase();
  const voorstel = z ? [] : kiezer.voorstellen;
  const rest = kiezer.mappen.filter(m => !z || m.toLowerCase().includes(z)).filter(m => !voorstel.some(v => v.map === m));
  return [...voorstel.map(v => ({map: v.map, waarom: v.reden, voorstel: true})), ...rest.map(m => ({map: m}))];
}
function tekenKiezer(){
  const opties = kiezerOpties();
  kiezer.index = Math.min(kiezer.index, Math.max(0, opties.length - 1));
  const regel = (o, i) => { const delen = o.map.split("/"), naam = delen.pop();
    return `<button class="optie${i === kiezer.index ? " actief" : ""}" data-map="${esc(o.map)}">${ik("folder")}<span>${esc(naam)}${delen.length ? ` <span class="pad">${esc(delen.join(" / "))}</span>` : ""}</span>${o.waarom ? `<span class="waarom">${esc(o.waarom)}</span>` : ""}</button>`; };
  const nVoorstel = opties.filter(o => o.voorstel).length;
  kiezer.el.querySelector(".opties").innerHTML = !opties.length ? `<div class="leeg2">Geen map gevonden</div>` :
    (nVoorstel ? `<div class="kop2">Voorstel</div>` + opties.slice(0, nVoorstel).map(regel).join("") + `<div class="kop2">Alle mappen</div>` : "")
    + opties.slice(nVoorstel).map((o, i) => regel(o, i + nVoorstel)).join("");
  if (!kiezer.el.querySelector(".voet")) kiezer.el.insertAdjacentHTML("beforeend", `<div class="voet"><span><kbd>↑</kbd><kbd>↓</kbd> <kbd>↵</kbd> <kbd>Esc</kbd></span><button class="knop klein" id="kiezer-vernieuw" title="Mappen opnieuw ophalen uit Mail">Vernieuwen</button></div>`);
  kiezer.el.querySelector(".optie.actief")?.scrollIntoView({block:"nearest"});
}
function sluitKiezer(){ if (kiezer){ kiezer.el.remove(); kiezer = null; } }
function kiesMap(map){
  const id = kiezer.id; sluitKiezer();
  verplaats([id], "map:" + map);
}
document.addEventListener("input", ev => { if (kiezer && ev.target.id === "kiezer-zoek"){ kiezer.zoek = ev.target.value; kiezer.index = 0; tekenKiezer(); } });
document.addEventListener("keydown", ev => {
  if (!kiezer) return;
  const opties = kiezerOpties();
  if (ev.key === "ArrowDown"){ ev.preventDefault(); ev.stopImmediatePropagation(); kiezer.index = Math.min(opties.length - 1, kiezer.index + 1); return tekenKiezer(); }
  if (ev.key === "ArrowUp"){ ev.preventDefault(); ev.stopImmediatePropagation(); kiezer.index = Math.max(0, kiezer.index - 1); return tekenKiezer(); }
  if (ev.key === "Enter"){ ev.preventDefault(); ev.stopImmediatePropagation(); if (opties[kiezer.index]) kiesMap(opties[kiezer.index].map); return; }
  if (ev.key === "Escape"){ ev.preventDefault(); ev.stopImmediatePropagation(); return sluitKiezer(); }
  if (ev.target.id === "kiezer-zoek") ev.stopImmediatePropagation();   // typen in het zoekveld triggert geen sneltoetsen
}, true);
document.addEventListener("mousedown", ev => {
  if (!kiezer) return;
  const o = ev.target.closest(".kiezer .optie");
  if (o){ ev.preventDefault(); return kiesMap(o.dataset.map); }
  if (ev.target.closest("#kiezer-vernieuw")){ ev.preventDefault(); const id = kiezer.id; kiezer.el.querySelector(".opties").innerHTML = `<div class="leeg2">Mappen laden…</div>`;
    stil("mappen", {id, vernieuw: true}).then(j => { if (kiezer && j.ok){ kiezer.mappen = j.mappen; kiezer.voorstellen = j.voorstellen; tekenKiezer(); } }); return; }
  if (!ev.target.closest(".kiezer")) sluitKiezer();
}, true);
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-weergave]");
  if (!b) return;
  weergave = b.dataset.weergave;
  try { localStorage.setItem("mailagent-weergave", weergave); } catch(e){}
  const blok = b.closest(".mailweergave");
  if (blok) ververs(Number(blok.id.slice(3)));
});
document.addEventListener("toggle", ev => {
  const d = ev.target;
  if (!(d instanceof HTMLDetailsElement) || !d.dataset.orig || !d.open || d.querySelector(".mailweergave")) return;
  const id = Number(d.dataset.orig), it = [...D.zelf, ...D.wacht].find(i => i.id === id);
  d.insertAdjacentHTML("beforeend", mailWeergave(id, it ? it.tekst : ""));
}, true);
// ---------------- kolombreedtes en inklappen (onthouden per browser) ----------------
const STANDAARD = {zij: 220, lijst: 400};
let breedte = {...STANDAARD}, ingeklapt = false;
try { Object.assign(breedte, JSON.parse(localStorage.getItem("mailagent-breedte") || "{}")); ingeklapt = localStorage.getItem("mailagent-ingeklapt") === "1"; } catch(e){}
function zetBreedtes(){
  const app = document.getElementById("app");
  app.style.setProperty("--zij-b", ingeklapt ? "60px" : breedte.zij + "px");
  app.style.setProperty("--lijst-b", breedte.lijst + "px");
  app.classList.toggle("ingeklapt", ingeklapt);
  const k = document.getElementById("inklappen");
  if (k) k.title = ingeklapt ? "Zijbalk uitklappen ( [ )" : "Zijbalk inklappen ( [ )";
}
function bewaarBreedtes(){
  try { localStorage.setItem("mailagent-breedte", JSON.stringify(breedte)); localStorage.setItem("mailagent-ingeklapt", ingeklapt ? "1" : "0"); } catch(e){}
}
function wisselInklappen(){ ingeklapt = !ingeklapt; zetBreedtes(); bewaarBreedtes(); }
document.getElementById("inklappen").addEventListener("click", ev => { ev.stopPropagation(); wisselInklappen(); });
document.addEventListener("keydown", ev => {
  if (ev.key === "[" && !(ev.target.closest && ev.target.closest("input, textarea, select")) && !ev.metaKey && !ev.ctrlKey){ ev.preventDefault(); wisselInklappen(); }
});
let kolomSleep = null;
for (const [id, soort] of [["greep-zij", "zij"], ["greep-lijst", "lijst"]]){
  const g = document.getElementById(id);
  g.addEventListener("pointerdown", ev => {
    ev.preventDefault(); g.setPointerCapture(ev.pointerId); g.classList.add("actief"); document.body.classList.add("slepen");
    kolomSleep = {soort, x0: ev.clientX, b0: soort === "zij" ? breedte.zij : breedte.lijst, g};
  });
  g.addEventListener("dblclick", () => { breedte[soort] = STANDAARD[soort]; zetBreedtes(); bewaarBreedtes(); });
}
document.addEventListener("pointermove", ev => {
  if (!kolomSleep) return;
  const b = kolomSleep.b0 + ev.clientX - kolomSleep.x0;
  if (kolomSleep.soort === "zij") breedte.zij = Math.round(Math.max(170, Math.min(340, b)));
  else breedte.lijst = Math.round(Math.max(280, Math.min(Math.max(320, innerWidth - breedte.zij - 420), b)));
  zetBreedtes();
});
document.addEventListener("pointerup", () => {
  if (!kolomSleep) return;
  kolomSleep.g.classList.remove("actief"); document.body.classList.remove("slepen"); kolomSleep = null; bewaarBreedtes();
});
zetBreedtes();
document.querySelectorAll("[data-ikoon]").forEach(el => el.innerHTML = ik(el.dataset.ikoon));
laad();
setInterval(() => { if (!document.hidden && staat.open === null) laad(); }, 60000);
</script>
