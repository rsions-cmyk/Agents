<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail-inbox</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f4f4f2;--vlak:#ffffff;--vlak2:#fafaf8;--tekst:#1c1c1e;--zacht:#6e6e73;--lijn:#e5e5e2;
  --accent:#2f5d8a;--accent-zacht:#e8eff6;--ok:#2e7d32;--ok-zacht:#e7f3e8;--hoog:#c62828;--let:#b26a00;--let-zacht:#fff4e0;
  --onderwijs:#2f6fd0;--onderzoek:#7b4fd0;--istte:#0f8a7a;--overig:#7a7a80;--schaduw:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141416;--vlak:#1e1e21;--vlak2:#242428;--tekst:#ececf0;--zacht:#a1a1aa;--lijn:#2f2f35;
  --accent:#8ab4e8;--accent-zacht:#1f2a37;--ok:#7fc785;--ok-zacht:#1d2b1f;--hoog:#ff8a80;--let:#f0b45a;--let-zacht:#2e2617;
  --onderwijs:#79a6f0;--onderzoek:#b292f0;--istte:#4fc7b5;--overig:#9a9aa2;--schaduw:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tekst);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:var(--zij-b,220px) 1fr;min-height:100vh;position:relative}

/* zijbalk */
.zij{background:var(--vlak2);border-right:1px solid var(--lijn);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;font-weight:650;font-size:16px;padding:4px 10px 18px}
.logo .blok{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--vlak);display:grid;place-items:center}
.logo .blok svg{width:17px;height:17px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;width:100%;text-align:left;color:var(--tekst)}
.nav:hover{background:var(--lijn)}
.nav.actief{background:var(--accent-zacht);color:var(--accent);font-weight:600}
.stip{width:9px;height:9px;border-radius:50%;flex:none}
.nav .tel{margin-left:auto;font-size:12px;font-weight:600;min-width:22px;text-align:center;padding:1px 7px;border-radius:999px;background:var(--lijn);color:var(--tekst)}
.nav.actief .tel{background:var(--accent);color:var(--vlak)}
.zij .onder{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.knop-ophalen{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:10px;background:var(--vlak);border:1px solid var(--lijn);font-weight:550}
.knop-ophalen:hover{border-color:var(--accent);color:var(--accent)}
.knop-ophalen.bezig svg{animation:draai 1s linear infinite}
.status{font-size:12px;color:var(--zacht);text-align:center;min-height:16px}
@keyframes draai{to{transform:rotate(360deg)}}

/* hoofdgedeelte */
main{min-width:0;padding:24px 28px 120px}
.kop{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.kop h1{font-size:22px;margin:0;font-weight:680;letter-spacing:-.01em}
.tabs{display:flex;gap:4px;background:var(--vlak2);border:1px solid var(--lijn);padding:3px;border-radius:11px;margin-left:auto}
.tab{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:8px;color:var(--zacht);font-weight:550}
.tab.actief{background:var(--vlak);color:var(--tekst);box-shadow:var(--schaduw)}
.tab .tel{font-size:12px;color:var(--zacht)}

.lijst{background:var(--vlak);border:1px solid var(--lijn);border-radius:14px;overflow:hidden;box-shadow:var(--schaduw)}
.groep{margin-bottom:22px}
.groep-kop{display:flex;align-items:center;gap:10px;margin:0 4px 8px}
.groep-kop h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--zacht);margin:0;font-weight:650}
.groep-kop .acties{margin-left:auto;display:flex;gap:6px}

.rij{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--lijn);cursor:pointer;position:relative}
.rij:last-child{border-bottom:0}
.rij:hover{background:var(--vlak2)}
.rij.gekozen{background:var(--accent-zacht)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:650;font-size:13px;color:#fff;flex:none}
.avatar.klein{width:30px;height:30px;font-size:12px}
.rij .midden{min-width:0;flex:1}
.regel1{display:flex;gap:8px;align-items:baseline}
.van{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datum{margin-left:auto;color:var(--zacht);font-size:12px;white-space:nowrap}
.onderwerp{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.samenvatting{color:var(--zacht);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--vlak2);border:1px solid var(--lijn);color:var(--zacht)}
.chip svg{width:13px;height:13px}
.chip.hoog{color:var(--hoog);border-color:color-mix(in srgb,var(--hoog) 35%,transparent)}
.chip.let{color:var(--let);background:var(--let-zacht);border-color:transparent}
.chip.project{color:#fff;border-color:transparent}

.ikoon{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--zacht)}
.ikoon:hover{background:var(--lijn);color:var(--tekst)}
.ikoon.rood:hover{color:var(--hoog)}
.rij .snel{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.rij:hover .snel,.rij:focus-within .snel{opacity:1}
@media (hover:none){.rij .snel{opacity:1}}
.vink{width:18px;height:18px;accent-color:var(--accent);flex:none;cursor:pointer}

.knop{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;font-weight:600;border:1px solid var(--lijn);background:var(--vlak)}
.knop:hover{border-color:var(--zacht)}
.knop.primair{background:var(--accent);border-color:var(--accent);color:var(--vlak)}
.knop.primair:hover{filter:brightness(1.08)}
.knop.goed{background:var(--ok);border-color:var(--ok);color:var(--vlak)}
.knop.klein{padding:5px 10px;font-size:13px;font-weight:550}
.knop:disabled{opacity:.5;cursor:default}

.leeg{text-align:center;padding:56px 20px;color:var(--zacht)}
.leeg .rond{width:56px;height:56px;border-radius:50%;background:var(--ok-zacht);color:var(--ok);display:grid;place-items:center;margin:0 auto 12px}
.leeg .rond svg{width:26px;height:26px}
.leeg b{display:block;color:var(--tekst);font-size:15px;margin-bottom:2px}

/* taken */
.taak{cursor:default}
.taak .rondje{width:22px;height:22px;border-radius:50%;border:2px solid var(--lijn);display:grid;place-items:center;flex:none;color:transparent}
.taak .rondje:hover{border-color:var(--ok);color:var(--ok)}
.taak .rondje svg{width:13px;height:13px;stroke-width:3}
.taak.weg{opacity:0;transform:translateX(12px);transition:all .25s}

/* detailpaneel */
.dek{position:fixed;inset:0;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
.dek.open{opacity:1;pointer-events:auto}
.paneel{position:fixed;top:0;right:0;height:100vh;width:min(620px,100vw);background:var(--vlak);border-left:1px solid var(--lijn);box-shadow:-8px 0 32px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;z-index:10}
.paneel.open{transform:none}
.p-kop{padding:18px 20px 14px;border-bottom:1px solid var(--lijn);display:flex;gap:12px;align-items:flex-start}
.p-kop h2{font-size:17px;margin:0 0 2px;line-height:1.3}
.p-kop .van{font-weight:500;color:var(--zacht);font-size:13px}
.p-kop .ikoon{margin-left:auto}
.p-inhoud{padding:16px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.melding{display:flex;gap:10px;padding:12px 14px;border-radius:11px;background:var(--let-zacht);color:var(--tekst)}
.melding svg{color:var(--let);margin-top:1px}
.melding.info{background:var(--accent-zacht)}.melding.info svg{color:var(--accent)}
.melding.fout{background:color-mix(in srgb,var(--hoog) 12%,transparent)}.melding.fout svg{color:var(--hoog)}
.label{font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--zacht);margin-bottom:6px;display:flex;align-items:center;gap:6px}
textarea{width:100%;min-height:220px;resize:vertical;font:14px/1.55 inherit;font-family:inherit;padding:12px 14px;border:1px solid var(--lijn);border-radius:11px;background:var(--vlak2);color:var(--tekst)}
textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.takenlijst{display:flex;flex-direction:column;gap:6px}
.takenlijst div{display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:9px;background:var(--vlak2)}
.takenlijst svg{color:var(--ok);width:16px;height:16px}
details.origineel summary{cursor:pointer;color:var(--zacht);font-size:13px;list-style:none;display:flex;align-items:center;gap:6px}
details.origineel pre{white-space:pre-wrap;font:13px/1.5 -apple-system,sans-serif;background:var(--vlak2);padding:12px 14px;border-radius:11px;max-height:340px;overflow:auto;margin:8px 0 0}
.p-voet{padding:14px 20px;border-top:1px solid var(--lijn);display:flex;gap:10px;align-items:center}
.p-voet .uitleg{font-size:12px;color:var(--zacht);margin-right:auto}

/* selectiebalk en meldingen */
.balk{position:fixed;left:50%;bottom:20px;transform:translate(-50%,calc(100% + 40px));visibility:hidden;background:var(--tekst);color:var(--bg);padding:8px 8px 8px 16px;border-radius:14px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 30px rgba(0,0,0,.25);transition:transform .2s;z-index:5}
.balk.open{transform:translate(-50%,0);visibility:visible}
.balk .knop{background:transparent;border-color:color-mix(in srgb,var(--bg) 30%,transparent);color:var(--bg)}
.balk .knop:hover{background:color-mix(in srgb,var(--bg) 12%,transparent)}
.toasts{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:20;max-width:min(420px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--vlak);border:1px solid var(--lijn);border-left:4px solid var(--ok);padding:10px 14px;border-radius:10px;box-shadow:var(--schaduw);animation:in .2s}
.toast.fout{border-left-color:var(--hoog)}
.toast svg{color:var(--ok)}.toast.fout svg{color:var(--hoog)}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}
.regels{margin-top:8px}
.veld{display:flex;flex-direction:column;gap:6px}
.veld input[type=text],.veld input[type=date],.veld input[type=datetime-local],.veld textarea{font:inherit;padding:10px 12px;border:1px solid var(--lijn);border-radius:10px;background:var(--vlak2);color:var(--tekst);min-height:0}
.veld textarea{min-height:110px}
.keuzes{display:flex;flex-wrap:wrap;gap:6px}
.keuze{padding:6px 12px;border-radius:999px;border:1px solid var(--lijn);background:var(--vlak);font-weight:550;font-size:13px}
.keuze.aan{background:var(--accent);border-color:var(--accent);color:var(--vlak)}
.moment{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--lijn);border-radius:11px;background:var(--vlak);text-align:left;width:100%}
.moment.aan{border-color:var(--accent);background:var(--accent-zacht)}
.moment b{font-weight:600}
.laden{display:flex;flex-direction:column;align-items:center;gap:12px;padding:60px 20px;color:var(--zacht);text-align:center}
.laden svg{width:28px;height:28px;color:var(--accent);animation:draai 1.2s linear infinite}
.vinkregel{display:flex;gap:8px;align-items:center;color:var(--zacht)}
.tijdvelden{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tijdvelden input{font:inherit;padding:8px 10px;border:1px solid var(--lijn);border-radius:10px;background:var(--vlak2);color:var(--tekst)}
.tijdvelden span{color:var(--zacht);font-size:13px}
.dagnav{display:flex;align-items:center;gap:6px;margin-top:4px}
.dagnav b{min-width:150px;text-align:center}
.dagnav .meta{margin-left:auto;font-size:12px;color:var(--zacht)}
.heledag{display:flex;flex-wrap:wrap;gap:4px}
.heledag span{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--vlak2);border:1px solid var(--lijn);color:var(--zacht)}
.tijdlijn{position:relative;border:1px solid var(--lijn);border-radius:12px;background:var(--vlak);max-height:440px;overflow-y:auto;user-select:none;-webkit-user-select:none}
.tl-binnen{position:relative;margin:10px 8px 10px 52px}
.uur{position:absolute;left:-52px;right:-8px;border-top:1px solid var(--lijn);height:0}
.uur span{position:absolute;left:8px;top:-8px;font-size:11px;color:var(--zacht);background:var(--vlak);padding:0 2px}
.uur.half{border-top-style:dashed;opacity:.5}
.buiten{position:absolute;left:-52px;right:-8px;background:var(--vlak2);opacity:.7}
.afs{position:absolute;background:var(--vlak2);border:1px solid var(--lijn);border-left:3px solid var(--zacht);border-radius:6px;padding:2px 6px;font-size:12px;line-height:1.3;overflow:hidden;color:var(--zacht)}
.afs.vrij{border-left-style:dashed;opacity:.7}
.tb{position:absolute;left:28%;right:0;background:var(--accent);color:var(--vlak);border-radius:8px;padding:3px 8px;font-size:12px;line-height:1.3;cursor:grab;box-shadow:0 2px 10px rgba(0,0,0,.18);touch-action:none;z-index:2;overflow:hidden}
.tb:active{cursor:grabbing}
.tb.botst{background:var(--hoog)}
.tb b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rek{position:absolute;left:0;right:0;bottom:0;height:12px;cursor:ns-resize;display:grid;place-items:center}
.rek::after{content:"";width:28px;height:3px;border-radius:2px;background:currentColor;opacity:.6}
.tl-laden{padding:30px;text-align:center;color:var(--zacht)}
.taakmail{display:flex;align-items:center;gap:8px;margin-top:8px;padding:6px 8px;border-radius:9px;background:var(--vlak2);border:1px solid var(--lijn);min-width:0}
.taakmail .tekst{min-width:0;flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.taakmail .tekst b{font-weight:600}
.taakmail .knop{padding:4px 9px;font-size:12px}
.toast .knop{margin-left:auto;padding:3px 10px;font-size:13px}
.afgerond .midden{color:var(--zacht);text-decoration:line-through}
.ikoon.voorkeur{color:var(--accent);background:var(--accent-zacht)}
.ikoon.voorkeur.rood{color:var(--hoog);background:color-mix(in srgb,var(--hoog) 12%,transparent)}
.gewoonte{font-size:12px;color:var(--zacht);white-space:nowrap}
.voorstel{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;margin-bottom:16px;border-radius:12px;background:var(--accent-zacht)}
.voorstel .namen{flex:1;min-width:200px}
.takenlijst .tk-rij{display:flex;gap:6px;align-items:center;padding:0;background:none}
.takenlijst .tk-erbij{padding:0;background:none}
.takenlijst .tk-rij svg{color:var(--zacht)}
.takenlijst .tk-rij .ikoon:hover svg{color:var(--hoog)}
.tk-rij input{font:inherit;padding:7px 10px;border:1px solid var(--lijn);border-radius:9px;background:var(--vlak2);color:var(--tekst);min-width:0}
.tk-rij input[type=text]{flex:1}
.tk-rij input[type=date]{width:150px}
.stappen-klein{margin:4px 0 0;padding-left:18px;color:var(--zacht);font-size:13px}
.regels summary{cursor:pointer;color:var(--zacht);font-size:13px;padding:4px}

/* mappenkiezer */
.kiezer{position:fixed;z-index:40;width:min(380px,calc(100vw - 32px));max-height:min(460px,70vh);display:flex;flex-direction:column;background:var(--vlak);border:1px solid var(--lijn);border-radius:14px;box-shadow:0 16px 48px rgba(0,0,0,.22);overflow:hidden}
.kiezer input{font:inherit;border:0;border-bottom:1px solid var(--lijn);padding:12px 14px;background:var(--vlak);color:var(--tekst);outline:none}
.kiezer .opties{overflow-y:auto;padding:6px}
.kiezer .kop2{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--zacht);padding:8px 8px 4px}
.kiezer .optie{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;color:var(--tekst)}
.kiezer .optie svg{color:var(--zacht);width:16px;height:16px}
.kiezer .optie .pad{color:var(--zacht);font-size:12px}
.kiezer .optie .waarom{margin-left:auto;font-size:11px;color:var(--zacht);white-space:nowrap}
.kiezer .optie.actief,.kiezer .optie:hover{background:var(--accent-zacht)}
.kiezer .leeg2{padding:16px;color:var(--zacht);text-align:center}
.kiezer .voet{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--lijn);font-size:12px;color:var(--zacht)}

/* zijbalk-koppen */
.nav-kop{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--zacht);padding:14px 10px 4px}
.kop-tel{color:var(--zacht);font-weight:550}
.leegpaneel{margin:auto;text-align:center;color:var(--zacht);padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:420px}
.leegpaneel p{margin:0;text-wrap:balance}
.leegpaneel .rond{width:56px;height:56px;border-radius:50%;background:var(--ok-zacht);color:var(--ok);display:grid;place-items:center}
.leegpaneel .rond svg{width:26px;height:26px}
.sneltoetsen{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--zacht);justify-content:center;max-width:360px}
kbd{font:600 11px var(--romp,inherit);font-family:inherit;padding:1px 6px;border-radius:5px;border:1px solid var(--lijn);border-bottom-width:2px;background:var(--vlak);color:var(--tekst)}
.knop kbd{margin-left:4px;font-size:10px;padding:0 4px;opacity:.75;background:transparent;color:inherit;border-color:currentColor}
.projectkies{font:inherit;font-size:12px;font-weight:600;padding:2px 22px 2px 9px;border-radius:999px;border:0;color:#fff;cursor:pointer;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-size:4px 4px;background-position:calc(100% - 11px) 55%,calc(100% - 7px) 55%;background-repeat:no-repeat}

/* drie kolommen op een breed scherm (voorstel A) */
@media (min-width:1100px){
  .app.drie{grid-template-columns:var(--zij-b,220px) var(--lijst-b,400px) minmax(0,1fr)}
  .app.drie main{height:100vh;overflow-y:auto;position:sticky;top:0;padding:20px 14px 120px;border-right:1px solid var(--lijn)}
  .app.drie .paneel{position:sticky;top:0;transform:none;transition:none;width:auto;height:100vh;box-shadow:none;border-left:0;z-index:auto}
  .app.drie ~ .dek{display:none}
  .app.drie .rij{padding:10px 12px}
  .app.drie .rij .snel{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:var(--vlak2);border-radius:10px;padding:2px;box-shadow:-14px 0 14px var(--vlak2);opacity:0!important;pointer-events:none}
  .app.drie .rij:hover .snel,.app.drie .rij:focus-within .snel{opacity:1!important;pointer-events:auto}
  .app.drie .gewoonte{display:none}
  .app.drie .sluit-mail{display:none}
}

/* planning (voorstel B) */
.planning-grid{display:grid;grid-template-columns:minmax(300px,430px) minmax(0,1fr);gap:18px;align-items:start}
.kaarten{display:flex;flex-direction:column;gap:8px}
.kaart{background:var(--vlak);border:1px solid var(--lijn);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;cursor:grab;user-select:none;-webkit-user-select:none}
.kaart:hover{border-color:var(--zacht)}
.kaart.gekozen{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-zacht)}
.kaart .r{display:flex;gap:8px;align-items:center}
.kaart .titel{font-weight:600;flex:1;min-width:0}
.kaart .rondje{width:20px;height:20px;border-radius:50%;border:2px solid var(--lijn);display:grid;place-items:center;flex:none;color:transparent}
.kaart .rondje:hover{border-color:var(--ok);color:var(--ok)}
.kaart .rondje svg{width:12px;height:12px;stroke-width:3}
.kaart.ingepland{cursor:default;background:var(--vlak2)}
.spook{position:fixed;z-index:30;pointer-events:none;background:var(--accent);color:var(--vlak);padding:6px 10px;border-radius:9px;font-weight:600;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:translate(-50%,-120%);white-space:nowrap}
.dagkop{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.dagkop b{min-width:170px;text-align:center;font-size:15px}
.plaatsbalk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;margin-bottom:8px;border-radius:10px;background:var(--accent-zacht)}
.plaatsbalk span{flex:1;min-width:0}
#pl-tijdlijn{max-height:calc(100vh - 190px)}
.tb.concept{background:transparent;color:var(--accent);border:2px dashed var(--accent);box-shadow:none}
.tb.concept.botst{color:var(--hoog);border-color:var(--hoog)}

/* telefoon en smal scherm */
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .zij{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px 16px;gap:6px;border-right:0;border-bottom:1px solid var(--lijn)}
  .logo{padding:4px 8px 4px 0;width:100%}
  .nav{width:auto;padding:6px 10px}
  .zij .onder{margin:0;width:100%;flex-direction:row;align-items:center}
  .knop-ophalen{flex:1}
  main{padding:16px 16px 120px}
  .tabs{margin-left:0;width:100%}.tab{flex:1;justify-content:center;padding:6px 4px;font-size:13px;gap:5px;min-width:0}
  .balk{width:calc(100vw - 32px);flex-wrap:wrap;justify-content:center}
  .rij{padding:12px}
  .gewoonte{display:none}
  .planning-grid{grid-template-columns:1fr}
  .nav-kop{display:none}
}

/* ================= ontwerplaag =================
   Rustig werkblad: koele neutralen met een vleug blauw, één inktblauwe accentkleur voor wat je kunt doen,
   groen alleen voor goedkeuren, amber alleen voor wat jouw beslissing vraagt. Kleur draagt betekenis, nooit decoratie. */
:root{
  --bg:#eff1ef; --vlak:#ffffff; --vlak2:#f6f7f5; --vlak3:#e9ece8; --tekst:#151b21; --zacht:#5d6670; --lijn:#e1e4df;
  --accent:#24548a; --accent-zacht:#e7eef7; --accent-sterk:#1a4170;
  --ok:#21754a; --ok-zacht:#e3f1e8; --hoog:#b3261e; --let:#995a00; --let-zacht:#fcefd8;
  --onderwijs:#2563c9; --onderzoek:#a3459c; --istte:#0f8a72; --overig:#6b7280;
  --schaduw:0 1px 2px rgba(16,24,32,.05),0 2px 8px rgba(16,24,32,.04);
  --schaduw-hoog:0 12px 40px rgba(16,24,32,.18);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --r1:8px; --r2:12px;
  --snel:140ms; --gewoon:200ms;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111417; --vlak:#181c20; --vlak2:#1e2328; --vlak3:#262c32; --tekst:#e8ebee; --zacht:#9aa3ad; --lijn:#2a3037;
  --accent:#8db6ea; --accent-zacht:#1c2a3b; --accent-sterk:#b4cff2;
  --ok:#6fc28e; --ok-zacht:#18291f; --hoog:#ff8a80; --let:#f2b35c; --let-zacht:#2c2415;
  --onderwijs:#7aa7f0; --onderzoek:#dd8fd5; --istte:#4cc7ae; --overig:#9aa1ab;
  --schaduw:0 1px 2px rgba(0,0,0,.35); --schaduw-hoog:0 12px 40px rgba(0,0,0,.5); color-scheme:dark;
}}
body{font-family:var(--font);font-size:14px;font-feature-settings:"cv11","ss01";letter-spacing:-.003em}
h1,h2,.kop h1{letter-spacing:-.018em}
.kop h1{font-size:20px;font-weight:650}
.datum,.tel,.kop-tel,.chip,.voortgang-tekst{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
button:active{transform:scale(.98)}

/* zijbalk */
.zij{background:var(--vlak3);border-right:1px solid var(--lijn);gap:2px}
.logo .blok{background:var(--tekst);color:var(--bg);border-radius:8px}
.nav{padding:7px 10px;border-radius:var(--r1);font-weight:500;color:var(--tekst);transition:background var(--snel)}
.nav:hover{background:color-mix(in srgb,var(--vlak) 70%,transparent)}
.nav.actief{background:var(--vlak);color:var(--tekst);font-weight:600;box-shadow:var(--schaduw)}
.nav .tel{background:transparent;color:var(--zacht);font-weight:600;padding:0 4px}
.nav.actief .tel{background:var(--accent);color:var(--vlak);padding:0 7px}
.nav svg{color:var(--zacht)} .nav.actief svg{color:var(--accent)}
.knop-ophalen{border-radius:var(--r1);background:var(--vlak);font-weight:600;box-shadow:var(--schaduw)}
.status{line-height:1.35}

/* lijst */
.lijst{border-radius:var(--r2);box-shadow:var(--schaduw);border-color:var(--lijn)}
.rij{gap:12px;transition:background var(--snel)}
.rij .van{font-weight:600}
.rij .onderwerp{color:var(--tekst)}
.rij .samenvatting{color:var(--zacht)}
.rij.gekozen{background:var(--accent-zacht);box-shadow:inset 3px 0 0 var(--accent)}
.rij.weg{animation:wegschuiven var(--gewoon) ease forwards;pointer-events:none}
@keyframes wegschuiven{to{opacity:0;transform:translateX(24px)}}
.prio{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--hoog);margin-left:6px;vertical-align:1px}
.chip{border-radius:6px;font-weight:500}
.chip.let{font-weight:600}
@media (min-width:1100px){
  .app.drie main{background:var(--vlak2)}
  .app.drie .lijst{box-shadow:none;border:0;border-radius:0;background:transparent}
  .app.drie .lijst .rij{border-radius:var(--r1);border-bottom:0;margin-bottom:2px}
  .app.drie .lijst .rij:hover{background:var(--vlak)}
  .app.drie .lijst .rij.gekozen{background:var(--vlak);box-shadow:inset 3px 0 0 var(--accent),var(--schaduw)}
}

/* avatar met projectletter (kleur is niet de enige drager van betekenis) */
.avatar{position:relative;font-weight:600;letter-spacing:.01em}
.avatar .pl{position:absolute;right:-3px;bottom:-3px;min-width:15px;height:15px;padding:0 3px;border-radius:5px;background:var(--vlak);color:var(--tekst);
  font-size:9px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 1.5px var(--vlak),0 1px 2px rgba(0,0,0,.2)}

/* voortgang (eerst wat gedaan is, later wat rest) */
.voortgang{display:flex;flex-direction:column;gap:6px;margin:-6px 0 14px}
.voortgang-tekst{font-size:12px;color:var(--zacht);display:flex;justify-content:space-between}
.voortgang-tekst b{color:var(--tekst);font-weight:600}
.voortgang-balk{height:4px;border-radius:99px;background:var(--lijn);overflow:hidden}
.voortgang-balk i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}
.voortgang.klaar .voortgang-balk i{background:var(--ok)}

/* detailpaneel */
.paneel{background:var(--vlak)}
.p-kop{padding:18px 22px 14px}
.p-kop h2{font-size:17px;font-weight:650;letter-spacing:-.012em}
.p-inhoud{padding:18px 22px;gap:16px;animation:inkomen var(--gewoon) ease}
@keyframes inkomen{from{opacity:.4;transform:translateY(4px)}}
.melding{border-radius:var(--r1);font-size:13.5px}
.label{font-size:11px;letter-spacing:.07em}
/* schrijfvak altijd licht en groter: proeflezen gaat beter met donkere tekst op een licht vlak */
textarea#concept,#a-tekst{background:#fdfdfc;color:#151b21;border-color:#dde1dc;font-size:15px;line-height:1.6;padding:14px 16px;min-height:240px;color-scheme:light}
textarea#concept::placeholder,#a-tekst::placeholder{color:#8a929b}
.p-voet{padding:12px 22px;background:var(--vlak2)}
.knop{border-radius:var(--r1);font-weight:600;transition:background var(--snel),border-color var(--snel)}
.knop.goed{background:var(--ok);border-color:var(--ok)}
.knop.goed:hover{filter:brightness(1.06)}
.knop kbd{border:0;background:color-mix(in srgb,currentColor 14%,transparent);opacity:1;padding:1px 5px;border-radius:4px}
.projectkies{border-radius:6px}

/* toasts: onderin, dicht bij waar je klikte, met ongedaan maken */
.toasts{top:auto;bottom:22px;right:auto;left:50%;transform:translateX(-50%);align-items:center}
.toast{background:var(--tekst);color:var(--bg);border:0;border-left:0;border-radius:10px;padding:10px 12px 10px 14px;box-shadow:var(--schaduw-hoog);align-items:center;animation:omhoog var(--gewoon) ease}
.toast svg{color:var(--ok)} .toast.fout{background:var(--hoog);color:#fff} .toast.fout svg{color:#fff}
.toast .knop{background:transparent;color:inherit;border:1px solid color-mix(in srgb,currentColor 35%,transparent);margin-left:6px;padding:3px 10px}
.toast .knop:hover{background:color-mix(in srgb,currentColor 12%,transparent)}
.toast .knoppen{display:flex;gap:4px;margin-left:auto}
@keyframes omhoog{from{opacity:0;transform:translateY(8px)}}

/* focusblokken in de tijdlijn: beschermd */
.afs.focus{background:repeating-linear-gradient(135deg,var(--accent-zacht) 0 6px,var(--vlak) 6px 12px);border-color:var(--accent);border-left-color:var(--accent);color:var(--accent);font-weight:600}

/* dag afsluiten */
.afsluiten{display:flex;flex-direction:column;gap:6px;padding:12px;margin-bottom:12px;border-radius:var(--r2);background:var(--vlak);border:1px solid var(--lijn);box-shadow:var(--schaduw)}
.afsluiten .r{display:flex;align-items:center;gap:8px;padding:6px 4px;border-top:1px solid var(--lijn)}
.afsluiten .r:first-of-type{border-top:0}
.afsluiten .r .titel{flex:1;min-width:0;font-weight:500}
.afsluiten{max-width:760px}

/* lezen in Opruimen: licht vlak, zoals het schrijfvak */
.leesvlak{white-space:pre-wrap;background:#fdfdfc;color:#151b21;border:1px solid #dde1dc;border-radius:var(--r1);padding:16px 18px;font-size:15px;line-height:1.6;max-width:72ch;color-scheme:light}
.rij.leest{background:var(--accent-zacht);box-shadow:inset 3px 0 0 var(--accent)}
@media (min-width:1100px){ .app.drie .lijst .rij.leest{background:var(--vlak);box-shadow:inset 3px 0 0 var(--accent),var(--schaduw)}
  .app.drie .rij.leest .snel{display:none} }

/* opgemaakte mail */
.mailweergave{display:flex;flex-direction:column;gap:8px}
.weergavekeuze{display:flex;align-items:center;gap:8px}
.segment{display:inline-flex;background:var(--vlak3);border-radius:8px;padding:2px}
.segment button{padding:4px 10px;border-radius:6px;font-size:12.5px;font-weight:550;color:var(--zacht)}
.segment button.aan{background:var(--vlak);color:var(--tekst);box-shadow:var(--schaduw)}
.mailframe{width:100%;height:min(62vh,720px);border:1px solid #dde1dc;border-radius:var(--r1);background:#fdfdfc;color-scheme:light}
.weergavekeuze .meta{font-size:12px}

/* verstelbare kolommen en inklapbare zijbalk */
.logo{position:relative}
.logo .inklap{margin-left:auto;width:28px;height:28px}
.greep{position:absolute;top:0;bottom:0;width:9px;margin-left:-4px;cursor:col-resize;z-index:6;touch-action:none}
.greep::after{content:"";position:absolute;left:4px;top:0;bottom:0;width:1px;background:transparent;transition:background var(--snel)}
.greep:hover::after,.greep.actief::after{background:var(--accent);width:2px;left:3.5px}
#greep-zij{left:var(--zij-b,220px)}
#greep-lijst{left:calc(var(--zij-b,220px) + var(--lijst-b,400px));display:none}
@media (min-width:1100px){ .app.drie #greep-lijst{display:block} }
body.slepen{cursor:col-resize;user-select:none;-webkit-user-select:none}
body.slepen iframe{pointer-events:none}
.app.ingeklapt{--zij-b:60px}
.app.ingeklapt #greep-zij{display:none}
.app.ingeklapt .zij{padding:16px 8px;align-items:center}
.app.ingeklapt .navtekst,.app.ingeklapt .nav-kop,.app.ingeklapt .status{display:none}
.app.ingeklapt .logo{flex-direction:column;gap:10px;padding:4px 0 14px}
.app.ingeklapt .logo .inklap{margin:0}
.app.ingeklapt .nav{justify-content:center;width:44px;height:38px;padding:0;position:relative}
.app.ingeklapt .nav .tel{position:absolute;top:2px;right:0;font-size:10px;min-width:16px;padding:0 4px;line-height:16px}
.app.ingeklapt .knop-ophalen{width:44px;padding:10px 0}
.app.ingeklapt .zij .onder{align-items:center}
@media (max-width:760px){ .greep,.logo .inklap{display:none} }

/* taken: alles lezen, niets afkappen */
.kaart .r{align-items:flex-start}
.kaart .titel,.taak .midden > div:first-child{white-space:normal;overflow-wrap:anywhere;line-height:1.4}
.kaart .stip{margin-top:6px}
.kaart .rondje{margin-top:1px}
.kaart .stappen-klein{margin:0 0 0 48px;padding-left:16px}
.taakmail{align-items:flex-start;flex-wrap:wrap;row-gap:6px}
.taakmail .tekst{flex:1 1 calc(100% - 40px)}
.taakmail .knop:first-of-type{margin-left:38px}
.taakmail .tekst{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;line-height:1.4}
.taakmail .avatar{margin-top:2px}
.kaart{user-select:text;-webkit-user-select:text}
.kaart[data-kaart]{cursor:grab}
.afsluiten .r .titel{overflow-wrap:anywhere}

/* sneltoetsen-overzicht */
.overlay{position:fixed;inset:0;background:rgba(10,14,18,.35);display:grid;place-items:center;z-index:50;animation:inkomen var(--snel) ease}
.overlay .vel{background:var(--vlak);border-radius:16px;box-shadow:var(--schaduw-hoog);padding:22px 24px;width:min(520px,calc(100vw - 32px))}
.overlay h3{margin:0 0 12px;font-size:16px}
.overlay dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.overlay dt{text-align:right}
.overlay dd{margin:0;color:var(--zacht)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="zij">
    <div class="logo"><span class="blok" data-ikoon="inbox"></span><span class="navtekst">Mail-inbox</span>
      <button class="ikoon inklap" id="inklappen" title="Zijbalk inklappen ( [ )" aria-label="Zijbalk in- of uitklappen"><span data-ikoon="paneel"></span></button></div>
    <div id="nav" style="display:contents"></div>
    <div class="onder">
      <button class="knop-ophalen" id="ophalen" title="Mail ophalen"><span data-ikoon="refresh"></span><span class="navtekst">Mail ophalen</span></button>
      <div class="status" id="status"></div>
    </div>
  </aside>
  <main>
    <div class="kop">
      <h1 id="titel">Te doen</h1>
      <span class="kop-tel" id="koptel"></span>
    </div>
    <div id="inhoud"></div>
  </main>
  <aside class="paneel" id="paneel" aria-hidden="true"></aside>
  <div class="greep" id="greep-zij" title="Sleep om de breedte aan te passen; dubbelklik om te herstellen" role="separator" aria-orientation="vertical"></div>
  <div class="greep" id="greep-lijst" title="Sleep om de breedte aan te passen; dubbelklik om te herstellen" role="separator" aria-orientation="vertical"></div>
</div>

<div class="dek" id="dek"></div>
<div class="balk" id="balk"></div>
<div class="toasts" id="toasts"></div>

<script>
const TOKEN = "__TOKEN__";
const IKONEN = {
  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  check:'<path d="M20 6 9 17l-5-5"/>', x:'<path d="M18 6 6 18M6 6l12 12"/>',
  archive:'<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 12h4"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>',
  ban:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
  sparkle:'<path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"/>',
  alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
  reply:'<path d="M9 17l-5-5 5-5"/><path d="M4 12h11a5 5 0 0 1 5 5v2"/>',
  task:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  forward:'<path d="M15 17l5-5-5-5"/><path d="M20 12H9a5 5 0 0 0-5 5v2"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  chevron:'<path d="M9 18l6-6-6-6"/>',
  paneel:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>', mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
};
const ik = n => `<svg viewBox="0 0 24 24" aria-hidden="true">${IKONEN[n]||""}</svg>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ACTIES = {antwoorden:["reply","Antwoorden"], taak:["task","Taak"], agenda:["calendar","Agenda"],
                delegeren:["forward","Delegeren"], ter_info:["eye","Ter info"], negeren:["ban","Overgeslagen"]};
const KLEUREN = {onderwijs:"var(--onderwijs)", onderzoek:"var(--onderzoek)", istte:"var(--istte)", overig:"var(--overig)"};
const kleur = p => KLEUREN[p] || `hsl(${[...p].reduce((a,c)=>a+c.charCodeAt(0),0)%360} 45% 50%)`;
const naamProject = p => p === "alles" ? "Alles" : p === "istte" ? "ISTTE" : p[0].toUpperCase() + p.slice(1);

function afzender(van){
  const m = String(van||"").match(/^\s*"?([^"<]*?)"?\s*<([^>]+)>/);
  const naam = (m ? m[1] : "").trim() || (m ? m[2] : van) || "?";
  return {naam: naam.replace(/,\s*/," "), adres: m ? m[2] : van};
}
function initialen(naam){
  const w = naam.replace(/[^\p{L}\s]/gu," ").trim().split(/\s+/).filter(Boolean);
  return ((w[0]||"?")[0] + (w.length > 1 ? w[w.length-1][0] : "")).toUpperCase();
}
function datum(iso){
  if(!iso) return "";
  const d = new Date(iso), nu = new Date();
  if (d.toDateString() === nu.toDateString()) return d.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
  return d.toLocaleDateString("nl-NL",{day:"numeric",month:"short"});
}
const PLETTER = {onderwijs:"O", onderzoek:"R", istte:"I", overig:""};
const pletter = p => (p in PLETTER) ? PLETTER[p] : (p || "?")[0].toUpperCase();
const avatar = (it, klein) => { const a = afzender(it.van);
  return `<div class="avatar${klein?" klein":""}" style="background:${kleur(it.project)}" title="${esc(naamProject(it.project || "overig"))}">${esc(initialen(a.naam))}${pletter(it.project) ? `<span class="pl">${esc(pletter(it.project))}</span>` : ""}</div>`; };

let D = null, staat = {project:"alles", tab:"te_doen", open:null, lees:null, gekozen:new Set(), geenAuto:false, planDag:null};
const leesCache = {};   // id -> volledige mail (met tekst) voor Opruimen
try { const o = JSON.parse(localStorage.getItem("mailagent-ui")||"{}"); Object.assign(staat, {project:o.project||"alles", tab:o.tab||"te_doen"}); } catch(e){}
if (!["te_doen","planning","opruimen"].includes(staat.tab)) staat.tab = "te_doen";
const breed = () => window.matchMedia("(min-width:1100px)").matches;
const drieKolommen = () => breed() && staat.tab !== "planning";
const teDoen = () => filter([...D.zelf, ...D.wacht]);
const opruimLijst = () => [...filter(D.info), ...filter(D.overgeslagen)];
const bewaar = () => { try { localStorage.setItem("mailagent-ui", JSON.stringify({project:staat.project, tab:staat.tab})); } catch(e){} };
// Items waarvoor een actie onderweg is: meteen van het scherm, terug als de actie mislukt.
const verborgen = new Set(), takenVerborgen = new Set();
const filter = (lijst, taken) => lijst.filter(i => !(taken ? takenVerborgen : verborgen).has(i.id)
  && (staat.project === "alles" || i.project === staat.project));

async function laad(){
  const r = await fetch("/api/data", {cache:"no-store"});
  D = await r.json();
  teken();
  if (D.ophalen.bezig) setTimeout(laad, 4000);
}

async function actie(naam, data){
  try {
    const r = await fetch("/api/"+naam, {method:"POST", headers:{"Content-Type":"application/json","X-Token":TOKEN}, body:JSON.stringify(data||{})});
    const j = await r.json();
    toast(j.melding, !j.ok);
    return j.ok;
  } catch(e){ toast("Geen verbinding met mailagent. Draait 'scripts/mailagent.sh inbox' nog?", true); return false; }
}

// Eerst het scherm bijwerken, daarna de actie op de achtergrond uitvoeren.
async function meteen(ids, naam, data, set = verborgen){
  await animeerWeg(ids);
  ids.forEach(i => set.add(i));
  teken();
  const ok = await actie(naam, data);
  ids.forEach(i => set.delete(i));
  if (!ok) teken();
  laad();
  return ok;
}

function toast(tekst, fout, knop){
  if(!tekst) return;
  const knoppen = !knop ? [] : Array.isArray(knop) ? knop : [knop];
  const t = document.createElement("div");
  t.className = "toast" + (fout ? " fout" : "");
  t.innerHTML = ik(fout ? "alert" : "check") + `<div>${esc(tekst)}</div>` +
    (knoppen.length ? `<div class="knoppen">${knoppen.map((k, i) => `<button class="knop" data-i="${i}">${esc(k.label)}</button>`).join("")}</div>` : "");
  t.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { t.remove(); knoppen[Number(b.dataset.i)].doe(); }));
  document.getElementById("toasts").append(t);
  setTimeout(() => t.remove(), fout ? 9000 : knoppen.length ? 8000 : 3500);
}

// rij laten wegschuiven voordat hij uit de lijst gaat
function animeerWeg(ids){
  const sel = ids.map(i => `.rij[data-open="${i}"],.rij[data-kies="${i}"],.rij[data-taak="${i}"],.kaart[data-kaart="${i}"]`).join(",");
  const rijen = sel ? document.querySelectorAll(sel) : [];
  rijen.forEach(r => r.classList.add("weg"));
  return new Promise(res => setTimeout(res, rijen.length ? 170 : 0));
}

async function stil(naam, data){
  try {
    const r = await fetch("/api/"+naam, {method:"POST", headers:{"Content-Type":"application/json","X-Token":TOKEN}, body:JSON.stringify(data||{})});
    return await r.json();
  } catch(e){ return {ok:false, melding:"Geen verbinding met mailagent"}; }
}

async function vinkAf(id){
  await animeerWeg([id]);
  takenVerborgen.add(id); teken();
  const j = await stil("taak-klaar", {id});
  takenVerborgen.delete(id);
  if (!j.ok) toast(j.melding, true);
  else {
    const oordeel = o => stil("taak-oordeel", {id, oordeel: o}).then(r => toast(r.melding, !r.ok));
    toast("Afgevinkt. Duurde het…", false, [
      {label: "korter", doe: () => oordeel(-1)}, {label: "klopt", doe: () => oordeel(0)},
      {label: "langer", doe: () => oordeel(1)}, {label: "Ongedaan", doe: () => zetTerug(id)}]);
  }
  laad();
}

async function zetTerug(id){
  document.querySelectorAll(".toast .knop").forEach(k => k.closest(".toast").remove());  // oude 'ongedaan maken' weg
  const j = await stil("taak-heropen", {id});
  toast(j.ok ? "Taak teruggezet" : j.melding, !j.ok);
  laad();
}

function teken(){
  if(!D) return;
  const app = document.getElementById("app"), wordtDrie = drieKolommen();
  if (app.classList.contains("drie") !== wordtDrie){
    // wisselen tussen vaste kolom en schuifpaneel zonder zichtbare schuifbeweging
    const p = document.getElementById("paneel");
    p.style.transition = "none";
    app.classList.toggle("drie", wordtDrie);
    void p.offsetWidth;
    requestAnimationFrame(() => { p.style.transition = ""; });
  }
  // zijbalk: weergaven en projecten
  const alleWacht = [...D.zelf, ...D.wacht].filter(i => !verborgen.has(i.id));
  const tel = n => n === "alles" ? alleWacht.length : alleWacht.filter(i => i.project === n).length;
  const inPlan = filter(D.taken, true).filter(t => !t.gepland).length;
  const opruimN = filter(D.info).length + filter(D.overgeslagen).length;
  const weergaven = [["te_doen","inbox","Te doen",teDoen().length],["planning","calendar","Planning",inPlan],["opruimen","sparkle","Opruimen",opruimN]];
  document.getElementById("nav").innerHTML =
    weergaven.map(([k,i,l,n]) => `<button class="nav${staat.tab===k?" actief":""}" data-tab="${k}" title="${l}">${ik(i)}<span class="navtekst">${l}</span>${n ? `<span class="tel">${n}</span>` : ""}</button>`).join("")
    + `<div class="nav-kop">Projecten</div>`
    + [{naam:"alles"}, ...D.projecten].map(p => `
    <button class="nav${p.naam===staat.project?" actief":""}" data-project="${esc(p.naam)}" title="${esc(naamProject(p.naam))}">
      ${p.naam==="alles" ? `<span class="stip" style="background:var(--lijn)"></span>` : `<span class="stip" style="background:${kleur(p.naam)}"></span>`}
      <span class="navtekst">${esc(naamProject(p.naam))}</span>${tel(p.naam) ? `<span class="tel">${tel(p.naam)}</span>` : ""}
    </button>`).join("");
  const knop = document.getElementById("ophalen");
  knop.classList.toggle("bezig", D.ophalen.bezig);
  knop.querySelector(".navtekst").textContent = D.ophalen.bezig ? "Bezig met ophalen…" : "Mail ophalen";
  document.getElementById("status").textContent = D.ophalen.bezig ? "Claude sorteert en schrijft concepten" : (D.ophalen.laatste || "");
  const titels = {te_doen:"Te doen", planning:"Planning", opruimen:"Opruimen"};
  document.getElementById("titel").textContent = titels[staat.tab] + (staat.project !== "alles" ? " · " + naamProject(staat.project) : "");
  document.getElementById("koptel").textContent = "";
  document.getElementById("status").textContent = D.ophalen.bezig ? "Claude sorteert en schrijft concepten"
    : (D.ophalen.laatste || (D.volgende_ronde ? `Volgende ronde ${D.volgende_ronde}` : ""));

  const inhoud = document.getElementById("inhoud");
  if (staat.tab === "te_doen") inhoud.innerHTML = tekenVoortgang() + tekenBeoordelen(teDoen());
  else if (staat.tab === "planning") inhoud.innerHTML = tekenPlanning();
  else inhoud.innerHTML = tekenOpruimen();
  tekenBalk();

  // derde kolom / paneel
  if (taak || antwoord) return;
  if (staat.tab === "opruimen"){
    const lijst = opruimLijst();
    if (staat.lees !== null && !lijst.some(i => i.id === staat.lees)) staat.lees = null;
    if (staat.lees === null && drieKolommen() && lijst.length && !staat.geenAuto) staat.lees = lijst[0].id;
    if (staat.lees !== null) return tekenLees(staat.lees);
    return drieKolommen() ? tekenLeegPaneel() : sluitPaneel();
  }
  if (staat.open !== null){
    const it = [...D.zelf, ...D.wacht].find(i => i.id === staat.open);
    if (it) return tekenPaneel(it);
    staat.open = null;
  }
  if (drieKolommen()){
    const lijst = teDoen();
    if (staat.tab === "te_doen" && lijst.length && !staat.geenAuto){ staat.open = lijst[0].id; return teken(); }
    tekenLeegPaneel();
  } else sluitPaneel();
}

// voortgang: aan het begin wat al gedaan is, voorbij de helft wat nog rest (kleinste getal motiveert het meest)
function tekenVoortgang(){
  const rest = teDoen().length, gedaan = (D.vandaag_afgehandeld || 0) + verborgen.size, totaal = gedaan + rest;
  if (!totaal) return "";
  const pct = Math.round(gedaan / totaal * 100);
  const tekst = !rest ? `<b>Alles gedaan</b><span>${gedaan} vandaag</span>`
    : pct < 50 ? `<span><b>${gedaan} gedaan</b> vandaag</span><span>${rest} te gaan</span>`
    : `<span><b>Nog ${rest}</b>, dan ben je klaar</span><span>${gedaan} gedaan</span>`;
  return `<div class="voortgang${rest ? "" : " klaar"}"><div class="voortgang-tekst">${tekst}</div><div class="voortgang-balk"><i style="width:${rest ? pct : 100}%"></i></div></div>`;
}

// ---------------- mail tonen: opgemaakt (HTML, veilig) of als tekst ----------------
const htmlCache = {};          // id -> veilige html | {fout}
let weergave = "opgemaakt";
try { weergave = localStorage.getItem("mailagent-weergave") || "opgemaakt"; } catch(e){}
const attr = s => String(s ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;");

function mailWeergave(id, tekst){
  const h = htmlCache[id];
  if (weergave === "opgemaakt" && h === undefined){
    htmlCache[id] = "laden";
    stil("mail-html", {id}).then(j => { htmlCache[id] = j.ok ? j.html : {fout: j.melding}; ververs(id); });
  }
  const opgemaakt = weergave === "opgemaakt" && typeof h === "string" && h !== "laden";
  const status = weergave !== "opgemaakt" ? "" : h === "laden" || h === undefined ? "opmaak laden…" : h && h.fout ? esc(h.fout) : "";
  return `<div class="mailweergave" id="mw-${id}">
    <div class="weergavekeuze"><div class="segment">
      <button class="${weergave === "opgemaakt" ? "aan" : ""}" data-weergave="opgemaakt">Opgemaakt</button>
      <button class="${weergave === "tekst" ? "aan" : ""}" data-weergave="tekst">Tekst</button></div>
      <span class="meta">${status}</span>
      <button class="knop klein" data-mailopen="${id}" style="margin-left:auto" title="Deze mail openen in Apple Mail">${ik("mail")}Open in Mail</button></div>
    ${opgemaakt ? `<iframe class="mailframe" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" srcdoc="${attr(h)}" title="Mail"></iframe>`
                : `<div class="leesvlak">${tekst === null ? `<span class="meta">Mail laden…</span>` : esc(tekst || "(geen tekst)")}</div>`}
  </div>`;
}
function ververs(id){
  // alleen het weergaveblok vervangen, zodat de rest van het paneel (en wat je typt) blijft staan
  const el = document.getElementById("mw-" + id);
  if (!el) return;
  const tekst = (leesCache[id] && leesCache[id].tekst) ?? ([...D.zelf, ...D.wacht].find(i => i.id === id)?.tekst ?? null);
  el.outerHTML = mailWeergave(id, tekst);
}

async function openLees(id){
  staat.lees = id; staat.geenAuto = false; taak = null; antwoord = null; teken();
  document.querySelector(`.rij[data-kies="${id}"]`)?.scrollIntoView({block:"nearest"});
}

function tekenLees(id){
  const p = document.getElementById("paneel"), basis = opruimLijst().find(i => i.id === id);
  if (!basis) return;
  const m = leesCache[id], a = afzender(basis.van), gw = gewoonte(basis);
  if (!m){
    stil("mail", {id}).then(j => { if (j.ok){ leesCache[id] = j.mail; if (staat.lees === id) tekenLees(id); } });
  }
  const zelfde = p.dataset.lees === String(id);
  const sleutel = `${id}|${m ? 1 : 0}|${weergave}|${basis.status}`;
  if (zelfde && p.dataset.sleutel === sleutel && p.classList.contains("open")) return;   // niets veranderd: iframe niet herladen
  p.dataset.id = ""; p.dataset.lees = id; p.dataset.sleutel = sleutel;
  p.innerHTML = `
    <div class="p-kop">${avatar(basis)}
      <div style="min-width:0"><h2>${esc(basis.onderwerp)}</h2><div class="van">${esc(a.naam)} · ${esc(a.adres)} · ${datum(basis.datum)}</div>
        <div class="chips"><span class="chip">${ik(basis.status === "genegeerd" ? "ban" : "eye")}${basis.status === "genegeerd" ? "Overgeslagen" : "Ter info"}</span>
          ${gw ? `<span class="chip">${esc(gw.tekst)}</span>` : ""}</div></div>
      <button class="ikoon sluit-mail" id="sluit" title="Sluiten (Esc)">${ik("x")}</button></div>
    <div class="p-inhoud"${zelfde ? ' style="animation:none"' : ""}>
      ${basis.samenvatting && basis.samenvatting !== basis.onderwerp ? `<div class="melding info">${ik("sparkle")}<div>${esc(basis.samenvatting)}</div></div>` : ""}
      ${m && m.reden && basis.status === "genegeerd" ? `<div class="meta">${esc(m.reden)}</div>` : ""}
      ${mailWeergave(id, m ? m.tekst : null)}
    </div>
    <div class="p-voet">
      <button class="knop" data-maaktaak="${id}" title="Taak maken (T)">${ik("calendar")}Taak<kbd>T</kbd></button>
      <button class="knop" data-opbergen="${id}" title="Opbergen in een map (V)">${ik("folder")}Opbergen<kbd>V</kbd></button>
      <button class="knop" data-een="overslaan" data-id="${id}" title="Afzender voortaan overslaan">${ik("ban")}</button>
      <span style="flex:1"></span>
      <button class="knop" data-een="prullenbak" data-id="${id}" title="Naar prullenbak (#)">${ik("trash")}<kbd>#</kbd></button>
      <button class="knop goed" data-een="archief" data-id="${id}" title="Archiveren (E)">${ik("archive")}Archiveren<kbd>E</kbd></button>
    </div>`;
  p.classList.add("open"); p.setAttribute("aria-hidden","false");
  if (!drieKolommen()) document.getElementById("dek").classList.add("open");
}

function tekenLeegPaneel(){
  const p = document.getElementById("paneel");
  p.dataset.id = ""; p.dataset.sleutel = ""; p.dataset.lees = "";
  const klaar = staat.tab === "te_doen" && !teDoen().length;
  p.innerHTML = `<div class="leegpaneel">
      ${klaar ? `<div class="rond">${ik("check")}</div><b style="color:var(--tekst)">Alles bijgewerkt</b>Er wacht niets op je.` :
        staat.tab === "opruimen" ? `${ik("sparkle")}<b style="color:var(--tekst)">Opruimen</b><p>Klik op een mail om hem te lezen. Vink mails aan om er meerdere tegelijk af te handelen.</p>` :
        `${ik("mail")}<b style="color:var(--tekst)">Kies een mail</b>`}
      <div class="sneltoetsen"><span><kbd>J</kbd> <kbd>K</kbd> volgende, vorige</span><span><kbd>⌘</kbd><kbd>↵</kbd> goedkeuren</span>
        <span><kbd>V</kbd> opbergen</span><span><kbd>E</kbd> archiveren</span><span><kbd>#</kbd> prullenbak</span><span><kbd>T</kbd> taak</span><span><kbd>X</kbd> afwijzen</span>
        <span><kbd>1</kbd>–<kbd>${D.projecten.length}</kbd> project</span><span><kbd>?</kbd> alle sneltoetsen</span></div></div>`;
  p.classList.add("open"); p.setAttribute("aria-hidden","false");
}

// volgende mail in Te doen na een actie, zodat je door kunt werken
function volgendeNa(id){
  const lijst = teDoen().map(i => i.id), i = lijst.indexOf(id);
  return i < 0 ? null : (lijst[i+1] ?? lijst[i-1] ?? null);
}

const leeg = (titel, tekst) => `<div class="lijst"><div class="leeg"><div class="rond">${ik("check")}</div><b>${titel}</b>${tekst}</div></div>`;

function tekenBeoordelen(items){
  if (!items.length) return leeg("Alles bijgewerkt", "Er wacht niets op je beoordeling.");
  return `<div class="lijst">${items.map(it => { const a = afzender(it.van), [ai, al] = ACTIES[it.actie] || ["mail", it.actie];
    // één label: wat er van jou nodig is; deadline erbij als die er is
    const dl = it.deadline ? ` · ${new Date(it.deadline + "T12:00").toLocaleDateString("nl-NL",{day:"numeric",month:"short"})}` : "";
    const chips = [];
    if (it.status === "fout" || it.status === "handmatig") chips.push(`<span class="chip let">${ik("alert")}Zelf bekijken</span>`);
    else if (it.vragen) chips.push(`<span class="chip let">Beslissing${dl}</span>`);
    else chips.push(`<span class="chip">${ik(ai)}${al}${dl}</span>`);
    return `<div class="rij${staat.open===it.id?" gekozen":""}" data-open="${it.id}" tabindex="0">
      ${avatar(it)}
      <div class="midden">
        <div class="regel1"><span class="van">${esc(a.naam)}${it.prioriteit === "hoog" ? `<span class="prio" title="Hoge prioriteit"></span>` : ""}</span><span class="datum">${datum(it.datum)}</span></div>
        <div class="onderwerp">${esc(it.onderwerp)}</div>
        <div class="samenvatting">${esc(it.samenvatting && it.samenvatting !== it.onderwerp ? it.samenvatting : (it.opmerking || ""))}</div>
        <div class="chips">${chips.join("")}</div>
      </div>
    </div>`; }).join("")}</div>`;
}

function taakMail(t){
  if (!t.mail) return "";
  const a = afzender(t.mail.van);
  return `<div class="taakmail">${avatar(t.mail, true)}<div class="tekst"><b>${esc(a.naam)}</b> · ${esc(t.mail.onderwerp)}</div>
    ${t.mail.kan_openen ? `<button class="knop" data-mailopen="${t.mail.id}" title="Open de mail in Apple Mail">${ik("mail")}Open</button>` : ""}
    <button class="knop" data-beantwoord="${t.id}" title="Antwoord schrijven">${ik("reply")}Beantwoorden</button></div>`;
}

function afgerondHTML(){
  const afgerond = filter(D.afgerond || [], true);
  return afgerond.length ? `<details class="regels"><summary>Afgerond (${afgerond.length})</summary><div class="lijst">${afgerond.map(t => `
      <div class="rij afgerond" style="cursor:default"><span class="ikoon" style="color:var(--ok)">${ik("check")}</span>
        <div class="midden">${esc(t.omschrijving)}</div><span class="datum">${t.afgerond ? datum(t.afgerond) : ""}</span>
        <button class="knop klein" data-terug="${t.id}">Terugzetten</button></div>`).join("")}</div></details>` : "";
}

function tekenTaken(items){
  const lijstAfgerond = afgerondHTML();
  if (!items.length) return leeg("Geen open taken", "Taken verschijnen hier zodra je er een maakt of een uitwerking goedkeurt.") + lijstAfgerond;
  return `<div class="lijst">${items.map(t => `
    <div class="rij taak" data-taak="${t.id}">
      <button class="rondje" data-klaar="${t.id}" title="Afvinken">${ik("check")}</button>
      <div class="midden"><div>${esc(t.omschrijving)}</div>
        ${t.stappen && t.stappen.length ? `<ul class="stappen-klein">${t.stappen.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
        <div class="chips">${staat.project==="alles" ? `<span class="chip project" style="background:${kleur(t.project)}">${esc(naamProject(t.project))}</span>` : ""}
        ${t.minuten ? `<span class="chip">${ik("clock")}${duurTekst(t.minuten)}</span>` : ""}
        ${t.gepland ? `<span class="chip let">${ik("calendar")}${momentTekst(t.gepland, t.minuten)}</span>` : ""}
        ${t.deadline ? `<span class="chip">deadline ${esc(t.deadline)}</span>` : ""}</div>
        ${taakMail(t)}</div>
    </div>`).join("")}</div>` + lijstAfgerond;
}

// Antwoord schrijven op de mail achter een taak
let antwoord = null;   // {taak, laden}
function tekenAntwoord(){
  const p = document.getElementById("paneel"), t = antwoord.taak, m = t.mail, a = afzender(m.van);
  const oud = document.getElementById("a-tekst");
  const tekst = oud ? oud.value : (antwoord.tekst ?? m.concept);
  p.dataset.id = "";
  p.innerHTML = `<div class="p-kop">${avatar(m)}<div style="min-width:0"><h2>${esc(m.onderwerp)}</h2>
      <div class="van">${esc(a.naam)} · ${esc(a.adres)} · ${datum(m.datum)}</div>
      <div class="chips"><span class="chip">${ik("task")}${esc(t.omschrijving)}</span></div></div>
      <button class="ikoon" id="sluit" title="Sluiten (Esc)">${ik("x")}</button></div>
    <div class="p-inhoud">
      ${antwoord.vragen ? `<div class="melding">${ik("alert")}<div><b>Beslissing voor jou</b><br>${esc(antwoord.vragen)}</div></div>` : ""}
      <div><div class="label">${ik("reply")}Antwoord</div>
        <textarea id="a-tekst" placeholder="Typ je antwoord, of laat Claude een concept schrijven.">${esc(tekst)}</textarea></div>
      <div><button class="knop" id="a-claude" ${antwoord.laden ? "disabled" : ""}>${ik("sparkle")}${antwoord.laden ? "Claude schrijft…" : "Concept door Claude"}</button></div>
      <details class="origineel" open><summary>${ik("mail")}Oorspronkelijke mail</summary><pre>${esc(m.tekst)}</pre></details>
    </div>
    <div class="p-voet"><span class="uitleg">Opent een antwoord in Apple Mail. Je verstuurt zelf. De taak blijft staan.</span>
      <button class="knop" id="sluit2">Annuleren</button>
      <button class="knop goed" id="a-open">${ik("reply")}Openen in Apple Mail</button></div>`;
  p.classList.add("open"); p.setAttribute("aria-hidden","false");
  document.getElementById("dek").classList.add("open");
}

async function claudeAntwoord(){
  antwoord.laden = true; antwoord.tekst = document.getElementById("a-tekst").value; tekenAntwoord();
  const huidig = antwoord;
  const j = await stil("antwoord-concept", {id: huidig.taak.mail.id});
  if (antwoord !== huidig) return;
  antwoord.laden = false;
  if (!j.ok){ toast(j.melding, true); return tekenAntwoord(); }
  const veld = document.getElementById("a-tekst"); if (veld) veld.remove();   // nieuwe tekst gebruiken
  antwoord.tekst = j.concept; antwoord.vragen = j.vragen;
  tekenAntwoord();
}

async function openAntwoord(){
  const id = antwoord.taak.mail.id, tekst = document.getElementById("a-tekst").value;
  sluitPaneel();
  toast("Antwoord gaat naar Apple Mail…");
  const j = await stil("antwoord-openen", {id, tekst});
  toast(j.melding, !j.ok);
  laad();
}

// wat je eerder met mail van deze afzender deed
function gewoonte(it){
  const g = (D.gedrag || {})[afzender(it.van).adres.toLowerCase()];
  if (!g) return null;
  const opties = [["prullenbak", g.prullenbak||0, "weggegooid"], ["archief", g.archief||0, "gearchiveerd"], ["taak", g.taak||0, "taak van gemaakt"]]
    .filter(o => o[1] >= 2).sort((a, b) => b[1] - a[1]);
  return opties.length ? {actie: opties[0][0], tekst: `meestal ${opties[0][2]} (${opties[0][1]}×)`} : null;
}

function opruimGroep(titel, items, hoofd){
  if (!items.length) return "";
  const ids = items.map(i => i.id).join(",");
  const groot = hoofd === "archief"
    ? `<button class="knop klein" data-groep="archief" data-ids="${ids}">${ik("archive")}Alles archiveren</button>`
    : `<button class="knop klein" data-groep="prullenbak" data-ids="${ids}">${ik("trash")}Alles naar prullenbak</button>`;
  return `<div class="groep"><div class="groep-kop"><h2>${titel} · ${items.length}</h2><div class="acties">${groot}</div></div>
    <div class="lijst">${items.map(it => { const a = afzender(it.van), gw = gewoonte(it);
      return `<div class="rij${staat.gekozen.has(it.id)?" gekozen":""}${staat.lees===it.id?" leest":""}" data-kies="${it.id}" tabindex="0">
        <input type="checkbox" class="vink" data-vink="${it.id}" ${staat.gekozen.has(it.id)?"checked":""} aria-label="Selecteren">
        ${avatar(it, true)}
        <div class="midden">
          <div class="regel1"><span class="van">${esc(a.naam)}</span><span class="datum">${datum(it.datum)}</span></div>
          <div class="samenvatting">${esc(it.samenvatting || it.onderwerp)}</div>
        </div>
        ${gw ? `<span class="gewoonte">${esc(gw.tekst)}</span>` : ""}
        <div class="snel"${gw ? ' style="opacity:1"' : ""}>
          <button class="ikoon${gw && gw.actie==="taak" ? " voorkeur" : ""}" data-maaktaak="${it.id}" title="Taak maken en inplannen">${ik("task")}</button>
          <button class="ikoon" data-opbergen="${it.id}" title="Opbergen in een map">${ik("folder")}</button>
          <button class="ikoon${gw && gw.actie==="archief" ? " voorkeur" : ""}" data-een="archief" data-id="${it.id}" title="Archiveren">${ik("archive")}</button>
          <button class="ikoon rood${gw && gw.actie==="prullenbak" ? " voorkeur" : ""}" data-een="prullenbak" data-id="${it.id}" title="Naar prullenbak">${ik("trash")}</button>
          <button class="ikoon" data-een="overslaan" data-id="${it.id}" title="Afzender voortaan overslaan">${ik("ban")}</button>
        </div>
      </div>`; }).join("")}</div></div>`;
}

function tekenOpruimen(){
  const info = filter(D.info), over = filter(D.overgeslagen);
  const vs = D.voorstellen || [];
  let html = vs.length ? `<div class="voorstel">${ik("sparkle")}<div class="namen"><b>Deze afzenders gooi je steeds weg.</b> Voortaan overslaan, zonder Claude?<br>
      <span class="meta">${vs.map(v => `${esc(afzender(v.van).naam)} (${v.weg}×)`).join(" · ")}</span></div>
      <button class="knop klein" data-overslaanalle="${esc(vs.map(v => v.adres).join(","))}">${ik("ban")}Allemaal overslaan</button></div>` : "";
  html += opruimGroep("Ter info", info, "archief") + opruimGroep("Overgeslagen", over, "prullenbak");
  if (!info.length && !over.length) html = (vs.length ? html : "") + leeg("Niets op te ruimen", "Ter-info-mail en nieuwsbrieven verschijnen hier.");
  if (D.regels.length) html += `<details class="regels"><summary>${D.regels.length} afzender(s) worden voortaan overgeslagen</summary>
    <div class="lijst">${D.regels.map(r => `<div class="rij" style="cursor:default"><span class="ikoon">${ik("ban")}</span>
      <div class="midden">${esc(r.adres)}</div><button class="knop klein" data-regelweg="${esc(r.adres)}">Niet meer overslaan</button></div>`).join("")}</div></details>`;
  return html;
}

const duurTekst = m => m < 60 ? `${m} min` : `${Math.floor(m/60)} u${m%60 ? " " + (m%60) + " min" : ""}`;
function momentTekst(iso, minuten){
  const b = new Date(iso), e = new Date(b.getTime() + (minuten||30)*60000);
  const tijd = d => d.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
  return `${b.toLocaleDateString("nl-NL",{weekday:"short",day:"numeric",month:"short"})} · ${tijd(b)}–${tijd(e)}`;
}
const vindItem = id => [...D.zelf, ...D.wacht, ...D.info, ...D.overgeslagen].find(i => i.id === id);
let taak = null;   // {id, item, voorstel, minuten, inplannen, start(ms), dag, archiveren}
const dagen = {};  // datum -> lijst afspraken | "laden" | {fout}
const PX = 0.8;    // pixels per minuut in het dagoverzicht
const tweeCijfers = n => String(n).padStart(2, "0");
const isoDag = d => `${d.getFullYear()}-${tweeCijfers(d.getMonth()+1)}-${tweeCijfers(d.getDate())}`;
const lokaalIso = ms => { const d = new Date(ms); return `${isoDag(d)}T${tweeCijfers(d.getHours())}:${tweeCijfers(d.getMinutes())}`; };
const dagBegin = dag => new Date(dag + "T00:00").getTime();
const uurMin = t => { const [h, m] = t.split(":").map(Number); return h*60 + m; };
const kortMoment = iso => { const d = new Date(iso);
  return `${d.toLocaleDateString("nl-NL",{weekday:"short",day:"numeric",month:"short"})} ${tweeCijfers(d.getHours())}:${tweeCijfers(d.getMinutes())}`; };

async function laadDag(dag){
  if (dagen[dag] !== undefined) return;
  dagen[dag] = "laden";
  try {
    const r = await fetch("/api/dag", {method:"POST", headers:{"Content-Type":"application/json","X-Token":TOKEN}, body:JSON.stringify({datum:dag})});
    const j = await r.json();
    dagen[dag] = j.ok ? j.afspraken : {fout: j.melding};
  } catch(e){ dagen[dag] = {fout: "Agenda niet bereikbaar"}; }
  if (taak && taak.dag === dag) tekenTaak();
  else if (staat.tab === "planning" && staat.planDag === dag) teken();
}

function zetStart(ms){
  taak.start = ms; taak.dag = isoDag(new Date(ms)); taak.inplannen = true; taak.scrollen = true;
  laadDag(taak.dag);
}

function botsingen(){
  const lijst = Array.isArray(dagen[taak.dag]) ? dagen[taak.dag] : [];
  const b = taak.start, e = b + taak.minuten*60000;
  return lijst.filter(a => !a.heledag && !a.vrij && Date.parse(a.start) < e && Date.parse(a.eind) > b);
}

function tijdlijnBereik(){
  const w = taak.voorstel.werktijd || {begin:"09:00", eind:"17:00"};
  const sMin = Math.round((taak.start - dagBegin(taak.dag)) / 60000);
  const van = Math.max(0, Math.min(uurMin(w.begin) - 60, Math.floor(sMin/60)*60));
  const tot = Math.min(24*60, Math.max(uurMin(w.eind) + 60, Math.ceil((sMin + taak.minuten)/60)*60));
  return {van, tot, w};
}

function tijdlijnHTML(){
  const lijst = dagen[taak.dag];
  if (lijst === undefined || lijst === "laden") return `<div class="tijdlijn"><div class="tl-laden">Agenda laden…</div></div>`;
  if (lijst.fout) return `<div class="melding">${ik("alert")}<div>${esc(lijst.fout)}</div></div>`;
  const {van, tot, w} = tijdlijnBereik(), d0 = dagBegin(taak.dag);
  const y = min => (min - van) * PX;
  let h = "";
  // buiten werktijd
  if (uurMin(w.begin) > van) h += `<div class="buiten" style="top:0;height:${y(uurMin(w.begin))}px"></div>`;
  if (uurMin(w.eind) < tot) h += `<div class="buiten" style="top:${y(uurMin(w.eind))}px;height:${y(tot)-y(uurMin(w.eind))}px"></div>`;
  for (let m = van; m < tot; m += 30)
    h += `<div class="uur${m % 60 ? " half" : ""}" style="top:${y(m)}px">${m % 60 ? "" : `<span>${tweeCijfers(m/60)}:00</span>`}</div>`;
  // afspraken naast elkaar als ze overlappen
  const blokken = lijst.filter(a => !a.heledag).map(a => ({...a, b: Math.max(van, (Date.parse(a.start)-d0)/60000), e: Math.min(tot, (Date.parse(a.eind)-d0)/60000)}))
                       .filter(a => a.e > a.b).sort((p, q) => p.b - q.b);
  const kolEind = [];
  blokken.forEach(a => { let k = kolEind.findIndex(e => e <= a.b); if (k < 0){ k = kolEind.length; kolEind.push(0); } kolEind[k] = a.e; a.kol = k; });
  const n = Math.max(1, kolEind.length);
  blokken.forEach(a => {
    h += `<div class="afs${a.vrij ? " vrij" : ""}${isFocus(a) ? " focus" : ""}" style="top:${y(a.b)}px;height:${Math.max(16, (a.e-a.b)*PX - 2)}px;left:${a.kol*100/n}%;width:calc(${100/n}% - 3px)" title="${esc(a.titel)} · ${esc(a.kalender)}">${esc(a.titel)}${isFocus(a) ? " · beschermd" : ""}</div>`;
  });
  // de nieuwe taak
  const sMin = (taak.start - d0)/60000, bots = botsingen();
  h += `<div class="tb${bots.length ? " botst" : ""}" id="tb" style="top:${y(sMin)}px;height:${taak.minuten*PX - 2}px">
          <b>${esc(document.getElementById("t-titel")?.value || taak.voorstel.titel)}</b><span id="tb-tijd">${blokTijd()}</span><div class="rek"></div></div>`;
  const heledag = lijst.filter(a => a.heledag);
  return (heledag.length ? `<div class="heledag">${heledag.map(a => `<span>${esc(a.titel)}</span>`).join("")}</div>` : "") +
    `<div class="tijdlijn" id="tijdlijn"><div class="tl-binnen" id="tl-binnen" data-van="${van}" style="height:${(tot-van)*PX}px">${h}</div></div>` +
    (bots.length ? `<div class="melding fout">${ik("alert")}<div>Overlapt met ${esc(bots.map(a => a.titel).join(", "))}</div></div>` : "");
}

const tijdVan = ms => { const d = new Date(ms); return `${tweeCijfers(d.getHours())}:${tweeCijfers(d.getMinutes())}`; };

function blokTijd(){
  const b = new Date(taak.start), e = new Date(taak.start + taak.minuten*60000);
  return ` ${tweeCijfers(b.getHours())}:${tweeCijfers(b.getMinutes())}–${tweeCijfers(e.getHours())}:${tweeCijfers(e.getMinutes())} · ${duurTekst(taak.minuten)}`;
}

async function openTaak(id){
  const it = vindItem(id);
  if (!it) return;
  staat.open = null;
  taak = {id, item: it, voorstel: null, minuten: 30, inplannen: false, start: null, dag: null,
          archiveren: false};
  tekenTaak();
  try {
    const r = await fetch("/api/taak-voorstel", {method:"POST", headers:{"Content-Type":"application/json","X-Token":TOKEN}, body:JSON.stringify({id})});
    const j = await r.json();
    if (!taak || taak.id !== id) return;
    if (!j.ok){ toast(j.melding, true); return sluitPaneel(); }
    taak.voorstel = j.voorstel; taak.minuten = j.voorstel.minuten;
    if (j.voorstel.momenten.length) zetStart(Date.parse(j.voorstel.momenten[0]));
    else if (!j.voorstel.agenda_fout){ const m = new Date(); m.setDate(m.getDate()+1); m.setHours(9,0,0,0); taak.start = m.getTime(); taak.dag = isoDag(m); }
    tekenTaak();
  } catch(e){ toast("Geen verbinding met mailagent", true); sluitPaneel(); }
}

    const dagLabel = taak.dag ? new Date(taak.dag + "T12:00").toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long"}) : "";
    p.innerHTML = kop + `<div class="p-inhoud">
      <div class="melding info">${ik("sparkle")}<div>${esc(v.toelichting)}</div></div>
      <div class="veld"><div class="label">Taak</div><input type="text" id="t-titel" value="${esc(document.getElementById("t-titel")?.value ?? v.titel)}"></div>
      <div class="veld"><div class="label">${ik("clock")}Geschatte tijd</div>
        <div class="keuzes">${duren.map(d => `<button class="keuze${d===taak.minuten?" aan":""}" data-duur="${d}">${duurTekst(d)}</button>`).join("")}</div></div>
      <div class="veld"><div class="label">${ik("task")}Wat te doen (één stap per regel)</div>
        <textarea id="t-stappen">${esc(document.getElementById("t-stappen")?.value ?? v.stappen.join("\n"))}</textarea></div>
      <div class="veld"><div class="label">Deadline</div><input type="date" id="t-deadline" value="${esc(document.getElementById("t-deadline")?.value ?? (v.deadline || ""))}"></div>
      <div class="veld"><div class="label">${ik("calendar")}Inplannen in je agenda</div>
        ${v.agenda_fout ? `<div class="melding">${ik("alert")}<div>${esc(v.agenda_fout)}</div></div>` : ""}
        ${v.agenda_fout ? "" : `<div class="keuzes">${chips}</div>`}
        ${!v.agenda_fout && taak.inplannen ? `
          <div class="tijdvelden"><input type="date" id="t-datum" value="${taak.dag}" aria-label="Datum">
            <input type="time" id="t-tijd" step="900" value="${tijdVan(taak.start)}" aria-label="Begintijd">
            <span id="t-tot">tot ${tijdVan(taak.start + taak.minuten*60000)}</span></div>
          <div class="dagnav"><button class="ikoon" data-dagstap="-1" title="Vorige dag">${ik("chevron").replace("<path", '<path transform="rotate(180 12 12)"')}</button>
            <b>${esc(dagLabel)}</b><button class="ikoon" data-dagstap="1" title="Volgende dag">${ik("chevron")}</button>
            <span class="meta">Versleep het blok, rek de onderkant, of klik op een tijd</span></div>
          ${tijdlijnHTML()}` : ""}
      </div>
      ${it.status === "ter_info" || it.status === "genegeerd" ? `<label class="vinkregel"><input type="checkbox" class="vink" id="t-archief" ${taak.archiveren?"checked":""}> Mail archiveren (blijft aan de taak gekoppeld)</label>` : ""}
    </div>
    <div class="p-voet"><span class="uitleg">${taak.inplannen ? "Maakt een afspraak in je agenda, die naar Outlook synchroniseert." : "Komt in je takenlijst."}</span>
      <button class="knop" id="sluit2">Annuleren</button>
      <button class="knop goed" id="taakmaak">${ik("check")}${taak.inplannen ? "Maken en inplannen" : "Taak maken"}</button></div>`;
    const inhoudNieuw = p.querySelector(".p-inhoud"), tl = document.getElementById("tijdlijn");
    if (inhoudNieuw) inhoudNieuw.scrollTop = scrollInhoud;
    if (tl){
      if (taak.scrollen){ const tb = document.getElementById("tb"); tl.scrollTop = Math.max(0, tb.offsetTop - 70); taak.scrollen = false; }
      else if (scrollTl !== null) tl.scrollTop = scrollTl;
    }
  }
  p.classList.add("open"); p.setAttribute("aria-hidden","false");
  document.getElementById("dek").classList.add("open");

async function bevestigTaak(){

function verplaats(ids, doel){
  if (!ids.length) return;
  ids.forEach(i => staat.gekozen.delete(i));
  if (staat.tab === "te_doen" && ids.includes(staat.open)){ const v = volgendeNa(staat.open); staat.open = v; staat.geenAuto = v === null; }
  if (staat.tab === "opruimen" && ids.includes(staat.lees)){
    const l = opruimLijst().map(i => i.id), k = l.indexOf(staat.lees);
    const v = l.slice(k + 1).find(i => !ids.includes(i)) ?? l.slice(0, k).reverse().find(i => !ids.includes(i)) ?? null;
    staat.lees = v; staat.geenAuto = v === null;
  }
  if (doel === "overslaan") return actie("verplaats", {ids, doel}).then(laad);
  return verplaatsMetUndo(ids, doel);
}

async function verplaatsMetUndo(ids, doel){
  await animeerWeg(ids);
  ids.forEach(i => verborgen.add(i)); teken();
  const j = await stil("verplaats", {ids, doel});
  ids.forEach(i => verborgen.delete(i));
  if (!j.ok) toast(j.melding, true);
  else toast(j.melding, false, {label: "Ongedaan maken", doe: async () => {
    const r = await stil("terugzetten", {ids}); toast(r.melding, !r.ok); laad(); }});
  laad();
}

// Slepen en rekken in het dagoverzicht, in stappen van een kwartier
let sleep = null;
document.addEventListener("pointerdown", ev => {
  const tl = ev.target.closest("#tijdlijn");
  if (!tl || !taak) return;
  const tb = ev.target.closest("#tb");
  sleep = {modus: ev.target.closest(".rek") ? "rek" : tb ? "schuif" : "klik", y0: ev.clientY, start0: taak.start, duur0: taak.minuten, bewogen: false, tl};
  if (tb){ tb.setPointerCapture(ev.pointerId); ev.preventDefault(); }
});
document.addEventListener("pointermove", ev => {
  if (!sleep || sleep.modus === "klik") return;
  const dy = ev.clientY - sleep.y0;
  if (Math.abs(dy) > 3) sleep.bewogen = true;
  const stap = Math.round(dy / PX / 15) * 15;
  const d0 = dagBegin(taak.dag);
  if (sleep.modus === "schuif"){
    const min = Math.min(24*60 - taak.minuten, Math.max(0, (sleep.start0 - d0)/60000 + stap));
    taak.start = d0 + min*60000;
  } else {
    taak.minuten = Math.max(15, Math.min(24*60 - (taak.start - d0)/60000, sleep.duur0 + stap));
  }
  const tb = document.getElementById("tb"), van = Number(document.getElementById("tl-binnen").dataset.van);
  tb.style.top = ((taak.start - d0)/60000 - van) * PX + "px";
  tb.style.height = taak.minuten * PX - 2 + "px";
  tb.classList.toggle("botst", botsingen().length > 0);
  document.getElementById("tb-tijd").textContent = blokTijd();
  const tv = document.getElementById("t-tijd"), tt = document.getElementById("t-tot");
  if (tv) tv.value = tijdVan(taak.start);
  if (tt) tt.textContent = "tot " + tijdVan(taak.start + taak.minuten*60000);
});

});
document.addEventListener("pointerup", ev => {
  if (!sleep) return;
  const s = sleep; sleep = null;
  if (s.modus === "klik"){
    if (Math.abs(ev.clientY - s.y0) > 4) return;          // dat was scrollen, geen klik
    const binnen = document.getElementById("tl-binnen"), van = Number(binnen.dataset.van);
    const min = Math.round(((ev.clientY - binnen.getBoundingClientRect().top) / PX + van) / 15) * 15;
    taak.start = dagBegin(taak.dag) + Math.max(0, Math.min(24*60 - taak.minuten, min)) * 60000;
  }
  tekenTaak();
});

document.addEventListener("keydown", ev => {
  const inVeld = ev.target.closest && ev.target.closest("input, textarea, select");
  if (ev.key === "?" && !inVeld){ ev.preventDefault(); return toonSneltoetsen(); }
  if (ev.key === "Escape" && document.querySelector(".overlay")) return document.querySelector(".overlay").remove();
  if (ev.key === "Escape"){ if (inVeld) return ev.target.blur(); if (plaatsing){ plaatsing = null; return teken(); } return (staat.geenAuto = true, sluitPaneel()); }
  if (ev.key === "Enter" && ev.target.dataset && ev.target.dataset.open) return openPaneel(Number(ev.target.dataset.open));
  if (ev.key === "Enter" && ev.target.dataset && ev.target.dataset.kies) return openLees(Number(ev.target.dataset.kies));
  if (staat.tab === "opruimen" && !taak && !antwoord && !inVeld && !ev.metaKey && !ev.ctrlKey && !ev.altKey){
    const lijst = opruimLijst().map(i => i.id), i = lijst.indexOf(staat.lees), id = staat.lees;
    if (ev.key === "j" || ev.key === "ArrowDown"){ ev.preventDefault(); if (lijst.length) openLees(lijst[Math.min(lijst.length-1, i+1)]); return; }
    if (ev.key === "k" || ev.key === "ArrowUp"){ ev.preventDefault(); if (lijst.length) openLees(lijst[Math.max(0, i-1)]); return; }
    if (id === null) return;
    if (ev.key === "e") return verplaats([id], "archief");
    if (ev.key === "v"){ ev.preventDefault(); return openKiezer(id, document.querySelector('#paneel [data-opbergen]')); }
    if (ev.key === "#" || ev.key === "Delete" || ev.key === "Backspace"){ ev.preventDefault(); return verplaats([id], "prullenbak"); }
    if (ev.key === "t") return openTaak(id);
    if (ev.key === " "){ ev.preventDefault(); staat.gekozen.has(id) ? staat.gekozen.delete(id) : staat.gekozen.add(id); return teken(); }
    return;
  }
  if (staat.tab !== "te_doen" || taak || antwoord) return;
  const id = staat.open;
  if ((ev.metaKey || ev.ctrlKey) && ev.key === "Enter" && id !== null){ ev.preventDefault(); return document.getElementById("goedkeuren")?.click(); }
  if (inVeld || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const lijst = teDoen().map(i => i.id), i = lijst.indexOf(id);
  if (ev.key === "j" || ev.key === "ArrowDown"){ ev.preventDefault(); if (lijst.length) openPaneel(lijst[Math.min(lijst.length-1, i+1)]); return; }
  if (ev.key === "k" || ev.key === "ArrowUp"){ ev.preventDefault(); if (lijst.length) openPaneel(lijst[Math.max(0, i-1)]); return; }
  if (id === null) return;
  if (ev.key === "e") return verplaats([id], "archief");
  if (ev.key === "v"){ ev.preventDefault(); return openKiezer(id, document.querySelector('#paneel [data-opbergen]')); }
  if (ev.key === "#" || ev.key === "Delete" || ev.key === "Backspace"){ ev.preventDefault(); return verplaats([id], "prullenbak"); }
  if (ev.key === "x") return document.getElementById("afwijzen")?.click();
  if (ev.key === "t") return openTaak(id);
  const n = Number(ev.key);
  if (n >= 1 && n <= D.projecten.length) return zetProject(id, D.projecten[n-1].naam);
});
