function plTijdlijnHTML(){
  const lijst = dagen[staat.planDag];
  if (lijst === undefined || lijst === "laden") return `<div class="tijdlijn"><div class="tl-laden">Loading calendar…</div></div>`;
  if (lijst.fout) return `<div class="melding">${ik("alert")}<div>${esc(lijst.fout)}</div></div>`;
  const w = D.werktijd || {begin:"09:00", eind:"17:00"}, d0 = dagBegin(staat.planDag);
  let van = Math.max(0, uurMin(w.begin) - 60), tot = Math.min(24*60, uurMin(w.eind) + 60);
  if (plaatsing && isoDag(new Date(plaatsing.start)) === staat.planDag){
    const sm = (plaatsing.start - d0)/60000;
    van = Math.min(van, Math.floor(sm/60)*60); tot = Math.max(tot, Math.ceil((sm + plaatsing.minuten)/60)*60);
  }
  // de werkdag vult de hoogte van het paneel precies: eerst geschat, na het tekenen gemeten (pasPlHoogteAan)
  const heledagN = lijst.filter(a => a.heledag).length;
  const sleutel = [innerHeight, staat.planDag, heledagN, lijst.length, !!plaatsing, van, tot].join("|");
  PLPX = plMaat.sleutel === sleutel ? plMaat.px
    : Math.max(0.8, Math.min(2.6, (window.innerHeight - 210 - (heledagN ? 34 : 0) - (lijst.length ? 22 : 0)) / (tot - van)));
  plTijdlijnHTML.laatste = {sleutel, van, tot};
  const y = m => (m - van) * PLPX;
  let h = "";
  if (uurMin(w.begin) > van) h += `<div class="buiten" style="top:0;height:${y(uurMin(w.begin))}px"></div>`;
  if (uurMin(w.eind) < tot) h += `<div class="buiten" style="top:${y(uurMin(w.eind))}px;height:${y(tot)-y(uurMin(w.eind))}px"></div>`;
  for (let m = van; m < tot; m += 30) h += `<div class="uur${m % 60 ? " half" : ""}" style="top:${y(m)}px">${m % 60 ? "" : `<span>${tweeCijfers(m/60)}:00</span>`}</div>`;
  h += afsprakenHTML(lijst, d0, van, tot, PLPX, false, true) + nuLijn(staat.planDag, van, tot, PLPX);
  if (plaatsing && isoDag(new Date(plaatsing.start)) === staat.planDag){
    const t = D.taken.find(x => x.id === plaatsing.id);
    h += `<div class="tb concept${plBotsingen().length ? " botst" : ""}" id="pl-blok" style="top:${y((plaatsing.start-d0)/60000)}px;height:${plaatsing.minuten*PLPX - 2}px">
            <b>${esc(t ? t.omschrijving : "Task")}</b><span id="pl-tijd">${blokTijdVan(plaatsing.start, plaatsing.minuten)}</span><div class="rek"></div></div>`;
  }
  const heledag = lijst.map((a, i) => ({...a, i})).filter(a => a.heledag);
  const soorten = new Set(lijst.filter(a => !a.heledag).map(a => a.voorlopig ? "voorlopig" : appTaakBij(a) ? "taak" : isFocus(a) ? "focus" : a.vrij ? "" : (a.soort || "eigen")));
  const legenda = [["voorlopig", "clock", "Tentative"], ["les", "les", "Class"], ["afdeling", "afdeling", "Department or team"], ["overleg", "mensen", "Meeting with others"], ["taak", "check", "Task from the app"], ["focus", "clock", "Protected"], ["eigen", "calendar", "Personal event"]]
    .filter(([k]) => soorten.has(k)).map(([k, i, l]) => `<span class="lg lg-${k}">${ik(i)}${l}</span>`).join("");
  return (legenda && soorten.size > 1 ? `<div class="legenda">${legenda}</div>` : "") + (heledag.length ? `<div class="heledag">${heledag.map(a => `<span class="klik" data-afs="${a.i}" tabindex="0">${esc(a.titel)}</span>`).join("")}</div>` : "") +
    `<div class="tijdlijn" id="pl-tijdlijn"><div class="tl-binnen" id="pl-binnen" data-van="${van}" style="height:${(tot-van)*PLPX}px">${h}</div></div>`;
}

let plMaat = {sleutel: null, px: null};
function pasPlHoogteAan(){
  const info = plTijdlijnHTML.laatste, binnen = document.getElementById("pl-binnen"), r = document.querySelector(".pl-rechts");
  if (!info || !binnen || !r || innerWidth <= 760 || plMaat.sleutel === info.sleutel) return;

}
// zonder het voorbeeld 'tijdelijk' te tonen: een dag op de achtergrond opnieuw ophalen

const botsingenVoor = (start, minuten) => {

// voorbeeld tijdens het slepen van een taak: het blok op het kwartier waar hij landt, met tijd en botsing
function toonVoorbeeld(k){
  const binnen = document.getElementById("pl-binnen"), tl = document.getElementById("pl-tijdlijn");
  const onder = document.elementFromPoint(k.x, k.y);
  let m = binnen && onder && onder.closest && onder.closest("#pl-tijdlijn") ? minuutOp(k.y) : null;
  let vb = document.getElementById("pl-voorbeeld");
  if (m === null){
    vb?.remove(); tl?.classList.remove("doel"); k.start = null;
    k.spook.hidden = false; k.spook.style.left = k.x + "px"; k.spook.style.top = k.y + "px";
    return;
  }
  const van = Number(binnen.dataset.van);
  m = Math.max(0, Math.min(24 * 60 - k.duur, m));
  k.start = dagBegin(staat.planDag) + m * 60000;
  if (!vb){ vb = document.createElement("div"); vb.id = "pl-voorbeeld"; vb.className = "tb concept voorbeeld"; binnen.append(vb); }
  vb.style.top = (m - van) * PLPX + "px"; vb.style.height = Math.max(16, k.duur * PLPX - 2) + "px";
  const botst = botsingenVoor(k.start, k.duur);
  vb.classList.toggle("botst", botst.length > 0);
  vb.innerHTML = `<b>${esc(k.taak.omschrijving)}</b><span>${blokTijdVan(k.start, k.duur)}${botst.length ? ` · overlaps ${esc(botst[0].titel)}` : ""}</span>`;
  tl.classList.add("doel"); k.spook.hidden = true;
}
// bij de rand van de agenda scrolt hij mee, zolang je sleept
let randLus = null;
function randScroll(){
  if (randLus) return;
  const stap = () => {
    const k = kaartSleep, r = document.querySelector(".pl-rechts");
    if (!k || !k.bezig || !r){ randLus = null; return; }
    const b = r.getBoundingClientRect(), rand = 48;
    let v = 0;
    if (k.x >= b.left && k.x <= b.right){
      if (k.y < b.top + rand) v = -Math.ceil((b.top + rand - k.y) / 4);
      else if (k.y > b.bottom - rand) v = Math.ceil((k.y - (b.bottom - rand)) / 4);
    }
    if (v){ const voor = r.scrollTop; r.scrollTop += v; if (r.scrollTop !== voor) toonVoorbeeld(k); }
    randLus = requestAnimationFrame(stap);
  };
  randLus = requestAnimationFrame(stap);
}
// loslaten op de agenda: meteen inplannen, met Undo; het blok kun je daarna nog verslepen of oprekken
async function planMetSlepen(t, start, minuten){
  const dag = isoDag(new Date(start));
  t.gepland = lokaalIso(start); t.minuten = minuten;
  if (Array.isArray(dagen[dag])) dagen[dag] = [...dagen[dag], {titel: t.omschrijving, start: lokaalIso(start),
    eind: lokaalIso(start + minuten * 60000), heledag: false, vrij: false, kalender: D.agenda_naam || ""}];
  teken();
  const j = await stil("taak-plannen", {id: t.id, start: lokaalIso(start), minuten});
  if (!j.ok){ t.gepland = null; toast(j.melding, true); laad(); return verversDag(dag); }
  toast(j.melding, false, {label: "Undo", doe: async () => {
    const r = await stil("afspraak-weg", {id: t.id});
    toast(r.melding, !r.ok); await laad(); verversDag(dag);
  }});
  await laad();
  verversDag(dag);
}

function minuutOp(clientY){
  const binnen = document.getElementById("pl-binnen");
  if (!binnen) return null;
  const r = binnen.getBoundingClientRect();
  if (clientY < r.top || clientY > r.bottom) return null;
  return Math.round(((clientY - r.top) / PLPX + Number(binnen.dataset.van)) / 15) * 15;
}
function plaats(id, clientY){
  const t = D.taken.find(x => x.id === id), m = minuutOp(clientY);
  if (!t || m === null) return false;
  const duur = t.minuten || 30;
  plaatsing = {id, minuten: duur, start: dagBegin(staat.planDag) + Math.max(0, Math.min(24*60 - duur, m)) * 60000};
  gekozenKaart = null;
  teken();
  return true;
}

document.addEventListener("pointerdown", ev => {
  if (staat.tab !== "planning") return;
  const kaartEl = ev.target.closest("[data-kaart]");
  if (kaartEl && !ev.target.closest("button, a, input, textarea, select, summary") && ev.pointerType !== "touch" && ev.button === 0){
    ev.preventDefault();                       // geen tekst selecteren als je een kaart oppakt
    window.getSelection()?.removeAllRanges();
    kaartSleep = {id: Number(kaartEl.dataset.kaart), x0: ev.clientX, y0: ev.clientY, x: ev.clientX, y: ev.clientY,
                  spook: null, kaartEl, bezig: false, start: null};
    return;
  }
  const blok = ev.target.closest("#pl-blok");
  if (blok && plaatsing){
    plSleep = {modus: ev.target.closest(".rek") ? "rek" : "schuif", y0: ev.clientY, start0: plaatsing.start, duur0: plaatsing.minuten};
    blok.setPointerCapture(ev.pointerId); ev.preventDefault();
  }
});
document.addEventListener("pointermove", ev => {
  if (kaartSleep){
    const k = kaartSleep;
    k.x = ev.clientX; k.y = ev.clientY;
    if (!k.bezig && Math.hypot(ev.clientX - k.x0, ev.clientY - k.y0) > 5){

      if (!k.taak){ kaartSleep = null; return; }
      k.bezig = true; k.duur = k.taak.minuten || 30;
      document.documentElement.classList.add("sleept-taak"); k.kaartEl.classList.add("opgepakt"); sluitPop();
      k.spook = Object.assign(document.createElement("div"), {className: "spook", textContent: `${k.taak.omschrijving} · ${duurTekst(k.duur)}`});
      document.body.append(k.spook);
      randScroll();
    }
    if (k.bezig) toonVoorbeeld(k);
    return;
  }
  if (!plSleep || !plaatsing) return;
  const stap = Math.round((ev.clientY - plSleep.y0) / PLPX / 15) * 15, d0 = dagBegin(staat.planDag);
  if (plSleep.modus === "schuif") plaatsing.start = d0 + Math.min(24*60 - plaatsing.minuten, Math.max(0, (plSleep.start0 - d0)/60000 + stap)) * 60000;
  else plaatsing.minuten = Math.max(15, Math.min(24*60 - (plaatsing.start - d0)/60000, plSleep.duur0 + stap));
  const blok = document.getElementById("pl-blok"), van = Number(document.getElementById("pl-binnen").dataset.van);
  blok.style.top = ((plaatsing.start - d0)/60000 - van) * PLPX + "px";
  blok.style.height = plaatsing.minuten * PLPX - 2 + "px";
  blok.classList.toggle("botst", plBotsingen().length > 0);
  document.getElementById("pl-tijd").textContent = blokTijdVan(plaatsing.start, plaatsing.minuten);
});
document.addEventListener("pointerup", ev => {
  if (kaartSleep){
    const k = kaartSleep; kaartSleep = null;
    if (k.bezig){
      k.spook?.remove(); document.getElementById("pl-voorbeeld")?.remove();
      document.getElementById("pl-tijdlijn")?.classList.remove("doel");
      document.documentElement.classList.remove("sleept-taak"); k.kaartEl.classList.remove("opgepakt");
      if (k.start !== null) planMetSlepen(k.taak, k.start, k.duur);
      return;
    }
    gekozenKaart = gekozenKaart === k.id ? null : k.id; teken();   // klik zonder slepen: kiezen, dan een tijd aantikken
    return;
  }
  if (plSleep){ plSleep = null; return teken(); }
  if (staat.tab === "planning" && gekozenKaart && ev.target.closest("#pl-tijdlijn") && !ev.target.closest("#pl-blok")) plaats(gekozenKaart, ev.clientY);
  else if (staat.tab === "planning" && ev.pointerType === "touch" && ev.target.closest("[data-kaart]") && !ev.target.closest("button")){
    const id = Number(ev.target.closest("[data-kaart]").dataset.kaart); gekozenKaart = gekozenKaart === id ? null : id; teken();
  }
});
document.addEventListener("click", async ev => {
  const t = ev.target.closest("button");
  if (!t || staat.tab !== "planning") return;
  if (t.dataset.pldag !== undefined){
    sluitPop();
    const stap = Number(t.dataset.pldag);
    staat.planDag = stap === 0 ? vandaagWerkdag() : isoDag(new Date(dagBegin(staat.planDag) + stap * 86400000 + 3600000));
    if (plaatsing){ const sm = plaatsing.start - dagBegin(isoDag(new Date(plaatsing.start))); plaatsing.start = dagBegin(staat.planDag) + sm; }
    return teken();
  }
  if (t.id === "pl-annuleer"){ plaatsing = null; return teken(); }
  if (t.id === "afsluit-start"){ afsluit = "laden"; teken(); const j = await stil("afsluiten", {}); afsluit = j.ok ? j : null; if (!j.ok) toast(j.melding, true); return teken(); }
  if (t.id === "afsluit-dicht"){ afsluit = null; return teken(); }
  if (t.dataset.later !== undefined){

    const taakRij = D.taken.find(x => x.id === id); if (taakRij) taakRij.later = naarLater ? 1 : 0; teken();
    const j = await stil("taak-later", {id, later: naarLater}); if (!j.ok) toast(j.melding, true); return laad();
  }
  if (t.id === "pl-bevestig" && plaatsing){

    plaatsing = null;
    const taakRij = D.taken.find(x => x.id === p.id); if (taakRij){ taakRij.gepland = lokaalIso(p.start); taakRij.minuten = p.minuten; }
    teken();
    const j = await stil("taak-plannen", {id: p.id, start: lokaalIso(p.start), minuten: p.minuten});
    toast(j.melding, !j.ok);
    await laad();
    verversDag(dag);
  }
});

// ---------------- Opbergen in een map ----------------
let kiezer = null;   // {id, mappen, voorstellen, zoek, index, el}
async function openKiezer(id, anker, ids){
  sluitKiezer();
  const el = document.createElement("div");
  el.className = "kiezer";
  el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "File in a folder");
  const terug = document.activeElement;
  el.innerHTML = `<input type="text" id="kiezer-zoek" placeholder="Find a folder…" autocomplete="off"><div class="opties"><div class="leeg2">Loading folders…</div></div>`;
  document.body.append(el);
  const r = anker ? anker.getBoundingClientRect() : {left: innerWidth/2 - 190, top: innerHeight/3, bottom: innerHeight/3};
  const boven = r.top > innerHeight * 0.55;
  el.style.left = Math.max(16, Math.min(innerWidth - el.offsetWidth - 16, r.left - 40)) + "px";
  if (boven) el.style.bottom = (innerHeight - r.top + 8) + "px"; else el.style.top = (r.bottom + 8) + "px";
  kiezer = {id, ids: ids && ids.length ? ids : [id], mappen: [], voorstellen: [], zoek: "", index: 0, el, inbox: "", archief: "", nieuwKan: false, terug};
  el.querySelector("input").focus();
  const j = await stil("mappen", {id});
  if (!kiezer || kiezer.id !== id) return;
  if (!j.ok){ sluitKiezer(); return toast(j.melding, true); }
  kiezer.mappen = j.mappen; kiezer.voorstellen = j.voorstellen;
  kiezer.inbox = j.inbox || ""; kiezer.archief = j.archief || ""; kiezer.nieuwKan = !!j.nieuw_kan;
  tekenKiezer();
}
function kiezerGroep(m){
  const l = m.toLowerCase(), inbox = (kiezer.inbox || "").toLowerCase(), arch = (kiezer.archief || "").split("/").pop().toLowerCase();
  if (inbox && l.startsWith(inbox + "/")) return "In your inbox";
  if (arch && l.startsWith(arch + "/")) return "In the archive";
  return "Other folders";
}
function kiezerOpties(){
  const ruw = kiezer.zoek.trim(), z = ruw.toLowerCase();
  const voorstel = z ? [] : kiezer.voorstellen;
  const rest = kiezer.mappen.filter(m => !z || m.toLowerCase().includes(z)).filter(m => !voorstel.some(v => v.map === m));
  const opties = [...voorstel.map(v => ({map: v.map, waarom: v.reden, voorstel: true})), ...rest.map(m => ({map: m, groep: kiezerGroep(m)}))];
  // geen map met precies deze naam? Dan kun je hem maken
  const bestaat = kiezer.mappen.some(m => m.toLowerCase() === z || m.split("/").pop().toLowerCase() === z);
  if (z && kiezer.nieuwKan && !bestaat) opties.push({nieuw: ruw.replace(/^\/+|\/+$/g, "")});
  return opties;
}
function tekenKiezer(){
  const opties = kiezerOpties();
  kiezer.index = Math.min(kiezer.index, Math.max(0, opties.length - 1));
  const inbox = (kiezer.inbox || "").toLowerCase();
  const regel = (o, i) => {
    if (o.nieuw) return `<button class="optie nieuw${i === kiezer.index ? " actief" : ""}" data-nieuwemap="${esc(o.nieuw)}">${ik("folder")}<span>New folder <b>${esc(o.nieuw)}</b>${kiezer.inbox && !kiezer.archief.startsWith("[Gmail]") ? ` <span class="pad">in your inbox</span>` : ""}</span></button>`;
    let delen = o.map.split("/");
    if (inbox && delen.length > 1 && delen[0].toLowerCase() === inbox) delen = delen.slice(1);   // 'Inbox/' hoef je niet te zien
    const naam = delen.pop();
    return `<button class="optie${i === kiezer.index ? " actief" : ""}" data-map="${esc(o.map)}">${ik("folder")}<span>${esc(naam)}${delen.length ? ` <span class="pad">${esc(delen.join(" / "))}</span>` : ""}</span>${o.waarom ? `<span class="waarom">${esc(o.waarom)}</span>` : ""}</button>`; };
  const groepen = new Set(opties.filter(o => o.groep).map(o => o.groep));
  let html = "", vorige = null;
  opties.forEach((o, i) => {
    if (o.voorstel && i === 0) html += `<div class="kop2">Suggested</div>`;
    if (!o.voorstel && !o.nieuw){
      const kop = groepen.size > 1 ? o.groep : (opties.some(x => x.voorstel) ? "All folders" : null);
      if (kop && kop !== vorige){ html += `<div class="kop2">${esc(kop)}</div>`; vorige = kop; }
    }
    if (o.nieuw) html += `<div class="kop2">Create</div>`;
    html += regel(o, i);
  });
  kiezer.el.querySelector(".opties").innerHTML = opties.length ? html : `<div class="leeg2">No folder found</div>`;
  if (!kiezer.el.querySelector(".voet")) kiezer.el.insertAdjacentHTML("beforeend", `<div class="voet"><span><kbd>↑</kbd><kbd>↓</kbd> <kbd>↵</kbd> <kbd>Esc</kbd> · type a name for a new folder</span><button class="knop klein" id="kiezer-vernieuw" title="Fetch the folders from Mail again">Refresh</button></div>`);
  kiezer.el.querySelector(".optie.actief")?.scrollIntoView({block:"nearest"});
}
async function maakMap(naam){
  const id = kiezer.id, ids = kiezer.ids;
  kiezer.el.querySelector(".opties").innerHTML = `<div class="leeg2">Creating folder in Mail…</div>`;
  const j = await stil("map-maken", {id, naam});
  if (!j.ok){ toast(j.melding, true); if (kiezer) tekenKiezer(); return; }
  sluitKiezer();
  verplaats(ids, "map:" + j.pad);
}
function sluitKiezer(){
  if (!kiezer) return;
  const terug = kiezer.terug;
  kiezer.el.remove(); kiezer = null;
  if (terug && terug.isConnected && terug !== document.body) terug.focus(); else zetLijstFocus();
}
function kiesMap(map){
  const ids = kiezer.ids; sluitKiezer();
  verplaats(ids, "map:" + map);
}
document.addEventListener("input", ev => { if (kiezer && ev.target.id === "kiezer-zoek"){ kiezer.zoek = ev.target.value; kiezer.index = 0; tekenKiezer(); } });
document.addEventListener("keydown", ev => {
  if (!kiezer) return;
  const opties = kiezerOpties();
  if (ev.key === "ArrowDown"){ ev.preventDefault(); ev.stopImmediatePropagation(); kiezer.index = Math.min(opties.length - 1, kiezer.index + 1); return tekenKiezer(); }
  if (ev.key === "ArrowUp"){ ev.preventDefault(); ev.stopImmediatePropagation(); kiezer.index = Math.max(0, kiezer.index - 1); return tekenKiezer(); }
  if (ev.key === "Enter"){ ev.preventDefault(); ev.stopImmediatePropagation(); const o = opties[kiezer.index];
    if (o) o.nieuw ? maakMap(o.nieuw) : kiesMap(o.map); return; }
  if (ev.key === "Escape"){ ev.preventDefault(); ev.stopImmediatePropagation(); return sluitKiezer(); }
  if (ev.target.id === "kiezer-zoek") ev.stopImmediatePropagation();   // typen in het zoekveld triggert geen sneltoetsen
}, true);
document.addEventListener("mousedown", ev => {
  if (!kiezer) return;
  const o = ev.target.closest(".kiezer .optie");
  if (o){ ev.preventDefault(); return o.dataset.nieuwemap !== undefined ? maakMap(o.dataset.nieuwemap) : kiesMap(o.dataset.map); }
  if (ev.target.closest("#kiezer-vernieuw")){ ev.preventDefault(); const id = kiezer.id; kiezer.el.querySelector(".opties").innerHTML = `<div class="leeg2">Loading folders…</div>`;
    stil("mappen", {id, vernieuw: true}).then(j => { if (kiezer && j.ok){ kiezer.mappen = j.mappen; kiezer.voorstellen = j.voorstellen; tekenKiezer(); } }); return; }
  if (!ev.target.closest(".kiezer")) sluitKiezer();
}, true);
document.addEventListener("click", async ev => {
  const l = ev.target.closest("[data-afbladen]");
  if (l){ laadHtml(Number(l.dataset.afbladen), true); return ververs(Number(l.dataset.afbladen)); }
  const a = ev.target.closest("[data-afbaltijd]");

    const id = Number(a.dataset.afbaltijd), aan = a.dataset.aan === "1";
    const j = await stil("afbeeldingen-altijd", {adres: a.dataset.adres, aan});
    toast(j.melding, !j.ok);
    // andere mails van dezelfde afzender opnieuw laten opmaken
    Object.keys(htmlCache).forEach(k => { const h = htmlCache[k]; if (h && h.adres === a.dataset.adres) delete htmlCache[k]; });
    laadHtml(id, aan); return ververs(id);
  }
});
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-weergave]");
  if (!b) return;
  weergave = b.dataset.weergave;
  if (document.documentElement.dataset.theme === "dark") donkerOpgemaakt = weergave === "opgemaakt";

document.addEventListener("toggle", ev => {

    const rustig = matchMedia("(prefers-reduced-motion: reduce)").matches;

}, true);
// ---------------- kolombreedtes en inklappen (onthouden per browser) ----------------

try { Object.assign(breedte, JSON.parse(localStorage.getItem("mailagent-breedte") || "{}")); ingeklapt = localStorage.getItem("mailagent-ingeklapt") === "1"; } catch(e){}

document.addEventListener("keydown", ev => {

let kolomSleep = null;
for (const [id, soort] of [["greep-lijst", "lijst"]]){

window.addEventListener("resize", werkPaneelInertBij);

// ---------------- thema: Automatic (Paper overdag, Dark 's avonds via macOS), Paper, Light, Dark ----------------

const donkerSysteem = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
function themaKeuze(){ try { return localStorage.getItem("attache-thema") || "auto"; } catch(e){ return "auto"; } }
function pasThemaToe(){
  const k = themaKeuze(), oud = document.documentElement.dataset.theme;
  const nieuw = k === "auto" ? (donkerSysteem && donkerSysteem.matches ? "dark" : "paper") : k;
  document.documentElement.dataset.theme = nieuw; document.documentElement.dataset.themaKeuze = k;
  document.getElementById("thema-naam").textContent = (THEMAS.find(t => t[0] === k) || THEMAS[0])[1];
  if (oud !== nieuw && D){ document.getElementById("paneel").dataset.sig = ""; document.getElementById("paneel").dataset.sleutel = ""; teken(); }
}
if (donkerSysteem) donkerSysteem.addEventListener("change", pasThemaToe);
document.getElementById("thema-knop").addEventListener("click", ev => {
  ev.stopPropagation();
  const doos = document.getElementById("thema"), open = doos.querySelector(".thema-menu");
  if (open) return open.remove();

  doos.insertAdjacentHTML("beforeend", `<div class="thema-menu" role="menu">${THEMAS.map(([w, naam, uitleg]) =>
    `<button role="menuitemradio" aria-checked="${w === k}" class="${w === k ? "aan" : ""}" data-thema="${w}">${ik("check")}${naam}${uitleg ? `<span class="meta">${uitleg}</span>` : ""}</button>`).join("")}</div>`);
});
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-thema]");
  document.querySelector(".thema-menu")?.remove();
  if (!b) return;

pasThemaToe();
