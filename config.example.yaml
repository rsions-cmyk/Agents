# Copy this file to config.yaml and adjust it.
# config.yaml is in .gitignore, so your addresses and rules never end up in git.
# The setting names stay in Dutch, because the app reads them by these names.

# Folder for the database, log files and drafts (relative to this file).
data_dir: data

# Which mail source(s) do you use? You can switch on several at once.
#   outlook    Microsoft 365 through Microsoft Graph (BUas account). Creates drafts
#              as replies in your Drafts folder. Needs an app registration, see the README.
#   applemail  Any account that is in Apple Mail (an ISTTE address, for example).
#   map        Reads .eml files from a folder. Useful for testing.
bronnen:
  # BUas email through the Exchange account in Apple Mail. Check the names with:
  #   osascript -e 'tell application "Mail" to get name of every account'
  #   osascript -e 'tell application "Mail" to get name of every mailbox of account "Exchange"'
  - type: applemail
    naam: buas
    account: "Exchange"          # the account name as Apple Mail shows it
    mailbox: "Inbox"
    archief: "Archive"           # where Archive moves the email
    prullenbak: "Deleted Items"  # where Move to Bin moves the email
    allen_beantwoorden: false    # true: replies also go to everyone in To and CC
  # Google account in Apple Mail. Gmail usually calls the inbox "INBOX" (capitals).
  - type: applemail
    naam: google
    account: "Google"            # the account name as Apple Mail shows it
    mailbox: "INBOX"
    archief: "[Gmail]/All Mail"  # Gmail: archiving takes it out of the inbox, it stays in All Mail
    prullenbak: "[Gmail]/Trash"  # the real Gmail bin, not a label called "Trash"
  # - type: outlook               # only if you have an app registration in Entra
  #   naam: buas-graph
  #   client_id: "FILL-IN"
  #   tenant: organizations
  #   map: inbox
  # - type: map                   # .eml files from a folder, for testing
  #   naam: test
  #   pad: tests/fixtures

# Each round looks back this many days for unprocessed email in your inbox,
# oldest first, at most max_mails_per_run per account. Email already processed is skipped.
terugkijken_dagen: 14
max_mails_per_run: 30

# Fixed mail rounds on working days. No new email comes in between rounds, so you are
# not interrupted all the time. After a change, run: scripts/mailagent.sh rondes-installeren
rondes: ["07:45", "12:45", "16:15"]

# Don't send newsletters and advertising (email with an unsubscribe link or marked 'bulk')
# to Claude; put them straight in Skipped. Senders with a rule of their own still go through.
nieuwsbrieven_overslaan: true

# Claude settings. effort: low | medium | high
#   backend: claude-code  uses Claude Code on your Mac with your usual Claude sign-in (no API key)
#   backend: api          uses the Claude API with a key from the macOS keychain
claude:
  backend: claude-code
  pad: claude                    # or the full path, see: which claude
  claude_code_model: opus
  model: claude-opus-5-5         # only for backend: api
  sorteren_effort: low
  uitwerken_effort: medium

# Projects. Each name must match a file in projecten/<name>.md.
projecten:
  - onderwijs
  - onderzoek
  - istte
  - overig

# Fixed rules, applied locally before Claude. The first rule that matches wins.
# 'van' (from) and 'onderwerp' (subject) are text fragments (case doesn't matter).
regels:
  - van: "@istte.org"
    project: istte
  - onderwerp: "ISTTE"
    project: istte
  - van: "@students.buas.nl"
    project: onderwijs
  # - van: "nieuwsbrief@"
  #   project: overig
  #   actie: ter_info

# This email never goes to Claude. It only appears under "Check it yourself".
nooit_naar_claude:
  van:
    # - "@mijnbank.nl"
    # - "huisarts"
  onderwerp:
    # - "vertrouwelijk"
    # - "medisch"

# Text replaced before anything goes to Claude (regular expressions).
# By default: student numbers of 6 or 7 digits, and IBANs.
anonimiseren:
  - patroon: '\b\d{6,7}\b'
    vervang: '[NUMMER]'
  - patroon: '\b[A-Z]{2}\d{2}[A-Z0-9]{4}\d{7,16}\b'
    vervang: '[IBAN]'

# Calendar for 'Create and schedule task'. Your Exchange calendar must be in the Calendar app;
# events the app creates there also appear in Outlook. Look up the names with:
#   scripts/mailagent.sh agendas
agenda:
  kalender: "Calendar"           # the calendar's name
  account: "Exchange"            # needed when several calendars have the same name
  bezet:                         # which calendars count as busy when finding free times (empty = all)
    - "Exchange/Calendar"
  werkdagen: [1, 2, 3, 4, 5]     # 1 = Monday
  werktijd: "09:00-17:00"
  dagen_vooruit: 10
  herinnering_minuten: 15        # reminder before every scheduled task (0 = none)
  prive: true                    # with a lock: colleagues only see that you are busy
  # Only events from the calendar above go to Claude to be classified (class, meeting, ...). Calendars that only
  # count as busy (family, personal) are classified by the app's own rules. To include more calendars:
  # naar_claude: ["Exchange/Calendar", "iCloud/Werk"]
  # Classes get their own colour in Planning. By default the app recognises them by words such as
  # college, werkcollege, lecture, tutorial and les. If your classes are in a calendar of their own
  # (a timetable) or come from one organiser, add that here:
  # lessen:
  #   kalenders: ["Rooster"]
  #   organisatoren: ["rooster@buas.nl"]
  #   trefwoorden: ["college", "werkcollege", "TMO", "DDE"]

# Email with a task gets a coloured flag in Apple Mail (a follow-up flag in Outlook,
# a star in Gmail). Ticking the task off removes the flag. Rename that flag colour in Apple Mail
# to "Scheduled": right-click the flag in the sidebar under Flagged.
# Colours (use the Dutch word): rood, oranje, geel, groen, blauw, paars, grijs.
markeren:
  aan: true
  kleur: blauw

# The local app page
web:
  host: 127.0.0.1
  poort: 8765

# Senders you never want to miss: their email always goes to To do (high priority, never
# skipped) and you get a notification on your Mac as soon as it arrives. An address or a domain.
# You can also click the star next to a sender in the app.
belangrijk:
  # - "voorzitter@istte.org"
  # - "@istte.org"

# Awaiting reply: if you send an email with a question and no reply has come after this many
# working days, it goes back to the top of To do.
opvolgen:
  aan: true
  werkdagen: 3

# Email you answer through the app (Reply in Mail or Send) is marked as read and moved to your archive once the
# reply has gone: straight after Send, and after Reply in Mail as soon as you send the reply in Mail.
# A draft you throw away leaves the email in your inbox. false: leave answered email where it is.
archiveren_na_antwoord: true

# Notifications on your Mac for email from important senders (only between 07:00 and 22:00).
meldingen:
  aan: true
  elke_minuten: 15
  ochtend: true          # after the first round of a working day, one notification about your day
