# Kopieer dit bestand naar config.yaml en pas het aan.
# config.yaml staat in .gitignore, zodat je adressen en regels niet in git belanden.

# Map voor de database, logbestanden en concepten (relatief aan dit bestand).
data_dir: data

# Welke mailbron(nen) gebruik je? Je kunt er meerdere tegelijk aanzetten.
#   outlook    Microsoft 365 via Microsoft Graph (BUas-account). Maakt concepten
#              als antwoord in je map Concepten. Vereist een app-registratie, zie README.
#   applemail  Elk account dat in Apple Mail staat (bijvoorbeeld een ISTTE-adres).
#   map        Leest .eml-bestanden uit een map. Handig om te testen.
bronnen:
  # BUas-mail via het Exchange-account in Apple Mail. Controleer de namen met:
  #   osascript -e 'tell application "Mail" to get name of every account'
  #   osascript -e 'tell application "Mail" to get name of every mailbox of account "Exchange"'
  - type: applemail
    naam: buas
    account: "Exchange"          # naam van het account zoals Apple Mail het toont
    mailbox: "Inbox"
    archief: "Archive"           # waar 'Archiveren' de mail heen verplaatst
    prullenbak: "Deleted Items"  # waar 'Naar prullenbak' de mail heen verplaatst
    allen_beantwoorden: false    # true: antwoord gaat ook naar iedereen in Aan en CC
  # Google-account in Apple Mail. Gmail noemt het postvak meestal "INBOX" (hoofdletters).
  - type: applemail
    naam: google
    account: "Google"            # naam van het account zoals Apple Mail het toont
    mailbox: "INBOX"
    archief: "[Gmail]/All Mail"  # Gmail: archiveren = uit de inbox, blijft in All Mail
    prullenbak: "[Gmail]/Trash"  # de echte Gmail-prullenbak, niet een label dat "Trash" heet
  # - type: outlook               # alleen als je een app-registratie in Entra hebt
  #   naam: buas-graph
  #   client_id: "VUL-IN"
  #   tenant: organizations
  #   map: inbox
  # - type: map                   # .eml-bestanden uit een map, om te testen
  #   naam: test
  #   pad: tests/fixtures

# Elke ronde kijkt zoveel dagen terug naar mail in je inbox die nog niet verwerkt is,
# oudste eerst, hoogstens max_mails_per_run per account. Al verwerkte mail wordt overgeslagen.
terugkijken_dagen: 14
max_mails_per_run: 30

# Vaste mailrondes op werkdagen. Tussen de rondes komt er geen nieuwe mail binnen, zodat je
# niet steeds onderbroken wordt. Na een wijziging: scripts/mailagent.sh rondes-installeren
rondes: ["07:45", "12:45", "16:15"]

# Nieuwsbrieven en reclame (mail met een afmeldlink of de markering 'bulk') niet naar Claude
# sturen, maar meteen bij Overgeslagen zetten. Afzenders met een eigen regel gaan wel door.
nieuwsbrieven_overslaan: true

# Claude-instellingen. effort: low | medium | high
#   backend: claude-code  gebruikt Claude Code op je Mac met je gewone Claude-login (geen API-sleutel)
#   backend: api          gebruikt de Claude API met een sleutel uit de macOS-sleutelhanger
claude:
  backend: claude-code
  pad: claude                    # of het volledige pad, zie: which claude
  claude_code_model: opus
  model: claude-opus-5-5         # alleen voor backend: api
  sorteren_effort: low
  uitwerken_effort: medium

# Projecten. De naam moet overeenkomen met een bestand in projecten/<naam>.md.
projecten:
  - onderwijs
  - onderzoek
  - istte
  - overig

# Vaste regels, lokaal toegepast vóór Claude. De eerste regel die past, wint.
# 'van' en 'onderwerp' zijn tekstfragmenten (hoofdletters maken niet uit).
regels:
  - van: "@istte.org"
    project: istte
  - onderwerp: "ISTTE"
    project: istte
  - van: "@students.buas.nl"
    project: onderwijs
  # - van: "nieuwsbrief@"
  #   project: overig
  #   actie: ter_info

# Deze mails gaan nooit naar Claude. Ze komen alleen als 'handmatig' in je overzicht.
nooit_naar_claude:
  van:
    # - "@mijnbank.nl"
    # - "huisarts"
  onderwerp:
    # - "vertrouwelijk"
    # - "medisch"

# Tekst die vervangen wordt vóór iets naar Claude gaat (reguliere expressies).
# Standaard: studentnummers van 6 of 7 cijfers en IBAN-nummers.
anonimiseren:
  - patroon: '\b\d{6,7}\b'
    vervang: '[NUMMER]'
  - patroon: '\b[A-Z]{2}\d{2}[A-Z0-9]{4}\d{7,16}\b'
    vervang: '[IBAN]'

# Agenda voor 'Taak maken en inplannen'. Je Exchange-agenda moet in de app Agenda staan;
# afspraken die de app daar maakt, verschijnen ook in Outlook. Namen opzoeken met:
#   scripts/mailagent.sh agendas
agenda:
  kalender: "Calendar"           # naam van de agenda
  account: "Exchange"            # nodig als meerdere agenda's dezelfde naam hebben
  bezet:                         # welke agenda's tellen als bezet bij vrije momenten (leeg = alle)
    - "Exchange/Calendar"
  werkdagen: [1, 2, 3, 4, 5]     # 1 = maandag
  werktijd: "09:00-17:00"
  dagen_vooruit: 10
  herinnering_minuten: 15        # herinnering vooraf bij elke ingeplande taak (0 = geen)
  prive: true                    # met slotje: collega's zien alleen dat je bezet bent
  # Lessen krijgen in Planning hun eigen kleur. Standaard herkent de app ze aan woorden als
  # college, werkcollege, lecture, tutorial en les. Staan je lessen in een eigen (rooster)agenda
  # of komen ze van een vaste organisator, zet die dan hier:
  # lessen:
  #   kalenders: ["Rooster"]
  #   organisatoren: ["rooster@buas.nl"]
  #   trefwoorden: ["college", "werkcollege", "TMO", "DDE"]

# Mail met een taak krijgt in Apple Mail een gekleurde vlag (in Outlook een opvolgvlag,
# in Gmail een ster). Afvinken haalt de vlag weg. Hernoem die vlagkleur in Apple Mail naar
# "Ingepland": rechtsklik op de vlag in de zijbalk onder Gemarkeerd.
# Kleuren: rood, oranje, geel, groen, blauw, paars, grijs.
markeren:
  aan: true
  kleur: blauw

# Lokale goedkeuringspagina
web:
  host: 127.0.0.1
  poort: 8765

# Afzenders die je nooit wilt missen: hun mail komt altijd in Te doen (hoge prioriteit, nooit
# overgeslagen) en je krijgt een melding op je Mac zodra hij binnenkomt. Een adres of een domein.
# Je kunt ook in de app op het sterretje bij een afzender klikken.
belangrijk:
  # - "voorzitter@istte.org"
  # - "@istte.org"

# Wacht op antwoord: stuur je een mail met een vraag en komt er na zoveel werkdagen geen
# antwoord, dan staat hij weer bovenaan Te doen.
opvolgen:
  aan: true
  werkdagen: 3

# Meldingen op je Mac voor mail van belangrijke afzenders (alleen tussen 07:00 en 22:00).
meldingen:
  aan: true
  elke_minuten: 15
  ochtend: true          # na de eerste ronde op een werkdag één melding met je dag
