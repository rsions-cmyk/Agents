[project]
name = "mailagent"
version = "0.1.0"
description = "Persoonlijke e-mailworkflow met Claude: sorteren per project, concepten voorbereiden, mens keurt goed."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.12",
  "pydantic>=2.6",
  "pyyaml>=6",
]

[project.optional-dependencies]
outlook = ["msal>=1.28", "httpx>=0.27"]
dev = ["pytest>=8"]

[project.scripts]
mailagent = "mailagent.cli:main"

[tool.setuptools]
packages = ["mailagent", "mailagent.sources"]
